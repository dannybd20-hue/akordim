</style>

<script>
const WA_ICON='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5 0a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.7-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-1 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3Z"/></svg>';
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function first(n){return (n||'').split(' ')[0]}
function waLink(p,t){/* בלי אימוג'י – בחלק מהטלפונים הם מגיעים כ־� */t=String(t||'').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\uFE0F\u200D]/gu,'').replace(/[ \t]+\n/g,'\n').replace(/ {2,}/g,' ');p=(p||'').replace(/\D/g,'');if(p.startsWith('0'))p='972'+p.slice(1);return `https://wa.me/${p}?text=${encodeURIComponent(t)}`}
function fmtPhone(p){p=(p||'').replace(/\D/g,'');return p.length===10?p.slice(0,3)+'-'+p.slice(3):p}
const TODAY_KEY=new Date().toISOString().slice(0,10);
const SIGN='בברכה,\nדני בן דוד\nקצין בטיחות בתעבורה\nמרחב ירושלים';

/* ===== קבוצות לפי ציון ===== */
const CATS=[
  ['demote','הורדה לחניכות','var(--bad)'],
  ['warn','אזהרה · חודש שני','var(--bad)'],
  ['drop','ירידה חדה מהחודש הקודם','var(--bad)'],
  ['low','מתחת ל־25 · חודש ראשון','var(--bad)'],
  ['up','השתפרו – עלו מעל 25','var(--ok)'],
  ['b25','25–35','var(--warn)'],
  ['b35','35–50','var(--accent)'],
  ['b50','50–70','var(--ok)'],
  ['b70','70 ומעלה','var(--ok)']
];
function streakAt(v,m){let k=0;for(let j=m;j>=0;j--){const x=v.s[j];if(x==null||x>=25)break;k++}return k}
function catOf(v,m){const x=v.s[m];if(x==null)return null;if(x<25){const k=streakAt(v,m);if(k>=3)return 'demote';if(k===2)return 'warn';let pv=null;for(let j=m-1;j>=0;j--)if(v.s[j]!=null){pv=v.s[j];break}/* ירידה: בחודש הקודם היה ציון טוב (35+) או שהציון צנח ב־20+ נקודות */return pv!=null&&(pv>=35||pv-x>=20)?'drop':'low'}if(m>0&&v.s[m-1]!=null&&v.s[m-1]<25)return 'up';return x<35?'b25':x<50?'b35':x<70?'b50':'b70'}
function scCls(x){return x==null?'':x<25?'sc-low':x<35?'sc-mid':x<70?'sc-good':'sc-top'}

/* ===== הודעות ===== */
const TIPS={
  'חריגות מהירות':'לשמור על המהירות המותרת – גם בנסיעה לאירוע.',
  'בלימות':'לשמור מרחק מהרכב שלפניך ולהאט מוקדם, כדי לבלום בהדרגה ולא בבת אחת.',
  'תאוצות':'להאיץ בהדרגה – בלי ללחוץ חזק על הגז ביציאה מעצירה או מרמזור.',
  'פניות שמאלה':'להאט לפני הפנייה שמאלה ולהיכנס אליה במהירות נמוכה.',
  'פניות ימינה':'להאט לפני הפנייה ימינה ולהיכנס אליה במהירות נמוכה.',
  'מעגל תנועה':'להיכנס למעגל תנועה לאט ולצאת ממנו בלי להאיץ חזק.',
  'מעבר נתיב':'לעבור נתיב בהדרגה, עם איתות ובלי תנועות חדות בהגה.',
  'עקיפות':'לעקוף רק כשבטוח, בלי האצה חדה.'
};
function topEv(v){return v.ev?Object.entries(v.ev).filter(e=>e[1][1]>=10).sort((a,b)=>b[1][1]-a[1][1]).slice(0,3):[]}
/* ===== ניתוח מלא לפי דוח איתוראן ===== */
const EVX={
  'פניות שמאלה':'כניסה לפניות שמאלה במהירות גבוהה, בלי האטה מספקת לפני הצומת',
  'פניות ימינה':'כניסה מהירה לפניות ימינה',
  'מעגל תנועה':'כניסה או יציאה מהירה ממעגלי תנועה',

function brStats(br,m){
  const all=DATA.v.filter(v=>v.br===br),act=all.filter(v=>v.s[m]!=null);
  const avg=a=>a.length?Math.round(a.reduce((p,c)=>p+c,0)/a.length):null;
  let pm=-1;for(let j=m-1;j>=0;j--){if(all.some(v=>v.s[j]!=null)){pm=j;break}}
  const cur=avg(act.map(v=>v.s[m])),prev=pm<0?null:avg(all.filter(v=>v.s[pm]!=null).map(v=>v.s[pm]));
  const low=act.filter(v=>v.s[m]<25).sort((a,b)=>a.s[m]-b.s[m]);
  const st=act.map(v=>({v,st:statsOf(v,m)}));
  const drops=st.filter(o=>o.st.chg!=null&&o.st.chg<=-15).sort((a,b)=>a.st.chg-b.st.chg).slice(0,5);
  const top=[...act].sort((a,b)=>b.s[m]-a.s[m]).slice(0,3);
  return {all,act,cur,prev,low,drops,top};
}

  <div class="list">${brs.map(({br,b})=>{const h=DATA.heads[br]||{},text=brMsg(br,m,b),sk='sfb:'+br+':'+m,sent=ls(sk),d=b.prev!=null?b.cur-b.prev:null;
    return `<div class="card"><div class="who"><div class="name">${esc(br)}</div><div class="meta"><span>ראש סניף: ${esc(h.n||'—')}</span><span>${b.act.length} מתנדבים עם ציון</span></div>
      <div class="meta">${d==null?'':d<0?`<span class="trend dn">▼ ${-d} מהחודש הקודם</span>`:d>0?`<span class="trend up">▲ ${d} מהחודש הקודם</span>`:'<span class="trend eq">ללא שינוי</span>'}<span>${b.cur>=R?'מעל ממוצע המרחב':'מתחת לממוצע המרחב'}</span>${b.low.length?`<span class="streak">${b.low.length} מתחת ל־25</span>`:''}</div>
      ${b.low.length?`<div class="meta">${b.low.map(v=>`<span class="chip bad">${esc(v.n)} ${v.s[m]}</span>`).join('')}</div>`:''}</div>
      <div class="score ${scCls(b.cur)}">${b.cur}</div>
      <div class="issues"><div class="irow"><span class="tel">${h.ph?fmtPhone(h.ph):'אין טלפון'}${h.em?` · <span class="em">${esc(h.em)}</span>`:''}</span><span class="btns">${h.ph?`<a class="wa sm${sent?' done':''}" href="${waLink(h.ph,text)}" target="_blank" rel="noopener" data-sent="${esc(sk)}">${WA_ICON}${sent?'נשלח':'לראש הסניף'}</a>`:''}<a class="mail sm" href="mailto:${esc(h.em||'')}?subject=${encodeURIComponent('דוח סייפטי – סניף '+br+' – '+M)}&body=${encodeURIComponent((s=>s.split('\n').map(l=>l?'\u200F'+l:l).join('\n'))(text.replace(/\*/g,'')))}" data-sent="${esc(sk)}">מייל</a><button class="mail sm" type="button" data-copy="${esc(text)}">העתק</button></span></div></div></div>`}).join('')}</div>`;
  bind();
}
/* קובץ אקסל למיזוג דואר ב-Word: שליחה מרוכזת דרך אאוטלוק */
function exportMails(list){
  const m=state.m,M=DATA.months[m];
  const rows=list.filter(v=>v.em).map(v=>{const c=catOf(v,m),x=v.s[m];return {'שם':v.n,'פרייבט':v.pv,'סניף':v.br,'ציון':x,'קבוצה':(CATS.find(z=>z[0]===c)||[])[1]||'','מייל':v.em,'נושא':SUBJ[c]+' – '+M,'הודעה':MSG[c](v,x,M.split(' ')[0],streakAt(v,m),statsOf(v,m).prev).replace(/\*/g,'')}});
  if(!rows.length){alert('אין כתובות מייל בקבוצה הזאת');return}
  if(!window.XLSX){alert('הקובץ לא נטען, בדוק חיבור לאינטרנט ונסה שוב');return}
  const ws=XLSX.utils.json_to_sheet(rows);ws['!cols']=[{wch:18},{wch:8},{wch:16},{wch:6},{wch:18},{wch:28},{wch:34},{wch:90}];
  const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};XLSX.utils.book_append_sheet(wb,ws,'מיילים');
  XLSX.writeFile(wb,`מיילים_סייפטי_${M.replace(/\s+/g,'_')}.xlsx`);
}
function bind(){
  const e1=$('expOne');if(e1)e1.onclick=()=>exportMails(DATA.v.filter(v=>v.s[state.m]!=null&&catOf(v,state.m)===state.cat&&filt(v)));
  const e2=$('expAll');if(e2)e2.onclick=()=>exportMails(DATA.v.filter(v=>v.s[state.m]!=null&&filt(v)));
  const mon=$('mon');if(mon)mon.onchange=e=>{state.m=+e.target.value;render()};
  const br=$('br');if(br)br.onchange=e=>{state.br=e.target.value;render()};
  const q=$('q');if(q)q.oninput=()=>{clearTimeout(window._qt);window._qt=setTimeout(()=>{const o=$('q');if(!o)return;state.q=o.value;const pos=o.selectionStart;render();const n=$('q');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}},350)};
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{if(b.dataset.gocat){state.cat=b.dataset.gocat;ls('sf_cat',state.cat)}document.querySelector(`.tab[data-v="${b.dataset.go}"]`).click()});
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;ls('sf_cat',state.cat);render()});
  document.querySelectorAll('a[data-sent]').forEach(a=>a.addEventListener('click',()=>{ls(a.dataset.sent,TODAY_KEY);setTimeout(render,300)}));
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent='הועתק'}catch(e){b.textContent='לא הועתק'}});
}

/* ===== נתונים מוצפנים (אותה סיסמה כמו ניהול קצב"ת) ===== */
/* רכזי התחבורה לפי סניף (מאפליקציית הרכזים) – לעותק במייל */
let CIDX=null;
async function loadCidx(pw){try{const buf=new Uint8Array(await (await fetch('coord/index.bin',{cache:'no-cache'})).arrayBuffer()),salt=buf.slice(3,19),iv=buf.slice(19,31),ct=buf.slice(31);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']),key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);CIDX=JSON.parse(await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text());render()}catch(e){}}
async function decrypt(pw){
  const buf=new Uint8Array(await (await fetch('safety/safety.bin',{cache:'no-cache'})).arrayBuffer());
  if(String.fromCharCode(buf[0],buf[1],buf[2])!=='KB1')throw new Error('file');
  const salt=buf.slice(3,19),iv=buf.slice(19,31),ct=buf.slice(31);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  let gz;try{gz=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct)}catch(e){throw new Error('pw')}
  return JSON.parse(await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
}
function lockView(err){
  $('lockB').hidden=true;
  $('app').innerHTML=`<div class="lockc"><h2>🔐 דוח סייפטי</h2><p style="margin:0;color:var(--muted)">הנתונים מוצפנים. הקלד את הסיסמה של ניהול קצב"ת</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="סיסמה" onkeydown="if(event.key==='Enter')unlock()">
  <label style="color:var(--muted);font-weight:600"><input type="checkbox" id="rem" checked> לזכור במכשיר הזה</label>
  <button class="go" id="ub" onclick="unlock()">פתיחה 🔓</button><div class="err">${esc(err||'')}</div></div>`;
  setTimeout(()=>{const i=$('pw');if(i)i.focus()},50);
}
async function unlock(saved){
  const pw=saved||($('pw')&&(s=>s.replace(/[א-ת]/g,c=>({'ק':'e','ר':'r','א':'t','ט':'y','ו':'u','ן':'i','ם':'o','פ':'p','ש':'a','ד':'s','ג':'d','כ':'f','ע':'g','י':'h','ח':'j','ל':'k','ך':'l','ז':'z','ס':'x','ב':'c','ה':'v','נ':'b','מ':'n','צ':'m'})[c]||c))($('pw').value.trim().toLowerCase()).replace(/\.$/,''));if(!pw)return;
  if(!saved){$('ub').disabled=true;$('ub').textContent='פותח… (כמה שניות)'}else $('app').innerHTML='<div class="empty">פותח את הנתונים…</div>';
  try{DATA=await decrypt(pw);SPW=pw;loadCidx(pw);if(!saved)ls('kbt_pw',$('rem').checked?pw:'');$('lockB').hidden=false;$('upd').textContent='עודכן: '+DATA.updated;
    state.m=DATA.months.length-1;render()}
  catch(e){if(saved&&e.message==='pw')ls('kbt_pw','');lockView(e.message==='pw'?'סיסמה שגויה':!window.DecompressionStream?'הדפדפן ישן מדי, צריך לעדכן':'אין חיבור לאינטרנט, נסה שוב')}
}
function relock(){if(!confirm('לנעול ולשכוח את הסיסמה במכשיר הזה?'))return;ls('kbt_pw','');DATA=null;lockView()}
{const p=ls('kbt_pw');p?unlock(p):lockView()}
