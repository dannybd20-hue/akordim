<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<script>try{if(sessionStorage.getItem('gate_forms')!=='1'){document.documentElement.style.display='none';location.replace('./?open=forms')}}catch(e){location.replace('./')}</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>טפסים</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6d28d9">
<link rel="icon" href="icons/apps-192.png">
<link rel="apple-touch-icon" href="icons/apps-apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="דני בן דוד">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Rubik:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5fb;--card:#fff;--tx:#1e1b4b;--mut:#6b7280;--bd:#e7e5f4;--pr:#6d28d9;--pr2:#8b5cf6;--pl:#f3efff;--ok:#16a34a;--err:#dc2626;--in:#fafaff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0a1a;--card:#15132b;--tx:#f5f3ff;--mut:#a5a3c2;--bd:#29264a;--pl:#241f45;--in:#1c1938}}
:root[data-theme=dark]{--bg:#0b0a1a;--card:#15132b;--tx:#f5f3ff;--mut:#a5a3c2;--bd:#29264a;--pl:#241f45;--in:#1c1938}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Heebo,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
.hin{max-width:820px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.lg{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--pr2),var(--pr));color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px}
header h1{margin:0;font:900 19px Rubik,Heebo,sans-serif;flex:1}
.back{border:1px solid var(--bd);background:var(--pl);color:var(--pr);border-radius:12px;padding:7px 12px;font-weight:800;font-size:13px;cursor:pointer}
main{max-width:820px;margin:auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;box-shadow:0 8px 24px #1e1b4b0d;margin-bottom:14px}
.muted{color:var(--mut);font-size:14px}
.err{color:var(--err);font-weight:700;font-size:14px}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:800;font-size:15px;cursor:pointer;background:linear-gradient(90deg,var(--pr),var(--pr2));color:#fff;box-shadow:0 6px 16px #6d28d933}
.btn.sec{background:var(--card);color:var(--pr);border:1.5px solid var(--pr);box-shadow:none}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.6;cursor:default}
/* רשימת טפסים */
.flist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.fc{position:relative;text-align:start;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;cursor:pointer;box-shadow:0 6px 18px #1e1b4b0a;transition:.2s;display:flex;flex-direction:column;gap:6px}
.fc:hover{transform:translateY(-2px);border-color:var(--pr2)}
.fc b{font:800 17px Rubik,Heebo,sans-serif}
.fc p{margin:0;color:var(--mut);font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fc .row{display:flex;gap:8px;align-items:center;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:800;border-radius:99px;padding:3px 10px;background:var(--pl);color:var(--pr)}
.chip.off{background:#fee2e2;color:#b91c1c}
/* מילוי טופס */
.ftitle{margin:0 0 6px;font:900 24px Rubik,Heebo,sans-serif}
.fdesc{white-space:pre-wrap;color:var(--mut);font-size:14px;margin:0}
.q{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:12px;transition:border-color .2s}
.q.bad{border-color:var(--err);box-shadow:0 0 0 3px #dc262614}
.q h3{margin:0 0 4px;font-size:16px;font-weight:800}
.q h3 .req{color:var(--err)}
.q .help{margin:0 0 10px;color:var(--mut);font-size:13px;white-space:pre-wrap}
.sec{margin:22px 4px 10px;font:800 18px Rubik,Heebo,sans-serif;color:var(--pr)}
.sec+.help{margin:-6px 4px 12px}
.fld{width:100%;border:1.5px solid var(--bd);border-radius:12px;padding:11px 12px;font-size:16px;background:var(--in);outline:none}
.fld:focus{border-color:var(--pr2);box-shadow:0 0 0 3px #8b5cf622}
textarea.fld{min-height:96px;resize:vertical}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--bd);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--in);transition:.15s;font-size:15px}
.opt:hover{border-color:var(--pr2)}
.opt input{width:19px;height:19px;margin:0;accent-color:var(--pr)}
.opt:has(input:checked){border-color:var(--pr);background:var(--pl);font-weight:700}
.opt .fld{padding:6px 8px;font-size:14px}
.scale{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.scale button{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--bd);background:var(--in);font-weight:800;cursor:pointer}
.scale button.on{background:var(--pr);border-color:var(--pr);color:#fff}
.scale small{color:var(--mut);font-size:12px}
.grid{width:100%;border-collapse:collapse;font-size:14px}
.grid th,.grid td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--bd)}
.grid th:first-child,.grid td:first-child{text-align:start}
.grid input{width:18px;height:18px;accent-color:var(--pr)}
.gridw{overflow-x:auto}
.actions{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:16px}
.done{text-align:center;padding:40px 20px}
.done .big{font-size:56px}
/* תוצאות */
.rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--ok)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #16a34a88}70%{box-shadow:0 0 0 8px #16a34a00}100%{box-shadow:0 0 0 0 #16a34a00}}
.tabs{display:flex;background:var(--pl);border-radius:12px;padding:3px;gap:3px;margin-inline-start:auto}
.tabs button{border:0;background:none;border-radius:9px;padding:7px 12px;font-weight:800;font-size:13px;color:var(--mut);cursor:pointer}
.tabs button.on{background:var(--card);color:var(--pr);box-shadow:0 1px 3px #0001}
.stat{font-size:13px;color:var(--mut);margin:-2px 0 10px}
.bar{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.bar .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .b{height:12px;background:var(--pl);border-radius:99px;overflow:hidden}
.bar .b i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--pr2));border-radius:99px;transition:width .5s}
.bar .n{font-weight:800;font-size:13px;color:var(--mut);white-space:nowrap}
.ans{list-style:none;margin:0;padding:0}
.ans li{border-top:1px solid var(--bd);padding:8px 2px;font-size:14px;white-space:pre-wrap}
.ans li:first-child{border-top:0}
.ans small{color:var(--mut);font-size:11px;display:block}
.resp{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.resp.new{animation:glow 3s}
@keyframes glow{0%{border-color:var(--ok);box-shadow:0 0 0 4px #16a34a26}100%{}}
.resp .when{font-size:12px;font-weight:800;color:var(--pr);margin-bottom:6px}
.resp dl{margin:0;display:grid;grid-template-columns:minmax(90px,40%) 1fr;gap:4px 12px;font-size:14px}
.resp dt{color:var(--mut)}.resp dd{margin:0;font-weight:600;white-space:pre-wrap}
.link{background:none;border:0;color:var(--pr);font-weight:800;cursor:pointer;padding:0;font-size:13px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--pr);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--pl);border-top-color:var(--pr);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:480px){.ftitle{font-size:21px}.q{padding:15px}.resp dl{grid-template-columns:1fr}.resp dt{margin-top:4px}}
</style>
</head>
<body>
<header><div class="hin">
  <div class="lg">📝</div><h1 id="htitle">טפסים</h1>
  <button class="back" onclick="location.href='./'">→ אפליקציות</button>
</div></header>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
/* מתחבר לסקריפט forms-script.gs בגוגל. הטפסים עצמם נשארים בגוגל פורמס, והתשובות נכנסות לגיליון המקושר. */
const FORMS_CLOUD='';
const $=id=>document.getElementById(id),M=$('main');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sg=k=>{try{return sessionStorage.getItem(k)||''}catch(e){return''}};
const lg=k=>{try{return localStorage.getItem(k)||''}catch(e){return''}};
const lp=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
let pw='',admin=false,forms=[],cur=null,poll=0;
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2400)}
function api(o){return fetch(FORMS_CLOUD,{method:'POST',body:JSON.stringify({...o,password:pw})}).then(r=>r.json())}
const errText=e=>e==='locked'?'🔒 יותר מדי ניסיונות שגויים. נסה שוב בעוד רבע שעה':e==='password'?'סיסמה שגויה':'שגיאה: '+e;
function stopPoll(){clearInterval(poll);poll=0}
function loading(t){M.innerHTML=`<div class="card" style="text-align:center"><span class="spin"></span> ${t||'טוען…'}</div>`}

/* ---------- כניסה: קודם הסיסמה הראשית/סיסמת דף הבית, אחר כך מה שנשמר במכשיר ---------- */
async function start(){
  if(!FORMS_CLOUD){M.innerHTML='<div class="card"><b>עוד לא חובר סקריפט הטפסים.</b><p class="muted">צריך להתקין את forms-script.gs בגוגל ולשלוח את הכתובת שלו.</p></div>';return}
  const tries=[sg('hub_admin'),sg('hub_pw'),lg('forms_pw')].filter((v,i,a)=>v&&a.indexOf(v)===i);
  loading('מתחבר…');
  for(const t of tries){
    pw=t;
    try{const r=await api({action:'list'});if(r.ok){lp('forms_pw',t);admin=r.admin;forms=r.forms;showList();return}if(r.error==='locked'){M.innerHTML=`<div class="card err">${errText('locked')}</div>`;return}}
    catch(e){M.innerHTML='<div class="card err">אין חיבור לאינטרנט. נסה שוב.</div>';return}
  }
  pw='';login();
}
function login(msg){
  stopPoll();$('htitle').textContent='טפסים';
  M.innerHTML=`<div class="card" style="max-width:380px;margin:30px auto;text-align:center">
    <p style="font:800 17px Rubik,Heebo;margin:0 0 12px">🔒 סיסמת הטפסים</p>
    <input class="fld" id="lpw" type="password" style="text-align:center" placeholder="סיסמה">
    <p class="err" id="lerr">${esc(msg||'')}</p>
    <button class="btn" style="width:100%" onclick="doLogin()">כניסה</button></div>`;
  $('lpw').onkeyup=e=>{if(e.key==='Enter')doLogin()};$('lpw').focus();
}
async function doLogin(){
  const v=$('lpw').value.trim();if(!v)return;pw=v;
  try{const r=await api({action:'list'});if(!r.ok){pw='';$('lerr').textContent=errText(r.error);return}lp('forms_pw',v);admin=r.admin;forms=r.forms;showList()}
  catch(e){$('lerr').textContent='אין חיבור לאינטרנט'}
}

/* ---------- רשימת הטפסים ---------- */
function showList(){
  stopPoll();cur=null;$('htitle').textContent='טפסים';history.replaceState(null,'',location.pathname);
  if(!forms.length){M.innerHTML='<div class="card muted">אין עדיין טפסים. מוסיפים קישורים ברשימת FORMS בסקריפט.</div>';return}
  M.innerHTML=`<p class="muted" style="margin:0 0 12px">${admin?'👑 מנהל: אפשר למלא ולראות תוצאות':'בחר טופס למילוי'}</p><div class="flist">`+forms.map(f=>`
    <div class="fc" onclick="${f.error?'':`openForm(${f.id})`}">
      <b>${esc(f.title)}</b>${f.description?`<p>${esc(f.description)}</p>`:''}
      <div class="row">${f.error?`<span class="chip off">${esc(f.error)}</span>`:f.open?'<span class="chip">פתוח למילוי</span>':'<span class="chip off">סגור</span>'}
      ${admin&&!f.error?`<span class="chip">📨 ${f.count} תשובות</span><button class="btn sm sec" style="margin-inline-start:auto" onclick="event.stopPropagation();openResults(${f.id})">📊 תוצאות</button>`:''}</div>
    </div>`).join('')+'</div>';
}

/* ---------- מילוי טופס ---------- */
const defs={};
async function getDef(id){if(defs[id])return defs[id];const r=await api({action:'form',id});if(!r.ok)throw r.error;return defs[id]=r.form}
let answers={};
async function openForm(id){
  stopPoll();loading();
  let f;try{f=await getDef(id)}catch(e){M.innerHTML=`<div class="card err">${esc(errText(e))}</div>`;return}
  cur=id;answers={};$('htitle').textContent=f.title;
  if(!f.open){M.innerHTML=`<div class="card"><h2 class="ftitle">${esc(f.title)}</h2><p class="err">הטופס סגור לתשובות כרגע.</p><button class="btn sec" onclick="showList()">חזרה</button></div>`;return}
  let h=`<div class="card"><h2 class="ftitle">${esc(f.title)}</h2>${f.description?`<p class="fdesc">${esc(f.description)}</p>`:''}<p class="muted" style="margin:10px 0 0"><span style="color:var(--err)">*</span> שאלת חובה</p></div>`;
  f.items.forEach(q=>{
    if(q.type==='section'){h+=`<div class="sec">${esc(q.title)}</div>${q.help?`<p class="help muted">${esc(q.help)}</p>`:''}`;return}
    h+=`<div class="q" id="q${q.id}"><h3>${esc(q.title)}${q.required?' <span class="req">*</span>':''}</h3>${q.help?`<p class="help">${esc(q.help)}</p>`:''}${field(q)}</div>`;
  });
  h+=`<p class="err" id="ferr"></p><div class="actions"><button class="btn sec" onclick="showList()">ביטול</button><button class="btn" id="send" onclick="send()">שליחה</button></div>`;
  M.innerHTML=h;scrollTo({top:0});
}
function field(q){
  const n='f'+q.id;
  switch(q.type){
    case 'text':return `<input class="fld" data-q="${q.id}" oninput="setA(${q.id},this.value)">`;
    case 'paragraph':return `<textarea class="fld" data-q="${q.id}" oninput="setA(${q.id},this.value)"></textarea>`;
    case 'date':return `<input class="fld" type="date" oninput="setA(${q.id},this.value)">`;
    case 'time':return `<input class="fld" type="time" oninput="setA(${q.id},this.value)">`;
    case 'select':return `<select class="fld" onchange="setA(${q.id},this.value)"><option value="">בחר…</option>${q.choices.map(c=>`<option>${esc(c)}</option>`).join('')}</select>`;
    case 'radio':return `<div class="opts">${q.choices.map(c=>`<label class="opt"><input type="radio" name="${n}" value="${esc(c)}" onchange="setA(${q.id},this.value)">${esc(c)}</label>`).join('')}${q.other?`<label class="opt"><input type="radio" name="${n}" value="__other" onchange="setA(${q.id},otherVal(${q.id}))">אחר: <input class="fld" id="o${q.id}" oninput="this.closest('.opt').querySelector('input').checked=true;setA(${q.id},this.value)"></label>`:''}</div>`;
    case 'checkbox':return `<div class="opts">${q.choices.map(c=>`<label class="opt"><input type="checkbox" name="${n}" value="${esc(c)}" onchange="setChecks(${q.id})">${esc(c)}</label>`).join('')}${q.other?`<label class="opt"><input type="checkbox" name="${n}" value="__other" onchange="setChecks(${q.id})">אחר: <input class="fld" id="o${q.id}" oninput="this.closest('.opt').querySelector('input').checked=true;setChecks(${q.id})"></label>`:''}</div>`;
    case 'scale':{let b='';for(let i=q.min;i<=q.max;i++)b+=`<button type="button" onclick="pickScale(this,${q.id},${i})">${i}</button>`;
      return `<div class="scale">${q.minLabel?`<small>${esc(q.minLabel)}</small>`:''}${b}${q.maxLabel?`<small>${esc(q.maxLabel)}</small>`:''}</div>`}
    case 'grid':case 'cgrid':{const t=q.type==='grid'?'radio':'checkbox';
      return `<div class="gridw"><table class="grid"><tr><th></th>${q.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${q.rows.map((r,ri)=>`<tr><td>${esc(r)}</td>${q.cols.map(c=>`<td><input type="${t}" name="${n}_${ri}" value="${esc(c)}" onchange="setGrid(${q.id})"></td>`).join('')}</tr>`).join('')}</table></div>`}
  }
  return '';
}
function setA(id,v){answers[id]=v;$('q'+id).classList.remove('bad')}
function otherVal(id){return ($('o'+id)||{}).value||''}
function setChecks(id){const v=[...document.querySelectorAll(`input[name="f${id}"]:checked`)].map(i=>i.value==='__other'?otherVal(id):i.value).filter(Boolean);setA(id,v)}
function pickScale(b,id,v){b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));setA(id,v)}
function setGrid(id){
  const q=defs[cur].items.find(x=>x.id===id);
  const v=q.rows.map((r,ri)=>{const c=[...document.querySelectorAll(`input[name="f${id}_${ri}"]:checked`)].map(i=>i.value);return q.type==='grid'?(c[0]||null):(c.length?c:null)});
  setA(id,v);
}
function empty(v){return v==null||v===''||(Array.isArray(v)&&(!v.length||v.every(x=>x==null)))}
async function send(){
  const f=defs[cur];let bad=null;
  f.items.forEach(q=>{if(q.type==='section')return;const v=answers[q.id];
    const miss=!!q.required&&(empty(v)||((q.type==='grid'||q.type==='cgrid')&&v.some(x=>x==null)));
    $('q'+q.id).classList.toggle('bad',miss);if(miss&&!bad)bad=q});
  if(bad){$('ferr').textContent='יש למלא את כל שאלות החובה';$('q'+bad.id).scrollIntoView({behavior:'smooth',block:'center'});return}
  $('ferr').textContent='';$('send').disabled=true;$('send').textContent='שולח…';
  try{
    const r=await api({action:'submit',id:cur,answers});
    if(!r.ok){$('ferr').textContent=errText(r.error);$('send').disabled=false;$('send').textContent='שליחה';return}
    M.innerHTML=`<div class="card done"><div class="big">✅</div><h2 class="ftitle">תודה! התשובה נשלחה</h2><p class="muted">${esc(f.title)}</p>
      <div class="actions" style="justify-content:center"><button class="btn sec" onclick="openForm(${cur})">מילוי נוסף</button><button class="btn" onclick="showList()">לכל הטפסים</button></div></div>`;
    const x=forms.find(x=>x.id===cur);if(x&&x.count!=null)x.count++;
  }catch(e){$('ferr').textContent='אין חיבור לאינטרנט. התשובה לא נשלחה, נסה שוב.';$('send').disabled=false;$('send').textContent='שליחה'}
}

/* ---------- תוצאות בזמן אמת (רק מנהל) ---------- */
let res=[],seenT=0,rtab='sum';
async function openResults(id){
  stopPoll();loading('טוען תוצאות…');
  let f;try{f=await getDef(id)}catch(e){M.innerHTML=`<div class="card err">${esc(errText(e))}</div>`;return}
  cur=id;res=[];seenT=0;$('htitle').textContent='📊 '+f.title;
  M.innerHTML=`<div class="rhead"><button class="btn sm sec" onclick="showList()">→ חזרה</button><span class="live"><i></i> מתעדכן בזמן אמת</span>
    <div class="tabs"><button data-t="sum">סיכום</button><button data-t="list">תשובות</button></div></div><div id="rbox"></div>`;
  M.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button');if(b){rtab=b.dataset.t;drawRes()}};
  await pull();poll=setInterval(()=>{if(document.visibilityState==='visible')pull()},15000);
}
async function pull(){
  try{
    const r=await api({action:'results',id:cur});if(!r.ok){$('rbox').innerHTML=`<div class="card err">${esc(errText(r.error))}</div>`;return}
    const before=res.length;res=r.results;
    if(before&&res.length>before)toast('📨 '+(res.length-before===1?'תשובה חדשה':(res.length-before)+' תשובות חדשות'));
    drawRes(before?before:res.length);
  }catch(e){}
}
const when=t=>new Date(t).toLocaleString('he-IL',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'});
function drawRes(oldCount){
  const f=defs[cur],box=$('rbox');if(!box)return;
  M.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===rtab));
  if(!res.length){box.innerHTML='<div class="card muted" style="text-align:center">עוד אין תשובות. ברגע שתיכנס תשובה היא תופיע כאן.</div>';return}
  const newFrom=oldCount!=null?oldCount:res.length;
  if(rtab==='list'){
    box.innerHTML=`<p class="muted">${res.length} תשובות · החדשות למעלה</p>`+res.map((r,i)=>({r,i})).reverse().map(({r,i})=>`
      <div class="resp${i>=newFrom?' new':''}"><div class="when">🕒 ${when(r.t)}${r.email?' · '+esc(r.email):''}</div><dl>`+
      f.items.filter(q=>q.type!=='section').map(q=>`<dt>${esc(q.title)}</dt><dd>${fmtAns(q,r.a[q.id])}</dd>`).join('')+`</dl></div>`).join('');
    return;
  }
  let h=`<div class="card" style="display:flex;gap:18px;flex-wrap:wrap;align-items:center"><div><div style="font:900 34px Rubik">${res.length}</div><div class="muted">תשובות</div></div>
    <div><div style="font:800 16px Rubik">${when(res[res.length-1].t)}</div><div class="muted">התשובה האחרונה</div></div></div>`;
  f.items.forEach(q=>{
    if(q.type==='section')return;
    const vals=res.map(r=>r.a[q.id]).filter(v=>v!=null&&v!==''&&!(Array.isArray(v)&&!v.length));
    h+=`<div class="card"><h3 style="margin:0 0 2px;font-size:16px">${esc(q.title)}</h3><p class="stat">${vals.length} ענו</p>`;
    if(['radio','checkbox','select','scale'].includes(q.type)){
      const cnt={};vals.forEach(v=>[].concat(v).forEach(x=>cnt[x]=(cnt[x]||0)+1));
      let keys=q.type==='scale'?Array.from({length:q.max-q.min+1},(_,i)=>String(q.min+i)):[...(q.choices||[])];
      Object.keys(cnt).forEach(k=>{if(!keys.includes(k))keys.push(k)});
      const mx=Math.max(1,...keys.map(k=>cnt[k]||0));
      if(q.type==='scale'&&vals.length){const avg=vals.reduce((s,v)=>s+Number(v),0)/vals.length;h+=`<p class="stat">ממוצע: <b>${avg.toFixed(1)}</b></p>`}
      h+=keys.map(k=>{const c=cnt[k]||0,p=vals.length?Math.round(c*100/vals.length):0;
        return `<div class="bar"><span class="t" title="${esc(k)}">${esc(k)}</span><span class="b"><i style="width:${c*100/mx}%"></i></span><span class="n">${c} · ${p}%</span></div>`}).join('');
    }else if(q.type==='grid'||q.type==='cgrid'){
      h+=q.rows.map((row,ri)=>{const cnt={};vals.forEach(v=>{const x=Array.isArray(v)?v[ri]:null;if(x)String(x).split(', ').forEach(y=>cnt[y]=(cnt[y]||0)+1)});
        return `<p style="margin:8px 0 2px;font-weight:700;font-size:14px">${esc(row)}</p>`+q.cols.map(c=>`<div class="bar"><span class="t">${esc(c)}</span><span class="b"><i style="width:${vals.length?(cnt[c]||0)*100/vals.length:0}%"></i></span><span class="n">${cnt[c]||0}</span></div>`).join('')}).join('');
    }else{
      const L=res.map(r=>({t:r.t,v:r.a[q.id]})).filter(x=>x.v!=null&&x.v!=='').reverse();
      h+=`<ul class="ans">`+L.slice(0,8).map(x=>`<li>${esc(x.v)}<small>${when(x.t)}</small></li>`).join('')+`</ul>`+(L.length>8?`<button class="link" onclick="rtab='list';drawRes()">עוד ${L.length-8} תשובות ←</button>`:'');
    }
    h+='</div>';
  });
  box.innerHTML=h;
}
function fmtAns(q,v){if(v==null||v===''||(Array.isArray(v)&&!v.length))return '<span class="muted">—</span>';
  if((q.type==='grid'||q.type==='cgrid')&&Array.isArray(v))return q.rows.map((r,i)=>esc(r)+': '+esc(v[i]||'—')).join('<br>');
  return esc(Array.isArray(v)?v.join(', '):v)}

(function(){try{const t=localStorage.getItem('akordim_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}})();
start();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
