<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<script>try{if(sessionStorage.getItem('gate_forms')!=='1'){document.documentElement.style.display='none';location.replace('./?open=forms'+(location.search?'&'+location.search.slice(1):''))}}catch(e){location.replace('./')}</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>טפסים</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="icons/apps-192.png">
<link rel="apple-touch-icon" href="icons/apps-apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="דני בן דוד">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Rubik:wght@600;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* עיצוב בהיר ובולט: רקע לבן, כרטיסים נקיים, הדגשה בטורקיז-ציאן וכתום */
:root{--bg:#f6f8fb;--bg2:#eef2f7;--card:#ffffff;--card2:#f8fafc;--tx:#0f172a;--mut:#64748b;--bd:#e5e9f0;
  --pr:#0d9488;--pr2:#0891b2;--hot:#ea580c;--pl:rgba(13,148,136,.09);--ok:#059669;--err:#e11d48;--in:#f8fafc;
  --grad:linear-gradient(110deg,#14b8a6 0%,#06b6d4 55%,#6366f1 100%)}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Heebo,sans-serif;min-height:100vh;
  background-image:radial-gradient(900px 500px at 100% -10%,rgba(20,184,166,.10),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(99,102,241,.08),transparent 60%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.hin{max-width:860px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.lg{width:38px;height:38px;border-radius:12px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 6px 18px rgba(6,182,212,.3)}
header h1{margin:0;font:900 18px Rubik,Heebo,sans-serif;flex:1;letter-spacing:.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{border:1px solid var(--bd);background:var(--card2);color:var(--tx);border-radius:12px;padding:7px 12px;font-weight:800;font-size:13px;cursor:pointer}
.back:hover{border-color:var(--pr)}
main{max-width:860px;margin:auto;padding:22px 16px 120px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:0 6px 22px rgba(15,23,42,.05)}
.muted{color:var(--mut);font-size:14px}
.err{color:var(--err);font-weight:700;font-size:14px}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:900;font-size:15px;cursor:pointer;background:var(--grad);color:#fff;box-shadow:0 8px 24px rgba(6,182,212,.28);transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 34px rgba(34,211,238,.4)}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.btn.sec:hover{border-color:var(--pr)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.kick{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--pr);text-transform:uppercase;margin:4px 0 8px}
.ptitle{margin:0 0 18px;font:900 30px/1.15 Rubik,Heebo,sans-serif}
.ptitle span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
/* רשימת טפסים */
.flist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.fc{position:relative;overflow:hidden;text-align:start;background:var(--card);border:1px solid var(--bd);box-shadow:0 6px 22px rgba(15,23,42,.05);border-radius:22px;padding:20px;cursor:pointer;transition:.25s;display:flex;flex-direction:column;gap:8px;min-height:160px}
.fc::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad);opacity:.8}
.fc::after{content:"";position:absolute;width:220px;height:220px;top:-120px;left:-100px;border-radius:50%;background:radial-gradient(circle,rgba(20,184,166,.12),transparent 70%);transition:.4s}
.fc:hover{transform:translateY(-3px);border-color:rgba(13,148,136,.4);box-shadow:0 16px 36px rgba(15,23,42,.12)}
.fc:hover::after{transform:scale(1.25)}
.fc .num{font:900 13px Rubik;color:var(--mut)}
.fc b{font:900 19px/1.25 Rubik,Heebo,sans-serif}
.fc p{margin:0;color:var(--mut);font-size:13px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fc .row{display:flex;gap:8px;align-items:center;margin-top:auto;padding-top:10px;flex-wrap:wrap;position:relative;z-index:1}
.fc .acts{display:flex;gap:6px;width:100%;margin-top:4px}.fc .acts .btn{flex:1}
.chip{font-size:12px;font-weight:800;border-radius:99px;padding:4px 10px;background:var(--pl);color:var(--pr)}
.chip.off{background:rgba(225,29,72,.08);color:var(--err)}
.chip.hot{background:rgba(234,88,12,.09);color:var(--hot)}
/* מילוי טופס */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:28px 22px;margin-bottom:18px;border:1px solid var(--bd);
  background:linear-gradient(140deg,rgba(20,184,166,.13),rgba(6,182,212,.05) 45%,rgba(99,102,241,.10));box-shadow:0 8px 26px rgba(15,23,42,.06)}
.hero::after{content:"";position:absolute;width:300px;height:300px;right:-90px;bottom:-160px;border-radius:50%;background:radial-gradient(circle,rgba(6,182,212,.18),transparent 70%)}
.ftitle{margin:0 0 8px;font:900 28px/1.2 Rubik,Heebo,sans-serif;position:relative;z-index:1}
.fdesc{white-space:pre-wrap;color:#475569;font-size:15px;margin:0;line-height:1.6;position:relative;z-index:1}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.q{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:20px 20px 20px;margin-bottom:12px;box-shadow:0 4px 16px rgba(15,23,42,.04);transition:border-color .2s,box-shadow .2s}
.q:focus-within{border-color:rgba(13,148,136,.45);box-shadow:0 0 0 4px rgba(13,148,136,.08)}
.q.bad{border-color:var(--err);box-shadow:0 0 0 4px rgba(225,29,72,.08)}
.q.okq .qn{background:var(--grad);color:#fff;border-color:transparent}
.qh{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.qn{flex-shrink:0;width:30px;height:30px;border-radius:10px;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font:900 13px Rubik;color:var(--mut);transition:.2s}
.q h3{margin:3px 0 0;font-size:17px;font-weight:800;line-height:1.35}
.q h3 .req{color:var(--hot)}
.q .help{margin:4px 0 0;color:var(--mut);font-size:13px;white-space:pre-wrap;font-weight:400}
.qsec{margin:28px 4px 12px;font:900 20px Rubik,Heebo,sans-serif;display:flex;align-items:center;gap:10px}
.qsec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--bd),transparent)}
.qsec+.help{margin:-6px 4px 14px}
.fld{width:100%;border:1px solid var(--bd);border-radius:14px;padding:13px 14px;font-size:16px;background:var(--in);outline:none;transition:.2s}
.fld:focus{border-color:var(--pr);background:#fff;box-shadow:0 0 0 3px rgba(13,148,136,.1)}
.fld::placeholder{color:#94a3b8}
select.fld option{background:#fff}
textarea.fld{min-height:110px;resize:vertical;line-height:1.5}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--bd);border-radius:14px;padding:13px 14px;cursor:pointer;background:var(--in);transition:.15s;font-size:15px}
.opt:hover{border-color:rgba(13,148,136,.4);background:#fff}
.opt input{width:20px;height:20px;margin:0;accent-color:var(--pr)}
.opt:has(input:checked){border-color:var(--pr);background:var(--pl);font-weight:800;box-shadow:inset 0 0 0 1px var(--pr)}
.opt .fld{padding:7px 10px;font-size:14px}
.scale{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scale button{min-width:48px;height:48px;border-radius:14px;border:1px solid var(--bd);background:var(--in);font:900 17px Rubik;cursor:pointer;transition:.15s}
.scale button:hover{border-color:var(--pr)}
.scale button.on{background:var(--grad);border-color:transparent;color:#fff;transform:scale(1.06);box-shadow:0 6px 18px rgba(6,182,212,.3)}
.scale small{color:var(--mut);font-size:12px;font-weight:700}
.grid{width:100%;border-collapse:collapse;font-size:14px}
.grid th,.grid td{padding:10px 6px;text-align:center;border-bottom:1px solid var(--bd)}
.grid th{color:var(--mut);font-weight:700;font-size:13px}
.grid th:first-child,.grid td:first-child{text-align:start}
.grid input{width:19px;height:19px;accent-color:var(--pr)}
.gridw{overflow-x:auto}
/* פס תחתון קבוע: התקדמות ושליחה */
.sbar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(255,255,255,.9);box-shadow:0 -6px 20px rgba(15,23,42,.06);backdrop-filter:blur(14px);border-top:1px solid var(--bd)}
.sbar .in{max-width:860px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:14px}
.prog{flex:1;min-width:0}
.prog .t{font-size:12px;font-weight:800;color:var(--mut);margin-bottom:6px;display:flex;justify-content:space-between}
.prog .b{height:6px;border-radius:99px;background:#e2e8f0;overflow:hidden}
.prog .b i{display:block;height:100%;width:0;background:var(--grad);border-radius:99px;transition:width .35s}
.actions{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:16px}
.done{text-align:center;padding:48px 20px}
.done .big{width:84px;height:84px;margin:0 auto 16px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;box-shadow:0 12px 40px rgba(6,182,212,.4);animation:pop .5s}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
/* תוצאות */
.rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.live{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:var(--ok)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.tabs{display:flex;background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:3px;gap:3px;margin-inline-start:auto}
.tabs button{border:0;background:none;border-radius:9px;padding:7px 14px;font-weight:800;font-size:13px;color:var(--mut);cursor:pointer}
.tabs button.on{background:var(--grad);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;box-shadow:0 6px 22px rgba(15,23,42,.05)}
.kpi .v{font:900 34px/1 Rubik;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi .v.sm{font-size:19px;line-height:1.3}
.kpi .l{color:var(--mut);font-size:13px;font-weight:700;margin-top:6px}
.stat{font-size:13px;color:var(--mut);margin:2px 0 12px}
.bar{display:grid;grid-template-columns:minmax(80px,36%) 1fr auto;gap:10px;align-items:center;font-size:14px;margin:8px 0}
.bar .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .b{height:10px;background:#eef2f7;border-radius:99px;overflow:hidden}
.bar .b i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .6s}
.bar .n{font:800 13px Rubik;color:var(--mut);white-space:nowrap;min-width:62px;text-align:left}
.bar.top .t{font-weight:800}.bar.top .n{color:var(--pr)}
.ans{list-style:none;margin:0;padding:0}
.ans li{border-top:1px solid var(--bd);padding:10px 2px;font-size:14px;white-space:pre-wrap;line-height:1.5}
.ans li:first-child{border-top:0}
.ans small{color:var(--mut);font-size:11px;display:block;margin-top:2px}
.resp{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:10px;box-shadow:0 4px 16px rgba(15,23,42,.04)}
.resp.new{animation:glow 3.5s}
@keyframes glow{0%{border-color:var(--ok);box-shadow:0 0 0 4px rgba(52,211,153,.18)}100%{}}
.resp .when{font-size:12px;font-weight:800;color:var(--pr);margin-bottom:10px}
.resp dl{margin:0;display:grid;grid-template-columns:minmax(100px,38%) 1fr;gap:6px 14px;font-size:14px}
.resp dt{color:var(--mut)}.resp dd{margin:0;font-weight:700;white-space:pre-wrap}
.link{background:none;border:0;color:var(--pr);font-weight:800;cursor:pointer;padding:0;font-size:13px}
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:var(--grad);color:#fff;padding:11px 20px;border-radius:14px;font-weight:900;opacity:0;transition:.3s;pointer-events:none;z-index:50;box-shadow:0 10px 30px rgba(15,23,42,.2)}
.toast.on{opacity:1}
.spin{display:inline-block;width:18px;height:18px;border:3px solid #e2e8f0;border-top-color:var(--pr);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
/* ---------- עיצוב יתר ישראל (טופס 4): כחול-נייבי, אדום, לוגו הכנפיים ---------- */
body.th-yatar{--bg:#f3f3f7;--tx:#1b1a36;--mut:#5f5e78;--bd:#e3e2ec;--pr:#a32022;--pr2:#c42a2d;--hot:#a32022;--pl:rgba(163,32,34,.08);--in:#fafafc;
  --grad:linear-gradient(90deg,#a32022,#c42a2d);background-image:none}
body.th-yatar header{background:#201f3f;border-bottom:0}
body.th-yatar header h1{color:#fff;font-family:Oswald,Heebo,sans-serif;font-weight:600;letter-spacing:.5px}
body.th-yatar .lg{background:none;box-shadow:none;width:auto;padding:0}
body.th-yatar .lg img{height:30px;display:block}
body.th-yatar .back{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff}
body.th-yatar .hero{background:#201f3f;border:0;text-align:center;padding:26px 20px 28px;border-radius:18px;box-shadow:0 12px 30px rgba(32,31,63,.3)}
body.th-yatar .hero::after{display:none}
body.th-yatar .hero img{width:min(320px,82%);display:block;margin:0 auto 14px}
body.th-yatar .ftitle{color:#fff;font-family:Oswald,Heebo,sans-serif;font-weight:700;letter-spacing:.5px}
body.th-yatar .fdesc{color:#c9c8dc}
body.th-yatar .hero .meta{justify-content:center}
body.th-yatar .hero .chip{background:rgba(255,255,255,.1);color:#fff}
body.th-yatar .hero .chip.hot{background:#a32022;color:#fff}
body.th-yatar .q,body.th-yatar .card,body.th-yatar .kpi,body.th-yatar .resp{border-radius:12px}
body.th-yatar .q{border-top:3px solid #201f3f}
body.th-yatar .qn{background:#201f3f;color:#fff;border:0;border-radius:6px}
body.th-yatar .q.okq .qn{background:#a32022}
body.th-yatar .q h3{font-family:Oswald,Heebo,sans-serif;font-weight:600;letter-spacing:.2px}
body.th-yatar .fld,body.th-yatar .opt,body.th-yatar .scale button{border-radius:8px}
body.th-yatar .btn{border-radius:6px;font-family:Oswald,Heebo,sans-serif;font-weight:600;letter-spacing:.6px;box-shadow:0 6px 18px rgba(163,32,34,.3);color:#fff}
body.th-yatar .btn.sec{color:#201f3f;border-color:#201f3f;box-shadow:none}
body.th-yatar .sbar{background:#201f3f;border-top:0}
body.th-yatar .prog .t{color:#c9c8dc}
body.th-yatar .prog .b{background:rgba(255,255,255,.15)}
body.th-yatar .qsec{font-family:Oswald,Heebo,sans-serif;color:#201f3f}
body.th-yatar .done .big{background:#a32022;box-shadow:0 12px 34px rgba(163,32,34,.4)}
body.th-yatar .tabs button.on,body.th-yatar .scale button.on{background:#a32022;color:#fff}
body.th-yatar .kpi .v{background:none;color:#a32022;-webkit-text-fill-color:#a32022}
.fc.yatar{background:#201f3f;border-color:#201f3f;color:#fff}
.fc.yatar::before{background:#a32022}.fc.yatar::after{display:none}
.fc.yatar img{height:44px;align-self:flex-start;margin-bottom:2px}
.fc.yatar p,.fc.yatar .num{color:#c9c8dc}
.fc.yatar .btn.sec{color:#fff;border-color:rgba(255,255,255,.35)}
@media (max-width:480px){.ftitle{font-size:24px}.ptitle{font-size:25px}.q{padding:16px}.resp dl{grid-template-columns:1fr}.resp dt{margin-top:6px}.hero{padding:22px 18px}}
</style>
</head>
<body>
<header><div class="hin">
  <div class="lg" id="lgx">📝</div><h1 id="htitle">טפסים</h1>
  <button class="back" onclick="location.href='./'">→ אפליקציות</button>
</div></header>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
/* מתחבר לסקריפט forms-script.gs בגוגל. הטפסים עצמם נשארים בגוגל פורמס, והתשובות נכנסות לגיליון המקושר. */
const FORMS_CLOUD='https://script.google.com/macros/s/AKfycbyTsKgVGx8IzuMeCy2_LAZPruXPFpbPPApRP0EKfSeUOlJflz8_xtzXwiXsz2wXoiXA/exec';
const $=id=>document.getElementById(id),M=$('main');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sg=k=>{try{return sessionStorage.getItem(k)||''}catch(e){return''}};
const lg=k=>{try{return localStorage.getItem(k)||''}catch(e){return''}};
const lp=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
let pw='',admin=false,forms=[],cur=null,poll=0;
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2400)}
function api(o){return fetch(FORMS_CLOUD,{method:'POST',body:JSON.stringify({...o,password:pw})}).then(r=>r.json())}
const errText=e=>e==='locked'?'🔒 יותר מדי ניסיונות שגויים. נסה שוב בעוד רבע שעה':e==='password'?'סיסמה שגויה':'שגיאה: '+e;
function stopPoll(){clearInterval(poll);poll=0}
function loading(t){M.innerHTML=`<div class="card" style="text-align:center"><span class="spin"></span> ${t||'טוען…'}</div>`}

/* ---------- כניסה: קודם הסיסמה הראשית/סיסמת דף הבית, אחר כך מה שנשמר במכשיר ---------- */
/* זיכרון במכשיר: רשימת הטפסים ומבנה כל טופס מוצגים מיד מהפעם הקודמת, והעדכון מגוגל רץ ברקע */
const getJ=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const setJ=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let view='';
async function start(){
  const c=getJ('forms_cache');
  if(FORMS_CLOUD&&c&&c.forms&&lg('forms_pw')){pw=lg('forms_pw');admin=!!c.admin;forms=c.forms;landing();refreshList();return}
  if(!FORMS_CLOUD){M.innerHTML='<div class="card"><b>עוד לא חובר סקריפט הטפסים.</b><p class="muted">צריך להתקין את forms-script.gs בגוגל ולשלוח את הכתובת שלו.</p></div>';return}
  const tries=[sg('hub_admin'),sg('hub_pw'),lg('forms_pw')].filter((v,i,a)=>v&&a.indexOf(v)===i);
  loading('מתחבר…');
  for(const t of tries){
    pw=t;
    try{const r=await api({action:'list'});if(r.ok){lp('forms_pw',t);admin=r.admin;forms=r.forms;setJ('forms_cache',{admin,forms});landing();return}if(r.error==='locked'){M.innerHTML=`<div class="card err">${errText('locked')}</div>`;return}}
    catch(e){M.innerHTML='<div class="card err">אין חיבור לאינטרנט. נסה שוב.</div>';return}
  }
  pw='';login();
}
/* עדכון ברקע: מנסה את הסיסמאות לפי הסדר (ראשית קודם), ומרענן את הרשימה רק אם המשתמש עדיין בה */
async function refreshList(){
  const tries=[sg('hub_admin'),sg('hub_pw'),lg('forms_pw')].filter((v,i,a)=>v&&a.indexOf(v)===i);
  for(const t of tries){
    try{
      const r=await fetch(FORMS_CLOUD,{method:'POST',body:JSON.stringify({action:'list',password:t})}).then(r=>r.json());
      if(r.ok){pw=t;lp('forms_pw',t);const ch=JSON.stringify(r.forms)!==JSON.stringify(forms)||r.admin!==admin;admin=r.admin;forms=r.forms;setJ('forms_cache',{admin,forms});if(ch&&view==='list')showList();return}
      if(r.error==='locked')return;
    }catch(e){return}
  }
  lp('forms_pw',null);try{localStorage.removeItem('forms_cache')}catch(e){}if(view==='list')login('הסיסמה השתנתה, נא להיכנס שוב');
}
function login(msg){
  stopPoll();$('htitle').textContent='טפסים';
  M.innerHTML=`<div class="card" style="max-width:380px;margin:30px auto;text-align:center">
    <p style="font:800 17px Rubik,Heebo;margin:0 0 12px">🔒 סיסמת הטפסים</p>
    <input class="fld" id="lpw" type="password" style="text-align:center" placeholder="סיסמה">
    <p class="err" id="lerr">${esc(msg||'')}</p>
    <button class="btn" style="width:100%" onclick="doLogin()">כניסה</button></div>`;
  $('lpw').onkeyup=e=>{if(e.key==='Enter')doLogin()};$('lpw').focus();
}
async function doLogin(){
  const v=$('lpw').value.trim();if(!v)return;pw=v;
  try{const r=await api({action:'list'});if(!r.ok){pw='';$('lerr').textContent=errText(r.error);return}lp('forms_pw',v);admin=r.admin;forms=r.forms;setJ('forms_cache',{admin,forms});landing()}
  catch(e){$('lerr').textContent='אין חיבור לאינטרנט'}
}

/* עיצוב מיוחד לטופס לפי המיקום שלו ברשימה (0 = הראשון) */
const THEMES={3:{cls:'th-yatar',logo:'brand/yatar-logo.png'}};
/* טפסים שיש להם דף שיתוף משלו (שם ותמונה בתצוגה המקדימה של וואטסאפ) */
const SHARE={3:'f4.html'};
function theme(id){const t=THEMES[id];document.body.className=t?t.cls:'';$('lgx').innerHTML=t?`<img src="${t.logo}" alt="">`:'📝'}
/* ---------- קישור ישיר לטופס: ‎forms.html?f=2‎ פותח ישר את הטופס השני ---------- */
const SITE='https://dannybd20-hue.github.io/akordim/';
function landing(){
  const f=+new URLSearchParams(location.search).get('f');
  if(f&&forms.some(x=>x.id===f-1&&!x.error))openForm(f-1);else showList();
}
function copyLink(id){
  const u=SHARE[id]?SITE+SHARE[id]:SITE+'?open=forms&f='+(id+1);
  (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('🔗 הקישור הועתק'),()=>prompt('העתק את הקישור:',u));
}
/* ---------- רשימת הטפסים ---------- */
function showList(){
  stopPoll();cur=null;view='list';theme(null);$('htitle').textContent='טפסים';history.replaceState(null,'',location.pathname);
  if(!forms.length){M.innerHTML='<div class="card muted">אין עדיין טפסים. מוסיפים קישורים ברשימת FORMS בסקריפט.</div>';return}
  M.innerHTML=`<p class="kick">${admin?'👑 מצב מנהל':'בחר טופס'}</p><h2 class="ptitle">הטפסים <span>שלך</span></h2><div class="flist">`+forms.map((f,i)=>`
    <div class="fc${THEMES[f.id]?' yatar':''}" onclick="${f.error?'':`openForm(${f.id})`}">
      ${THEMES[f.id]?`<img src="${THEMES[f.id].logo}" alt="">`:`<span class="num">${String(i+1).padStart(2,'0')}</span>`}<b>${esc(f.title)}</b>${f.description?`<p>${esc(f.description)}</p>`:''}
      <div class="row">${f.error?`<span class="chip off">${esc(f.error)}</span>`:f.open?'<span class="chip">פתוח למילוי</span>':'<span class="chip off">סגור</span>'}
      ${admin&&!f.error?`<span class="chip hot">📨 ${f.count} תשובות</span><span class="acts"><button class="btn sm sec" onclick="event.stopPropagation();copyLink(${f.id})" title="קישור ישיר לטופס הזה">🔗 קישור</button><button class="btn sm sec" onclick="event.stopPropagation();openResults(${f.id})">📊 תוצאות</button></span>`:''}</div>
    </div>`).join('')+'</div>';
}

/* ---------- מילוי טופס ---------- */
const defs={};
async function getDef(id){
  if(defs[id])return defs[id];
  const fetchDef=()=>api({action:'form',id}).then(r=>{if(!r.ok)throw r.error;defs[id]=r.form;setJ('forms_def_'+id,r.form);return r.form});
  const c=getJ('forms_def_'+id);
  if(c){defs[id]=c;fetchDef().catch(()=>{});return c} // מיד מהזיכרון; הגרסה העדכנית תשמש בפתיחה הבאה
  return fetchDef();
}
let answers={};
async function openForm(id){
  stopPoll();loading();
  let f;try{f=await getDef(id)}catch(e){M.innerHTML=`<div class="card err">${esc(errText(e))}</div>`;return}
  cur=id;answers={};view='form';theme(id);$('htitle').textContent=f.title;
  if(!f.open){M.innerHTML=`<div class="card"><h2 class="ftitle">${esc(f.title)}</h2><p class="err">הטופס סגור לתשובות כרגע.</p><button class="btn sec" onclick="showList()">חזרה</button></div>`;return}
  const qs=f.items.filter(q=>q.type!=='section');let n=0;
  let h=`<div class="hero">${THEMES[id]?`<img src="${THEMES[id].logo}" alt="">`:''}<h2 class="ftitle">${esc(f.title)}</h2>${f.description?`<p class="fdesc">${esc(f.description)}</p>`:''}
    <div class="meta"><span class="chip">${qs.length} שאלות</span>${qs.some(q=>q.required)?'<span class="chip hot">* שאלת חובה</span>':''}</div></div>`;
  f.items.forEach(q=>{
    if(q.type==='section'){h+=`<div class="qsec">${esc(q.title)}</div>${q.help?`<p class="help muted">${esc(q.help)}</p>`:''}`;return}
    h+=`<div class="q" id="q${q.id}"><div class="qh"><span class="qn">${++n}</span><div><h3>${esc(q.title)}${q.required?' <span class="req">*</span>':''}</h3>${q.help?`<p class="help">${esc(q.help)}</p>`:''}</div></div>${field(q)}</div>`;
  });
  h+=`<p class="err" id="ferr"></p><button class="btn sec sm" onclick="showList()">ביטול</button>
    <div class="sbar"><div class="in"><div class="prog"><div class="t"><span id="pt">0 מתוך ${qs.length} נענו</span><span id="pp">0%</span></div><div class="b"><i id="pb"></i></div></div><button class="btn" id="send" onclick="send()">שליחה ←</button></div></div>`;
  M.innerHTML=h;scrollTo({top:0});prog();
}
function field(q){
  const n='f'+q.id;
  switch(q.type){
    case 'text':return `<input class="fld" data-q="${q.id}" oninput="setA(${q.id},this.value)">`;
    case 'paragraph':return `<textarea class="fld" data-q="${q.id}" oninput="setA(${q.id},this.value)"></textarea>`;
    case 'date':return `<input class="fld" type="date" oninput="setA(${q.id},this.value)">`;
    case 'time':return `<input class="fld" type="time" oninput="setA(${q.id},this.value)">`;
    case 'select':return `<select class="fld" onchange="setA(${q.id},this.value)"><option value="">בחר…</option>${q.choices.map(c=>`<option>${esc(c)}</option>`).join('')}</select>`;
    case 'radio':return `<div class="opts">${q.choices.map(c=>`<label class="opt"><input type="radio" name="${n}" value="${esc(c)}" onchange="setA(${q.id},this.value)">${esc(c)}</label>`).join('')}${q.other?`<label class="opt"><input type="radio" name="${n}" value="__other" onchange="setA(${q.id},otherVal(${q.id}))">אחר: <input class="fld" id="o${q.id}" oninput="this.closest('.opt').querySelector('input').checked=true;setA(${q.id},this.value)"></label>`:''}</div>`;
    case 'checkbox':return `<div class="opts">${q.choices.map(c=>`<label class="opt"><input type="checkbox" name="${n}" value="${esc(c)}" onchange="setChecks(${q.id})">${esc(c)}</label>`).join('')}${q.other?`<label class="opt"><input type="checkbox" name="${n}" value="__other" onchange="setChecks(${q.id})">אחר: <input class="fld" id="o${q.id}" oninput="this.closest('.opt').querySelector('input').checked=true;setChecks(${q.id})"></label>`:''}</div>`;
    case 'scale':{let b='';for(let i=q.min;i<=q.max;i++)b+=`<button type="button" onclick="pickScale(this,${q.id},${i})">${i}</button>`;
      return `<div class="scale">${q.minLabel?`<small>${esc(q.minLabel)}</small>`:''}${b}${q.maxLabel?`<small>${esc(q.maxLabel)}</small>`:''}</div>`}
    case 'grid':case 'cgrid':{const t=q.type==='grid'?'radio':'checkbox';
      return `<div class="gridw"><table class="grid"><tr><th></th>${q.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${q.rows.map((r,ri)=>`<tr><td>${esc(r)}</td>${q.cols.map(c=>`<td><input type="${t}" name="${n}_${ri}" value="${esc(c)}" onchange="setGrid(${q.id})"></td>`).join('')}</tr>`).join('')}</table></div>`}
  }
  return '';
}
function setA(id,v){answers[id]=v;const e=$('q'+id);e.classList.remove('bad');e.classList.toggle('okq',!empty(v));prog()}
/* פס ההתקדמות: כמה שאלות כבר נענו */
function prog(){
  const qs=defs[cur].items.filter(q=>q.type!=='section'),a=qs.filter(q=>!empty(answers[q.id])).length,p=qs.length?Math.round(a*100/qs.length):0;
  if($('pb')){$('pb').style.width=p+'%';$('pt').textContent=a+' מתוך '+qs.length+' נענו';$('pp').textContent=p+'%'}
}
function otherVal(id){return ($('o'+id)||{}).value||''}
function setChecks(id){const v=[...document.querySelectorAll(`input[name="f${id}"]:checked`)].map(i=>i.value==='__other'?otherVal(id):i.value).filter(Boolean);setA(id,v)}
function pickScale(b,id,v){b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));setA(id,v)}
function setGrid(id){
  const q=defs[cur].items.find(x=>x.id===id);
  const v=q.rows.map((r,ri)=>{const c=[...document.querySelectorAll(`input[name="f${id}_${ri}"]:checked`)].map(i=>i.value);return q.type==='grid'?(c[0]||null):(c.length?c:null)});
  setA(id,v);
}
function empty(v){return v==null||v===''||(Array.isArray(v)&&(!v.length||v.every(x=>x==null)))}
async function send(){
  const f=defs[cur];let bad=null;
  f.items.forEach(q=>{if(q.type==='section')return;const v=answers[q.id];
    const miss=!!q.required&&(empty(v)||((q.type==='grid'||q.type==='cgrid')&&v.some(x=>x==null)));
    $('q'+q.id).classList.toggle('bad',miss);if(miss&&!bad)bad=q});
  if(bad){$('ferr').textContent='יש למלא את כל שאלות החובה';$('q'+bad.id).scrollIntoView({behavior:'smooth',block:'center'});return}
  $('ferr').textContent='';$('send').disabled=true;$('send').textContent='שולח…';
  try{
    const r=await api({action:'submit',id:cur,answers});
    if(!r.ok){$('ferr').textContent=errText(r.error);$('send').disabled=false;$('send').textContent='שליחה';return}
    view='done';M.innerHTML=`<div class="card done"><div class="big">✓</div><h2 class="ftitle">תודה! התשובה נשלחה</h2><p class="muted">${esc(f.title)}</p>
      <div class="actions" style="justify-content:center"><button class="btn sec" onclick="openForm(${cur})">מילוי נוסף</button><button class="btn" onclick="showList()">לכל הטפסים</button></div></div>`;
    const x=forms.find(x=>x.id===cur);if(x&&x.count!=null)x.count++;
  }catch(e){$('ferr').textContent='אין חיבור לאינטרנט. התשובה לא נשלחה, נסה שוב.';$('send').disabled=false;$('send').textContent='שליחה'}
}

/* ---------- תוצאות בזמן אמת (רק מנהל) ---------- */
let res=[],seenT=0,rtab='sum';
async function openResults(id){
  stopPoll();loading('טוען תוצאות…');
  let f;try{f=await getDef(id)}catch(e){M.innerHTML=`<div class="card err">${esc(errText(e))}</div>`;return}
  cur=id;res=[];seenT=0;view='results';theme(id);$('htitle').textContent='📊 '+f.title;
  M.innerHTML=`<div class="rhead"><button class="btn sm sec" onclick="showList()">→ חזרה</button><span class="live"><i></i> מתעדכן בזמן אמת</span>
    <div class="tabs"><button data-t="sum">סיכום</button><button data-t="list">תשובות</button></div></div><div id="rbox"></div>`;
  M.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button');if(b){rtab=b.dataset.t;drawRes()}};
  await pull();poll=setInterval(()=>{if(document.visibilityState==='visible')pull()},15000);
}
async function pull(){
  try{
    const r=await api({action:'results',id:cur});if(!r.ok){$('rbox').innerHTML=`<div class="card err">${esc(errText(r.error))}</div>`;return}
    const before=res.length;res=r.results;
    if(before&&res.length>before)toast('📨 '+(res.length-before===1?'תשובה חדשה':(res.length-before)+' תשובות חדשות'));
    drawRes(before?before:res.length);
  }catch(e){}
}
const when=t=>new Date(t).toLocaleString('he-IL',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'});
function drawRes(oldCount){
  const f=defs[cur],box=$('rbox');if(!box)return;
  M.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===rtab));
  if(!res.length){box.innerHTML='<div class="card muted" style="text-align:center">עוד אין תשובות. ברגע שתיכנס תשובה היא תופיע כאן.</div>';return}
  const newFrom=oldCount!=null?oldCount:res.length;
  if(rtab==='list'){
    box.innerHTML=`<p class="muted">${res.length} תשובות · החדשות למעלה</p>`+res.map((r,i)=>({r,i})).reverse().map(({r,i})=>`
      <div class="resp${i>=newFrom?' new':''}"><div class="when">🕒 ${when(r.t)}${r.email?' · '+esc(r.email):''}</div><dl>`+
      f.items.filter(q=>q.type!=='section').map(q=>`<dt>${esc(q.title)}</dt><dd>${fmtAns(q,r.a[q.id])}</dd>`).join('')+`</dl></div>`).join('');
    return;
  }
  const day=Date.now()-864e5,today=res.filter(r=>r.t>=day).length;
  let h=`<div class="kpis"><div class="kpi"><div class="v">${res.length}</div><div class="l">תשובות בסך הכול</div></div>
    <div class="kpi"><div class="v">${today}</div><div class="l">ב-24 השעות האחרונות</div></div>
    <div class="kpi"><div class="v sm">${when(res[res.length-1].t)}</div><div class="l">התשובה האחרונה</div></div></div>`;
  f.items.forEach(q=>{
    if(q.type==='section')return;
    const vals=res.map(r=>r.a[q.id]).filter(v=>v!=null&&v!==''&&!(Array.isArray(v)&&!v.length));
    h+=`<div class="card"><h3 style="margin:0 0 2px;font-size:16px">${esc(q.title)}</h3><p class="stat">${vals.length} ענו</p>`;
    if(['radio','checkbox','select','scale'].includes(q.type)){
      const cnt={};vals.forEach(v=>[].concat(v).forEach(x=>cnt[x]=(cnt[x]||0)+1));
      let keys=q.type==='scale'?Array.from({length:q.max-q.min+1},(_,i)=>String(q.min+i)):[...(q.choices||[])];
      Object.keys(cnt).forEach(k=>{if(!keys.includes(k))keys.push(k)});
      const mx=Math.max(1,...keys.map(k=>cnt[k]||0));
      if(q.type==='scale'&&vals.length){const avg=vals.reduce((s,v)=>s+Number(v),0)/vals.length;h+=`<p class="stat">ממוצע: <b>${avg.toFixed(1)}</b></p>`}
      h+=keys.map(k=>{const c=cnt[k]||0,p=vals.length?Math.round(c*100/vals.length):0;
        return `<div class="bar${c&&c===mx?' top':''}"><span class="t" title="${esc(k)}">${esc(k)}</span><span class="b"><i style="width:${c*100/mx}%"></i></span><span class="n">${c} · ${p}%</span></div>`}).join('');
    }else if(q.type==='grid'||q.type==='cgrid'){
      h+=q.rows.map((row,ri)=>{const cnt={};vals.forEach(v=>{const x=Array.isArray(v)?v[ri]:null;if(x)String(x).split(', ').forEach(y=>cnt[y]=(cnt[y]||0)+1)});
        return `<p style="margin:8px 0 2px;font-weight:700;font-size:14px">${esc(row)}</p>`+q.cols.map(c=>`<div class="bar"><span class="t">${esc(c)}</span><span class="b"><i style="width:${vals.length?(cnt[c]||0)*100/vals.length:0}%"></i></span><span class="n">${cnt[c]||0}</span></div>`).join('')}).join('');
    }else{
      const L=res.map(r=>({t:r.t,v:r.a[q.id]})).filter(x=>x.v!=null&&x.v!=='').reverse();
      h+=`<ul class="ans">`+L.slice(0,8).map(x=>`<li>${esc(x.v)}<small>${when(x.t)}</small></li>`).join('')+`</ul>`+(L.length>8?`<button class="link" onclick="rtab='list';drawRes()">עוד ${L.length-8} תשובות ←</button>`:'');
    }
    h+='</div>';
  });
  box.innerHTML=h;
}
function fmtAns(q,v){if(v==null||v===''||(Array.isArray(v)&&!v.length))return '<span class="muted">—</span>';
  if((q.type==='grid'||q.type==='cgrid')&&Array.isArray(v))return q.rows.map((r,i)=>esc(r)+': '+esc(v[i]||'—')).join('<br>');
  return esc(Array.isArray(v)?v.join(', '):v)}

(function(){try{const t=localStorage.getItem('akordim_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}})();
start();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
