<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<script>try{if(sessionStorage.getItem('gate_phonebook')!=='1'){document.documentElement.style.display='none';location.replace('./?open=phonebook'+(location.search?'&'+location.search.slice(1):''))}}catch(e){location.replace('./')}
function goHome(){try{sessionStorage.removeItem('gate_phonebook')}catch(e){}location.href='./'}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ספר טלפונים</title>
<link rel="manifest" href="pb-manifest.json">
<meta name="theme-color" content="#c2410c">
<link rel="apple-touch-icon" href="icons/pb-192.png">
<link rel="icon" href="icons/apps-192.png">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3f1;--card:#fff;--tx:#1c1917;--mut:#78716c;--bd:#e7e2de;--pr:#ea580c;--pr2:#f97316;--dk:#7c2d12;--sh:0 6px 22px #0f172a12;--hd:linear-gradient(135deg,#c2410c,#f97316)}
:root[data-theme=dark]{--bg:#141110;--card:#1f1a18;--tx:#f5f0ed;--mut:#a8a29e;--bd:#3a322e;--sh:0 6px 22px #0007}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141110;--card:#1f1a18;--tx:#f5f0ed;--mut:#a8a29e;--bd:#3a322e;--sh:0 6px 22px #0007}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Heebo,system-ui,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--hd);color:#fff;padding:12px 16px 12px;box-shadow:0 4px 18px #c2410c55}
.hrow{display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:21px;font-weight:900;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{border:0;background:#ffffff26;color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:14px;white-space:nowrap}
@media (max-width:430px){header h1{font-size:18px}.hrow{gap:6px}.hb{padding:8px 9px}}
.srch{position:relative;margin-top:10px}
.srch input{width:100%;border:0;border-radius:14px;padding:12px 44px 12px 40px;font-size:17px;background:#fff;color:#1c1917;outline:none;box-shadow:0 2px 10px #0002}
.srch .ic{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:17px;opacity:.6}
.srch .clr{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:#e7e5e4;color:#44403c;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:14px}
.flt{display:flex;gap:8px;margin-top:8px}
.flt select{flex:1;min-width:0;border:0;border-radius:12px;padding:9px 10px;background:#ffffff2e;color:#fff;font-weight:700;font-size:14px}
.flt select option{color:#1c1917;background:#fff}
main{max-width:760px;margin:0 auto;padding:6px 12px 40px}
.cnt{color:var(--mut);font-size:13px;font-weight:700;padding:8px 4px 2px;display:flex;justify-content:space-between;gap:8px}
.lt{position:sticky;top:var(--hh,150px);z-index:5;background:var(--bg);color:var(--pr);font-weight:900;font-size:15px;padding:10px 6px 4px}
.grp{background:var(--card);border-radius:16px;box-shadow:var(--sh);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--bd);cursor:pointer}
.row:last-child{border-bottom:0}
.row:active{background:color-mix(in srgb,var(--pr) 8%,transparent)}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:16px;letter-spacing:-.5px}
.av.big{width:84px;height:84px;font-size:30px;margin:0 auto;box-shadow:0 8px 24px #0003}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv{flex:none;font-size:12px;font-weight:800;color:var(--dk);background:#ffedd5;border-radius:8px;padding:2px 7px}
:root[data-theme=dark] .pv{background:#431407;color:#fed7aa}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .pv{background:#431407;color:#fed7aa}}
.pv.car{background:#dbeafe;color:#1e3a8a}
.bday{background:linear-gradient(135deg,#fef3c7,#fde68a);border-radius:16px;margin:10px 0 4px;box-shadow:var(--sh);overflow:hidden;color:#78350f}
.bday summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:900;font-size:15.5px;display:flex;align-items:center;gap:8px}
.bday summary::-webkit-details-marker{display:none}
.bday summary .ar{margin-inline-start:auto;font-size:13px;background:#78350f;color:#fff;border-radius:999px;padding:3px 10px}
.bday .br{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid #f59e0b55}
.bday .br .nm small{color:#92400e}
.mz{flex:none;border:0;border-radius:999px;padding:8px 12px;font-weight:900;font-size:14px;background:#16a34a;color:#fff;text-decoration:none;white-space:nowrap}
.mz.ok{background:#a3a3a3}
.call{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:#16a34a;color:#fff;font-size:18px;display:grid;place-items:center;text-decoration:none}
.empty{text-align:center;color:var(--mut);padding:50px 10px;font-weight:700}
mark{background:#fde68a;color:inherit;border-radius:3px;padding:0 1px}
/* כרטיס איש קשר */
.ov{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
@keyframes fd{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:0 0 24px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:24px}}
.top{background:var(--hd);color:#fff;text-align:center;padding:22px 16px 18px;position:relative}
.top h2{margin:12px 0 2px;font-size:24px;font-weight:900}
.top .sub{opacity:.9;font-size:14px}
.x{position:absolute;top:12px;left:12px;border:0;background:#ffffff33;color:#fff;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer}
.acts{display:flex;justify-content:center;gap:10px;padding:14px 12px 4px;flex-wrap:wrap}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--tx);font-size:12px;font-weight:700;border:0;background:none;cursor:pointer;min-width:58px}
.act i{font-style:normal;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:21px;background:var(--card);box-shadow:var(--sh)}
.act.dis{opacity:.35;pointer-events:none}
.box{background:var(--card);border-radius:16px;box-shadow:var(--sh);margin:12px 12px 0;overflow:hidden}
.box h3{margin:0;padding:10px 14px 0;font-size:13px;color:var(--mut);font-weight:800}
.it{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd)}
.it:last-child{border-bottom:0}
a.it{text-decoration:none;color:inherit}a.it .v span{color:var(--pr)}
.it .k{flex:none;width:24px;text-align:center;font-size:17px}
.it .v{flex:1;min-width:0}
.it .v small{display:block;color:var(--mut);font-size:12px;font-weight:700}
.it .v span{display:block;font-size:15.5px;font-weight:600;word-break:break-word}
.it a.v{text-decoration:none}
.it .v span.tag,.tag{display:inline-block;background:#ffedd5;color:var(--dk);border-radius:999px;padding:2px 10px;margin:3px 0 0 4px;font-size:13px;font-weight:800}
:root[data-theme=dark] .tag{background:#431407;color:#fed7aa}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .tag{background:#431407;color:#fed7aa}}
.lnk{color:var(--pr);font-weight:800;cursor:pointer}
/* מסך נעילה */
.lock{max-width:400px;margin:40px auto;padding:0 16px;text-align:center}
.lock .card{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:26px 20px}
.lock .em{font-size:52px}
.lock h2{margin:6px 0 4px;font-weight:900}
.lock p{color:var(--mut);margin:0 0 16px;font-size:14px}
.pwr{position:relative}
.lock input[type=password],.lock input[type=text]{width:100%;border:1.5px solid var(--bd);border-radius:14px;padding:13px 44px 13px 14px;font-size:18px;background:var(--bg);text-align:center;direction:ltr}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:18px;cursor:pointer}
.lock label{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0;font-size:14px;color:var(--mut);font-weight:700}
.go{width:100%;border:0;border-radius:14px;padding:14px;font-weight:900;font-size:17px;color:#fff;background:var(--hd);cursor:pointer;box-shadow:0 8px 20px #ea580c44}
.go:disabled{opacity:.6}
.err{color:#dc2626;font-weight:800;min-height:22px;margin-top:10px}
.spin{width:34px;height:34px;border:4px solid var(--bd);border-top-color:var(--pr);border-radius:50%;animation:sp .8s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
#more{height:40px}
</style>
</head>
<body>
<header id="hd">
  <div class="hrow"><h1>📇 ספר טלפונים</h1><button class="hb" id="instB" onclick="install()" title="הוספה למסך הבית" aria-label="הוספה למסך הבית">📲</button><button class="hb" id="lockB" hidden onclick="relock()" title="נעילה ושכחת הסיסמה במכשיר">🔒</button><button class="hb" onclick="goHome()">→ אפליקציות</button></div>
  <div id="tools" hidden>
    <div class="srch"><span class="ic">🔍</span><input id="q" type="text" enterkeyhint="search" placeholder="חיפוש: שם, טלפון, פרייבט, מס׳ רכב, יישוב…" autocomplete="off" oninput="onQ()"><button class="clr" id="clr" hidden onclick="$('q').value='';onQ();$('q').focus()">✕</button></div>
    <div class="flt"><select id="fd" onchange="onDist()"></select><select id="fb" onchange="apply()"></select></div>
    <div class="flt"><select id="fx" onchange="apply()"></select></div>
  </div>
</header>
<main id="M"></main>

<script>
/* ספר טלפונים: הנתונים שמורים באתר רק כקובץ מוצפן (pb/pb.bin), ונפתחים כאן בטלפון עם הסיסמה.
   הצפנה: PBKDF2 (600,000 סבבים) + AES-GCM. בלי הסיסמה אי אפשר לקרוא את הקובץ. */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const lget=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lput=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
let DB=null,ALL=[],LIST=[],shown=0,qt=0;

/* ---------- פתיחת הקובץ המוצפן ---------- */
async function decrypt(pw){
  const buf=new Uint8Array(await (await fetch('pb/pb.bin',{cache:'no-cache'})).arrayBuffer());
  if(String.fromCharCode(buf[0],buf[1],buf[2])!=='PB1')throw new Error('file');
  const salt=buf.slice(3,19),iv=buf.slice(19,31),ct=buf.slice(31);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  let gz;try{gz=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct)}catch(e){throw new Error('pw')}
  const txt=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(txt);
}
function lockView(err){
  $('tools').hidden=true;$('lockB').hidden=true;
  $('M').innerHTML=`<div class="lock"><div class="card"><div class="em">📇</div><h2>ספר טלפונים</h2><p>הרשימה מוצפנת. הקלד את סיסמת ספר הטלפונים</p>
  <div class="pwr"><input id="pw" type="password" autocomplete="current-password" placeholder="סיסמה" onkeydown="if(event.key==='Enter')unlock()"><button class="eye" onclick="const i=$('pw');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'👁️':'🙈'">👁️</button></div>
  <label><input type="checkbox" id="rem" checked> לזכור במכשיר הזה</label>
  <button class="go" id="ub" onclick="unlock()">פתיחה 🔓</button><div class="err" id="er">${esc(err||'')}</div></div></div>`;
  setTimeout(()=>{const i=$('pw');if(i)i.focus()},50);
}
async function unlock(saved){
  const pw=saved||($('pw')&&$('pw').value.trim());if(!pw)return;
  if(!saved){$('ub').disabled=true;$('ub').textContent='פותח… (כמה שניות)';$('er').textContent=''}
  else $('M').innerHTML='<div class="spin"></div><div class="empty" style="padding:0">פותח את ספר הטלפונים…</div>';
  try{DB=await decrypt(pw);if(saved||$('rem').checked)lput('pb_pw',pw);else lput('pb_pw',null);ready()}
  catch(e){if(saved)lput('pb_pw',null);lockView(e.message==='pw'?'סיסמה שגויה':!window.DecompressionStream?'הדפדפן ישן מדי, צריך לעדכן':'אין חיבור לאינטרנט, נסה שוב')}
}
function relock(){if(!confirm('לנעול ולשכוח את הסיסמה במכשיר הזה?'))return;lput('pb_pw',null);DB=null;ALL=[];lockView()}

/* ---------- הכנת הרשימה ---------- */
const COLORS=['#ea580c','#dc2626','#db2777','#9333ea','#4f46e5','#2563eb','#0891b2','#0d9488','#16a34a','#65a30d','#ca8a04','#78716c'];
const norm=s=>String(s||'').toLowerCase().replace(/["'״׳`]/g,'').replace(/[ךםןףץ]/g,c=>({'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'})[c]).replace(/\s+/g,' ').trim();
function ready(){
  const B=DB.b; // [סניף, מחוז, ראש סניף, סגן, רכז תחבורה, קצין בטיחות]
  ALL=DB.r.map((r,i)=>{const b=B[r[9]]||[];const o={i,n:r[0],pv:r[1],ph:r[2],city:r[3],st:r[4],em:r[5],bd:r[6],car:r[7],perm:r[8],br:b[0]||'',dist:b[1]||'',head:b[2]||'',dep:b[3]||'',trans:b[4]||'',safe:b[5]||'',role:r[10]||'',pveh:r[11]||''};o.roles=[...new Set(o.role.split(/;\s*/).map(x=>x.trim()).filter(Boolean))];
    o.s=norm([o.n,o.pv,o.city,o.br,o.dist,o.em,o.car,o.st,o.role,o.pveh].join(' '));o.d=String(o.ph||'').replace(/\D/g,'');let h=0;for(const ch of o.n)h=(h*31+ch.charCodeAt(0))|0;o.c=COLORS[Math.abs(h)%COLORS.length];return o});
  const col=new Intl.Collator('he');ALL.sort((a,b)=>col.compare(a.n,b.n));
  const dists=[...new Set(ALL.map(o=>o.dist).filter(Boolean))].sort(col.compare);
  $('fd').innerHTML='<option value="">כל המחוזות</option>'+dists.map(d=>`<option>${esc(d)}</option>`).join('');
  /* הרשאות נהיגה / סוגי כלי רכב: לפי כמות */
  const pc={};ALL.forEach(o=>{o.perms=[...new Set((o.perm||'').split(/;\s*/).map(x=>x.trim()).filter(Boolean))];o.perms.forEach(x=>pc[x]=(pc[x]||0)+1)});
  const rc={},vc={};ALL.forEach(o=>{o.roles.forEach(x=>rc[x]=(rc[x]||0)+1);if(o.pveh)vc[o.pveh]=(vc[o.pveh]||0)+1});
  const og=(lab,pre,c,min)=>'<optgroup label="'+lab+'">'+Object.keys(c).filter(k=>c[k]>=(min||1)).sort((a,b)=>c[b]-c[a]).map(k=>`<option value="${pre}${esc(k)}">${esc(k)} (${c[k]})</option>`).join('')+'</optgroup>';
  $('fx').innerHTML='<option value="">סינון נוסף: תפקיד / רכב / ימי הולדת</option>'+og('תפקיד','r:',rc,3)+og('סוג רכב פרטי','v:',vc)+'<optgroup label="ימי הולדת עבריים"><option value="b0">🎂 יום הולדת עברי היום</option><option value="b7">🎂 יום הולדת עברי השבוע</option><option value="b30">🎂 יום הולדת עברי החודש (30 יום)</option></optgroup><optgroup label="רכב"><option value="car">🚑 יש מספר רכב ארגוני</option><option value="anyp">🪪 יש הרשאת נהיגה כלשהי</option></optgroup><optgroup label="הרשאת נהיגה / סוג כלי רכב">'+
    Object.keys(pc).sort((a,b)=>pc[b]-pc[a]).map(x=>`<option value="p:${esc(x)}">${esc(x)} (${pc[x]})</option>`).join('')+'</optgroup>';
  $('tools').hidden=false;$('lockB').hidden=false;fillBr();
  /* פתיחה מהאייקון במסך הבית: ?focus=1 פותח ישר את המקלדת בשורת החיפוש, ?q= מחפש מיד */
  const U=new URLSearchParams(location.search);if(U.get('q')){$('q').value=U.get('q');$('clr').hidden=false}
  apply();setHH();if(U.get('focus')||U.get('q'))setTimeout(()=>$('q').focus(),100);
}
function fillBr(){const d=$('fd').value,col=new Intl.Collator('he');const brs=[...new Set(ALL.filter(o=>!d||o.dist===d).map(o=>o.br).filter(Boolean))].sort(col.compare);
  $('fb').innerHTML='<option value="">כל הסניפים</option>'+brs.map(b=>`<option>${esc(b)}</option>`).join('')}
function onDist(){fillBr();apply()}
function onQ(){$('clr').hidden=!$('q').value;clearTimeout(qt);qt=setTimeout(apply,150)}
function setHH(){document.documentElement.style.setProperty('--hh',$('hd').offsetHeight+'px')}
addEventListener('resize',setHH);

/* ---------- סינון ותצוגה ---------- */
let words=[];
function apply(){
  const q=norm($('q').value),d=$('fd').value,b=$('fb').value;words=q?q.split(' '):[];
  const x=$('fx').value;let xf=()=>true;
  if(x==='car')xf=o=>!!o.car;else if(x==='anyp')xf=o=>o.perms.length>0;else if(x.startsWith('p:')){const p=x.slice(2);xf=o=>o.perms.includes(p)}else if(x.startsWith('r:')){const p=x.slice(2);xf=o=>o.roles.includes(p)}else if(x.startsWith('v:')){const p=x.slice(2);xf=o=>o.pveh===p}
  else if(x[0]==='b'){const n=+x.slice(1);const W=bdWindow(n);xf=o=>{const k=hb(o);return !!k&&W.has(k.m+'|'+k.d)}}
  LIST=ALL.filter(o=>xf(o)&&(!d||o.dist===d)&&(!b||o.br===b)&&words.every(w=>o.s.includes(w)||(/\d/.test(w)&&w.replace(/\D/g,'').length>=3&&o.d.includes(w.replace(/\D/g,'')))));
  if(x[0]==='b')LIST.sort((a,b)=>nextBd(a).n-nextBd(b).n);
  /* חיפוש מספר: מי שמספר הרכב הארגוני או הפרייבט שלו זהה בדיוק - ראשון ברשימה */
  ALL.forEach(o=>o._ex=0);
  if(x[0]!=='b'&&words.length===1&&/^\d+$/.test(words[0])){const w=words[0];LIST.forEach(o=>o._ex=o.car===w?2:o.pv===w?1:0);LIST.sort((a,b)=>b._ex-a._ex)}
  shown=0;$('M').innerHTML=(words.length?'':bdayBanner(d,b))+`<div class="cnt"><span>${LIST.length.toLocaleString('he-IL')} אנשי קשר</span><span>עודכן ${esc(DB.date||'')}</span></div><div id="L"></div><div id="more"></div>`;
  if(!LIST.length){$('L').innerHTML='<div class="empty">לא נמצאו תוצאות 🤷‍♂️</div>';return}
  more();scrollTo(0,0);
  const ob=new IntersectionObserver(es=>{if(es[0].isIntersecting)more()},{rootMargin:'600px'});ob.observe($('more'));
}
function hl(s){s=esc(s);if(!words.length)return s;for(const w of words){if(!w||/\d/.test(w))continue;const re=new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','i');s=s.replace(re,'<mark>$1</mark>')}return s}
const ini=n=>{const p=String(n).trim().split(/\s+/);return (p[0]||'').charAt(0)+(p.length>1?p[p.length-1].charAt(0):'')};
function more(){
  if(shown>=LIST.length)return;const L=$('L'),end=Math.min(LIST.length,shown+120);
  let grp=L.lastElementChild,last=L.dataset.lt||'',buf='';
  const flush=()=>{if(buf&&grp)grp.insertAdjacentHTML('beforeend',buf);buf=''};
  for(let k=shown;k<end;k++){const o=LIST[k],lt=o._ex===2?'🚑 מספר רכב ארגוני '+words[0]:o._ex===1?'🏷️ פרייבט '+words[0]:(o.n.charAt(0)||'#').toUpperCase();
    if(lt!==last){flush();L.insertAdjacentHTML('beforeend',`<div class="lt">${esc(lt)}</div><div class="grp"></div>`);grp=L.lastElementChild;last=lt}
    buf+=`<div class="row" onclick="card(${o.i})"><div class="av" style="background:${o.c}">${esc(ini(o.n))}</div><div class="nm"><b>${hl(o.n)}${soon(o)?' 🎂':''}</b><small>${hl([o.roles[0],o.br,o.city].filter(Boolean).join(' · '))}</small></div>${o.car?`<span class="pv car" title="מספר פנימי רכב ארגוני">🚑 ${words.includes(o.car)?`<mark>${esc(o.car)}</mark>`:esc(o.car)}</span>`:''}${o.pv?`<span class="pv">${esc(o.pv)}</span>`:''}${o.ph?`<a class="call" href="tel:${esc(o.d)}" onclick="event.stopPropagation()" aria-label="חיוג">📞</a>`:''}</div>`}
  flush();L.dataset.lt=last;shown=end;
}

/* ---------- כרטיס איש קשר ---------- */
const byI=i=>ALL.find(o=>o.i===i);
function age(bd){const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(bd||'');if(!m)return '';const t=new Date(),b=new Date(+m[3],m[2]-1,+m[1]);let a=t.getFullYear()-b.getFullYear();if(t<new Date(t.getFullYear(),b.getMonth(),b.getDate()))a--;return a>0&&a<120?a:''}
const intl=d=>d.startsWith('0')?'972'+d.slice(1):d;
function person(name){const o=ALL.find(x=>x.n===name);return o?`<span class="lnk" onclick="card(${o.i})">${esc(name)}</span>`:esc(name)}
function card(i){
  const o=byI(i);if(!o)return;const ov=document.createElement('div');ov.className='ov';ov.id='ov';
  const it=(k,l,v,href,raw)=>v?`<${href?`a href="${esc(href)}" target="${href.startsWith('http')?'_blank':'_self'}"`:'div'} class="it"><span class="k">${k}</span><span class="v"><small>${l}</small><span>${raw?v:esc(v)}</span></span></${href?'a':'div'}>`:'';
  const a=age(o.bd),addr=[o.st,o.city].filter(Boolean).join(', ');
  const perm=(o.perm||'').split(/;\s*/).filter(Boolean).map(p=>`<span class="tag">${esc(p)}</span>`).join('');
  ov.innerHTML=`<div class="sheet"><div class="top"><button class="x" onclick="$('ov').remove()">✕</button><div class="av big" style="background:${o.c};border:3px solid #fff">${esc(ini(o.n))}</div><h2>${esc(o.n)}</h2><div class="sub">${esc([o.pv?'פרייבט '+o.pv:'',o.br].filter(Boolean).join(' · '))}</div></div>
  <div class="acts">
    <a class="act${o.ph?'':' dis'}" href="tel:${esc(o.d)}"><i>📞</i>חיוג</a>
    <a class="act${o.d.length>=9?'':' dis'}" href="https://wa.me/${esc(intl(o.d))}" target="_blank"><i>💬</i>וואטסאפ</a>
    <a class="act${o.ph?'':' dis'}" href="sms:${esc(o.d)}"><i>✉️</i>הודעה</a>
    <a class="act${o.em?'':' dis'}" href="mailto:${esc(o.em)}"><i>📧</i>מייל</a>
    ${o.ph&&nextBd(o).n===0?`<a class="act" href="${esc(mazalUrl(o))}" target="_blank" onclick="sentMark(${o.i})"><i style="background:#fde68a">🎉</i>מזל טוב</a>`:''}
    <button class="act" onclick="vcf(${o.i})"><i>💾</i>שמירה</button>
  </div>
  <div class="box"><h3>פרטי קשר</h3>${it('📱','טלפון נייד',o.ph,o.ph?'tel:'+o.d:'')}${it('📧','מייל',o.em,o.em?'mailto:'+o.em:'')}${it('🏠','כתובת',addr,addr?'https://waze.com/ul?q='+encodeURIComponent(addr)+'&navigate=yes':'')}</div>
  <div class="box"><h3>ארגון</h3>${it('🏷️','פרייבט',o.pv)}${it('🧑‍⚕️','תפקיד',o.roles.map(p=>`<span class="tag">${esc(p)}</span>`).join(''),0,1)}${it('🏢','סניף',o.br)}${it('🗺️','מחוז',o.dist)}${it('👤','ראש סניף / מנהל אגף',o.head?person(o.head):'',0,1)}${it('👥','סגן ראש סניף',o.dep?person(o.dep):'',0,1)}${it('🚗','רכז תחבורה סניפי',o.trans?person(o.trans):'',0,1)}${it('🦺','קצין בטיחות מחוזי',o.safe?person(o.safe):'',0,1)}</div>
  ${o.bd||o.car||perm||o.pveh?`<div class="box"><h3>פרטים נוספים</h3>${it('🎂','תאריך לידה',o.bd?o.bd+(a?` (גיל ${a})`:''):'')}${hebLine(o)}${it('🚙','סוג רכב פרטי',o.pveh)}${it('🚑','מספר פנימי רכב ארגוני',o.car)}${it('🪪','אישור נהיגה ברכב ארגוני',perm,0,1)}</div>`:''}
  </div>`;
  ov.onclick=e=>{if(e.target===ov)ov.remove()};const old=$('ov');if(old)old.remove();document.body.append(ov);
}
/* ---------- יום הולדת עברי ----------
   מחושב מתאריך הלידה הלועזי. מי שנולד אחרי השקיעה - יום ההולדת העברי שלו יום אחד אחרי (אין לנו שעת לידה). */
const HM={Tishri:'תשרי',Heshvan:'חשוון',Kislev:'כסלו',Tevet:'טבת',Shevat:'שבט',Adar:'אדר','Adar I':'אדר א׳','Adar II':'אדר ב׳',Nisan:'ניסן',Iyar:'אייר',Sivan:'סיוון',Tamuz:'תמוז',Av:'אב',Elul:'אלול'};
const HF=new Intl.DateTimeFormat('en-u-ca-hebrew',{day:'numeric',month:'long',year:'numeric'});
function hparts(dt){const p={};HF.formatToParts(dt).forEach(x=>p[x.type]=x.value);return {m:p.month,d:+p.day,y:+p.year}}
function gem(n){/* מספר לאותיות עבריות: 15=ט״ו, 16=ט״ז, 5765=תשס״ה */
  n%=1000;let s='';while(n>=400){s+='ת';n-=400}for(const [v,c] of [[300,'ש'],[200,'ר'],[100,'ק']])if(n>=v){s+=c;n-=v}
  if(n===15)s+='טו';else if(n===16)s+='טז';else s+=['','י','כ','ל','מ','נ','ס','ע','פ','צ'][Math.floor(n/10)]+['','א','ב','ג','ד','ה','ו','ז','ח','ט'][n%10];
  return fin(s)}
function fin(s){return s.length>1?s.slice(0,-1)+'״'+s.slice(-1):s+'׳'}
function bdDate(bd){const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(bd||'');return m?new Date(+m[3],m[2]-1,+m[1],12):null}
function hb(o){if(o._h!==undefined)return o._h;const dt=bdDate(o.bd);o._h=dt?hparts(dt):null;return o._h}
/* אילו (חודש|יום) עבריים נחגגים בתאריך מסוים: אדר בשנה פשוטה = גם אדר א׳/ב׳; בשנה מעוברת מי שנולד באדר חוגג באדר ב׳.
   מי שנולד ביום ל׳ בחודש שהשנה יש בו רק 29 יום - חוגג בא׳ בחודש הבא */
const KC={};
function dayKeys(dt){const id=dt.toDateString();if(KC[id])return KC[id];const h=hparts(dt),ks=[h.m+'|'+h.d];
  if(h.m==='Adar')ks.push('Adar I|'+h.d,'Adar II|'+h.d);if(h.m==='Adar II')ks.push('Adar|'+h.d);
  if(h.d===1){const pv=hparts(new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()-1,12));if(pv.d===29){ks.push(pv.m+'|30');if(pv.m==='Adar')ks.push('Adar I|30','Adar II|30')}}
  return KC[id]=ks}
function bdWindow(n){const W=new Set(),t=new Date();for(let i=0;i<=n;i++)dayKeys(new Date(t.getFullYear(),t.getMonth(),t.getDate()+i,12)).forEach(k=>W.add(k));return W}
function nextBd(o){if(o._nb&&o._nb.t===new Date().toDateString())return o._nb;const k=hb(o),t=new Date();let r={n:9999,dt:null,t:t.toDateString()};
  if(k){const key=k.m+'|'+k.d;for(let i=0;i<=390;i++){const dt=new Date(t.getFullYear(),t.getMonth(),t.getDate()+i,12);if(dayKeys(dt).includes(key)){r={n:i,dt,t:r.t};break}}}return o._nb=r}
let W7=null;function soon(o){if(!o.bd)return false;if(!W7)W7=bdWindow(7);const k=hb(o);return !!k&&W7.has(k.m+'|'+k.d)}
function hebStr(o){const k=hb(o);return k?gem(k.d)+' ב'+(HM[k.m]||k.m)+' '+gem(k.y):''}
function hebLine(o){const k=hb(o);if(!k)return '';const nb=nextBd(o);
  const when=nb.dt?(nb.n===0?'🎉 היום!':nb.n===1?'מחר':`${['יום א׳','יום ב׳','יום ג׳','יום ד׳','יום ה׳','יום ו׳','שבת'][nb.dt.getDay()]} ${nb.dt.getDate()}.${nb.dt.getMonth()+1}.${nb.dt.getFullYear()} (בעוד ${nb.n} ימים)`):'';
  return `<div class="it"><span class="k">✡️</span><span class="v"><small>יום הולדת עברי</small><span>${hebStr(o)}</span>${when?`<small style="margin-top:2px">הבא: ${when}</small>`:''}</span></div>`}

/* ---------- מזל טוב ביום ההולדת העברי: הודעה מוכנה בוואטסאפ, חתומה בשם שלי ---------- */
const SIGN='דני בן דוד';
function mazalText(o){
  return `מזל טוב אח שלי היקר 🎉🎂\nמאחל לך שנה של בריאות, שמחה, הצלחה וברכה בכל מעשיך, והמשך בהצלת חיים בכוח ובשמחה! 🚑💪\n\n${SIGN}`}
function mazalUrl(o){return 'https://wa.me/'+intl(o.d)+'?text='+encodeURIComponent(mazalText(o))}
const sentKey=o=>'pb_mz_'+new Date().getFullYear()+'_'+(o.pv||o.d||o.n);
function sentMark(i){const o=byI(i);lput(sentKey(o),'1');document.querySelectorAll('[data-mz="'+i+'"]').forEach(e=>{e.classList.add('ok');e.textContent='✓ נשלח'});
  const ar=document.querySelector('.bday .ar');if(ar){const n=document.querySelectorAll('.bday .mz:not(.ok)').length;ar.textContent=n?n+' לשלוח ▾':'✓ נשלח לכולם'}}
function bdayBanner(d,b){const W=bdWindow(0),T=ALL.filter(o=>(!d||o.dist===d)&&(!b||o.br===b)&&o.d.length>=9&&(()=>{const k=hb(o);return !!k&&W.has(k.m+'|'+k.d)})());
  if(!T.length)return '';const left=T.filter(o=>!lget(sentKey(o))).length;
  return `<details class="bday"${T.length<=5?' open':''}><summary>🎂 היום יום הולדת עברי ל-${T.length}${d||b?' ('+esc(b||d)+')':''}<span class="ar">${left?left+' לשלוח ▾':'✓ נשלח לכולם'}</span></summary>`+
    T.map(o=>{const sent=!!lget(sentKey(o));return `<div class="br"><div class="av" style="background:${o.c};width:36px;height:36px;font-size:13px" onclick="card(${o.i})">${esc(ini(o.n))}</div><div class="nm" onclick="card(${o.i})"><b>${esc(o.n)}</b><small>${esc([o.br,age(o.bd)?'גיל '+age(o.bd):''].filter(Boolean).join(' · '))}</small></div><a class="mz${sent?' ok':''}" data-mz="${o.i}" href="${esc(mazalUrl(o))}" target="_blank" onclick="sentMark(${o.i})">${sent?'✓ נשלח':'🎉 מזל טוב'}</a></div>`}).join('')+'</details>'}

/* שמירה לאנשי הקשר בטלפון (קובץ vCard) */
function vcf(i){const o=byI(i);const v=['BEGIN:VCARD','VERSION:3.0','FN:'+o.n,'N:'+o.n+';;;;',o.ph?'TEL;TYPE=CELL:'+o.ph:'',o.em?'EMAIL:'+o.em:'',o.st||o.city?'ADR;TYPE=HOME:;;'+(o.st||'')+';'+(o.city||'')+';;;':'','ORG:איחוד הצלה'+(o.br?';'+o.br:''),o.pv?'NOTE:פרייבט '+o.pv:'','END:VCARD'].filter(Boolean).join('\r\n');
  const u=URL.createObjectURL(new Blob([v],{type:'text/vcard'}));const a=document.createElement('a');a.href=u;a.download=o.n+'.vcf';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
addEventListener('keydown',e=>{if(e.key==='Escape'){const o=$('ov');if(o)o.remove()}});

/* כפתור "למסך הבית": מתקין את ספר הטלפונים כאפליקציה נפרדת עם אייקון משלו */
let instEv=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEv=e;$('instB').hidden=false});
/* בתוך האפליקציה הראשית (בלי שורת כתובת) אי אפשר להתקין: פותחים את הדף בכרום, ושם לוחצים שוב */
const STANDALONE=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
async function install(){
  if(!instEv){
    if(STANDALONE){instHelp();return}
    if(/iPhone|iPad/i.test(navigator.userAgent)){alert('בספארי: לחץ על כפתור השיתוף (⬆️) ובחר "הוסף למסך הבית"');return}
    alert('בתפריט הדפדפן (⋮) בחר "הוספה למסך הבית" או "התקנת אפליקציה"');return}instEv.prompt();try{await instEv.userChoice}catch(e){}instEv=null;$('instB').hidden=true}
/* עזרה להתקנה כשנמצאים בתוך האפליקציה הראשית: פתיחה בכרום או העתקת הקישור */
function instHelp(){const url=location.origin+location.pathname.replace(/[^/]*$/,'')+'phonebook.html?focus=1',an=/Android/i.test(navigator.userAgent);
  const ov=document.createElement('div');ov.className='ov';ov.id='ov';ov.onclick=e=>{if(e.target===ov)ov.remove()};
  ov.innerHTML=`<div class="sheet" style="padding:0 0 20px"><div class="top"><button class="x" onclick="$('ov').remove()">✕</button><div style="font-size:44px">📲</div><h2>אייקון לספר הטלפונים</h2><div class="sub">מכאן אי אפשר להתקין. פותחים בדפדפן ומוסיפים משם</div></div>
  <div class="box" style="padding:14px;line-height:1.7;font-size:15px"><b>1.</b> ${an?'לחץ "פתח בכרום", או העתק את הקישור והדבק אותו בכרום.':'העתק את הקישור והדבק אותו בספארי.'}<br><b>2.</b> ${an?'בכרום: ⋮ (שלוש נקודות למעלה) ← <b>"הוספה למסך הבית"</b>.':'בספארי: כפתור השיתוף ⬆️ ← <b>"הוסף למסך הבית"</b>.'}<br><b>3.</b> על מסך הבית יופיע אייקון כתום "ספר טלפונים".</div>
  <div style="display:flex;flex-direction:column;gap:10px;margin:14px 12px 0">${an?`<a class="go" style="text-align:center;text-decoration:none" href="intent://${esc(url.replace(/^https?:\/\//,''))}#Intent;scheme=https;package=com.android.chrome;end">🌐 פתח בכרום</a>`:''}
  <button class="go" style="background:#475569;box-shadow:none" onclick="navigator.clipboard.writeText('${esc(url)}').then(()=>{this.textContent='✓ הקישור הועתק'},()=>prompt('העתק את הקישור:','${esc(url)}'))">📋 העתק קישור</button>
  <div style="direction:ltr;text-align:center;font-size:13px;color:var(--mut);word-break:break-all">${esc(url)}</div></div></div>`;
  const o=$('ov');if(o)o.remove();document.body.append(ov)}
addEventListener('appinstalled',()=>{$('instB').hidden=true});
const sv=lget('pb_pw');if(sv)unlock(sv);else lockView();
</script>
