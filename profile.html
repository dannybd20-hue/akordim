<script>
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function fmtPhone(p){p=(p||'').replace(/\D/g,'');return p.length===10?p.slice(0,3)+'-'+p.slice(3):p}
function waLink(p,t){p=(p||'').replace(/\D/g,'');if(p.startsWith('0'))p='972'+p.slice(1);return 'https://wa.me/'+p+(t?'?text='+encodeURIComponent(t):'')}
function pd(s){const m=/(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s||'')||/(\d{4})-(\d{2})-(\d{2})/.exec(s||'');if(!m)return null;return m[1].length===4?new Date(+m[1],m[2]-1,+m[3]):new Date(+m[3],m[2]-1,+m[1])}
const TODAY=new Date();const days=d=>Math.round((d-TODAY)/864e5);
const fmtN=n=>n==null?'—':Math.round(n).toLocaleString('he-IL');
const avg=a=>{a=a.filter(x=>x!=null&&!isNaN(x));return a.length?a.reduce((p,c)=>p+c,0)/a.length:null};
let DATA=null,REG=null,BR={};
const st={q:'',br:'',sort:'risk'};

/* מדדים לכל נהג */
function calc(p){
  const m=DATA.months.length-1,kmL=DATA.kmM[DATA.kmM.length-1];
  const sc=p.s?p.s[m]:null;
  const kms=p.km?Object.values(p.km).map(x=>x.km):[];const kmMon=p.km&&p.km[kmL]?p.km[kmL].km:null;
  const est=kms.length?kms.reduce((a,b)=>a+b,0)/kms.length*12:null;
  const A12=(p.acc||[]).filter(a=>{const d=pd(a.d);return d&&(TODAY-d)/864e5<=365});
  const F12=A12.filter(a=>/איחוד/.test(a.fault||''));
  const EM=p.evm?DATA.months.filter(M=>p.evm[M]):[],evM=EM[EM.length-1]||null,E=evM?p.evm[evM]:null;
  const evN=E?Object.values(E.ev).reduce((a,b)=>a+b[0],0):null;
  const ev100=E&&E.rep.km>0?evN/E.rep.km*100:null;
  return {evM,sc,kmMon,est,kmN:kms.length,a12:A12.length,f12:F12.length,kmAcc:est&&A12.length?est/A12.length:null,kmF:est&&F12.length?est/F12.length:null,ev100};
}
function grp(L){const C=L.map(p=>p._c),wk=C.filter(c=>c.est);
  return {n:L.length,sc:avg(C.map(c=>c.sc)),kmMon:avg(C.map(c=>c.kmMon).filter(x=>x>0)),est:avg(wk.map(c=>c.est)),ev100m:(()=>{const o={};C.forEach(c=>{if(c.ev100!=null)(o[c.evM]=o[c.evM]||[]).push(c.ev100)});for(const k in o)o[k]=avg(o[k]);return o})(),
    kmAcc:(()=>{const a=wk.reduce((s,c)=>s+c.a12,0);return a?wk.reduce((s,c)=>s+c.est,0)/a:null})(),
    kmF:(()=>{const a=wk.reduce((s,c)=>s+c.f12,0);return a?wk.reduce((s,c)=>s+c.est,0)/a:null})()}}
function prep(){DATA.people.forEach(p=>p._c=calc(p));REG=grp(DATA.people);const by={};DATA.people.forEach(p=>(by[p.br]=by[p.br]||[]).push(p));for(const b in by)BR[b]=grp(by[b])}

/* השוואה: dir=1 גבוה טוב, -1 נמוך טוב, 0 ניטרלי */
function cmp(v,ref,dir,fmt){if(v==null||ref==null)return `<small class="ref">${ref==null?'':'ממוצע '+fmt(ref)}</small>`;const r=v/ref;const good=dir===0?null:dir>0?r>=1.1:r<=0.9,bad=dir===0?null:dir>0?r<=0.9:r>=1.1;
  return `<small class="ref ${good?'g':bad?'b':''}">${good?'▲':bad?'▼':'≈'} ממוצע ${fmt(ref)}</small>`}
function tile(label,val,sub,cls){return `<div class="kp ${cls||''}"><span>${label}</span><b>${val}</b>${sub||''}</div>`}
const scCls=x=>x==null?'':x<25?'sc-low':x<35?'sc-mid':x<70?'sc-good':'sc-top';
const RISK={high:['סיכון גבוה','bad'],mid:['סיכון בינוני','warn']};

function listView(){

    <div class="legend">${L.length} נהגים · לחיצה על נהג פותחת את הפרופיל המלא</div>
    <div class="plist">${L.slice(0,300).map(p=>{const c=p._c;return `<button class="prow" data-p="${esc(p.pv||p.n+'|'+p.br)}"><span class="pn"><b>${esc(p.n)}</b><small>${esc([p.pv&&'פרייבט '+p.pv,p.br].filter(Boolean).join(' · '))}</small></span>
      <span class="chips">${c.sc!=null?`<i class="ch ${scCls(c.sc)}">סייפטי ${c.sc}</i>`:''}${c.kmMon?`<i class="ch">${fmtN(c.kmMon)} ק"מ</i>`:''}${c.a12?`<i class="ch ${c.f12?'sc-low':''}">${c.a12} תאונות${c.f12?` (${c.f12} באשמתו)`:''}</i>`:''}${p.risk?`<i class="ch ${p.risk.lvl==='high'?'sc-low':'sc-mid'}">🎯 ${RISK[p.risk.lvl][0]}</i>`:''}${p.sh?`<i class="ch sc-mid">🚑 לא פעיל</i>`:''}</span></button>`}).join('')}</div>${L.length>300?'<p class="legend">מוצגים 300 ראשונים – צמצם בחיפוש</p>':''}`;
  const qi=$('q');qi.oninput=e=>{st.q=e.target.value;const pos=e.target.selectionStart;listView();const n=$('q');n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}};
  $('br').onchange=e=>{st.br=e.target.value;listView()};$('sort').onchange=e=>{st.sort=e.target.value;listView()};
  document.querySelectorAll('.prow').forEach(b=>b.onclick=()=>{location.hash='p='+encodeURIComponent(b.dataset.p)});
}

function docCell(l,d){const t=pd(d);if(!t)return `<div class="doc"><span>${l}</span><b class="mu">—</b></div>`;const n=days(t);return `<div class="doc ${n<0?'bad':n<=30?'warn':'ok'}"><span>${l}</span><b>${esc(d)}</b><small>${n<0?'פג':n<=30?`עוד ${n} ימים`:'בתוקף'}</small></div>`}
function profView(key){
  const p=DATA.people.find(x=>(x.pv||x.n+'|'+x.br)===key);if(!p){location.hash='';return}
  const c=p._c,B=BR[p.br]||REG,m=DATA.months.length-1,kmL=DATA.kmM[DATA.kmM.length-1];
  const age=(()=>{const b=pd(p.bd);if(!b)return '';let a=TODAY.getFullYear()-b.getFullYear();if(TODAY<new Date(TODAY.getFullYear(),b.getMonth(),b.getDate()))a--;return a})();
  const both=(v,k,dir,f)=>`${cmp(v,B[k],dir,f).replace('ממוצע','סניף')}${cmp(v,REG[k],dir,f).replace('ממוצע','מרחב')}`;
  const sc=x=>x==null?'—':Math.round(x),km=x=>fmtN(x)+' ק"מ';
  const ext=p.ext||{},since=p.since;
  const A=(p.acc||[]).slice().sort((a,b)=>(pd(b.d)||0)-(pd(a.d)||0));

  const kmRows=p.km?Object.entries(p.km):[];
  $('app').innerHTML=`<button class="back" onclick="location.hash=''">→ חזרה לרשימה</button>
  <section class="ph"><div><h2>${esc(p.n)}</h2><p>${esc([p.pv&&'פרייבט '+p.pv,p.br,age&&'גיל '+age,p.city].filter(Boolean).join(' · '))}</p>
    <p class="mu">${p.coordn?'רכז: '+esc(p.coordn)+' · ':''}${(p.cars||[]).map(x=>'כלי '+esc(x.num)+(x.type?' '+esc(x.type):'')).join(', ')||'אין כלי צמוד'}</p>
    ${p.risk?`<p class="rk ${RISK[p.risk.lvl][1]}">🎯 ${RISK[p.risk.lvl][0]} (${p.risk.p}) · ${p.risk.why.map(esc).join(' · ')}</p>`:''}
    ${p.doubt?`<p class="rk bad">❓ ${esc(p.doubt)}</p>`:''}</div>
    ${p.ph?`<div class="acts"><a class="btn wa" href="${waLink(p.ph,'')}" target="_blank" rel="noopener">וואטסאפ</a><a class="btn" href="tel:${esc(p.ph)}">${fmtPhone(p.ph)}</a></div>`:''}</section>
  <div class="kps">
    ${tile('ציון סייפטי · '+esc(DATA.months[m]),sc(c.sc),both(c.sc,'sc',1,sc),scCls(c.sc))}
    ${tile('ק"מ · '+esc(kmL||'—'),c.kmMon!=null?fmtN(c.kmMon):'—',both(c.kmMon,'kmMon',0,fmtN))}
    ${tile('ק"מ בשנה (הערכה)',c.est?fmtN(c.est):'—',c.est?`<small class="ref">לפי ${c.kmN} חודש${c.kmN>1?'ים':''} נתונים</small>`+both(c.est,'est',0,fmtN):'')}
    ${tile('תאונות ב־12 חודשים',c.a12,c.a12?`<small class="ref ${c.f12?'b':''}">${c.f12} באשמתו</small>`:'<small class="ref g">אין</small>',c.f12?'bad':'')}
    ${tile('תאונה כל',c.kmAcc?km(c.kmAcc):c.a12?'—':'אין תאונות',c.kmAcc?both(c.kmAcc,'kmAcc',1,fmtN):'')}
    ${tile('תאונה באשמתו כל',c.kmF?km(c.kmF):c.f12?'—':'אין',c.kmF?both(c.kmF,'kmF',1,fmtN):'')}
    ${tile('התראות ל־100 ק"מ'+(c.evM?' · '+esc(c.evM):''),c.ev100!=null?c.ev100.toFixed(1):'—',c.ev100!=null?`${cmp(c.ev100,B.ev100m[c.evM],-1,x=>x.toFixed(1)).replace('ממוצע','סניף')}${cmp(c.ev100,REG.ev100m[c.evM],-1,x=>x.toFixed(1)).replace('ממוצע','מרחב')}`:'<small class="ref">אין תעודת משוב</small>')}
    ${tile('משמרות',p.sh?p.sh.a:'—',p.sh?`<small class="ref b">ינו–אוג 26 · 0 ביול–אוג</small>`:'<small class="ref">יתווסף בהמשך</small>',p.sh?'warn':'')}
  </div>
  <div class="pgrid">
  <section class="box"><h3>סייפטי – 12 חודשים</h3>${p.s?`<div class="mrow">${DATA.months.map((M,i)=>`<span class="mc ${scCls(p.s[i])}"><small>${esc(M.split(' ')[0].slice(0,3))}</small><b>${p.s[i]??'—'}</b></span>`).join('')}</div>`:'<p class="mu">אין ציוני סייפטי</p>'}
    ${EVL.map(M=>{const E=p.evm[M],ev=Object.entries(E.ev).sort((a,b)=>b[1][0]-a[1][0]);return `<h4>פילוח התראות · ${esc(M)} · ציון ${E.rep.score??'—'} · ${fmtN(E.rep.km)} ק"מ, ${E.rep.trips??'—'} נסיעות${E.rep.rank?` · מקום ${E.rep.rank[0]} מתוך ${E.rep.rank[1]}`:''}</h4><div class="bars">${ev.map(([k,[n,pc]])=>`<div class="bar"><span>${esc(k)}</span><i style="width:${Math.min(100,pc)}%"></i><b>${n} · ${Math.round(pc)}%</b></div>`).join('')}</div>`}).join('')}</section>
  <section class="box"><h3>תאונות (${A.length})</h3>${A.length?`<ol class="tl">${A.map(a=>`<li class="${/איחוד/.test(a.fault||'')?'bad':''}"><b>${esc(a.d)}</b> · ${esc(a.kind||'תאונה')} · ${esc(a.veh||'')}<br><small>${esc([a.fault&&'אשמה: '+a.fault,a.cause,a.trip,a.place].filter(Boolean).join(' · '))}</small></li>`).join('')}</ol>`:'<p class="mu">אין תאונות רשומות</p>'}</section>
  <section class="box"><h3>ק"מ לפי חודש (איתורן)</h3>${kmRows.length?`<table class="t"><tr><th>חודש</th><th>ק"מ</th><th>ימי נהיגה</th><th>כלים</th></tr>${kmRows.map(([M,x])=>`<tr><td>${esc(M)}</td><td>${fmtN(x.km)}</td><td>${x.days}</td><td>${x.v.filter(v=>v.km>0).map(v=>esc((v.type||'')+' '+(v.num||(v.plate||"").replace(/,\s*/g," · ")))+': '+fmtN(v.km)).join('<br>')}</td></tr>`).join('')}</table>`:'<p class="mu">אין נתוני ק"מ</p>'}</section>
  <section class="box"><h3>מסמכים ותוקפים</h3><div class="docs">${docCell('רישיון נהיגה',p.lic)}${docCell('הצהרת בריאות',p.health)}${p.pp?'<div class="doc"><span>מידע תעבורתי</span><b>דרכון</b></div>':docCell('מידע תעבורתי',p.traffic)}${docCell('הדרכה שנתית',p.train)}</div>
    <p class="mu" style="margin-top:8px">הרשאות: ${esc((p.perm||'').replace(/;\s*/g,' · ')||'—')}</p></section>
  <section class="box"><h3>ותק, טסטים והשתלמויות</h3><dl>
    ${since?`<dt>נוהג בארגון מ־</dt><dd>${esc(since[0])} (${esc(since[1])})</dd>`:''}
    ${ext.adm?`<dt>טסט מנהלה</dt><dd>${esc(ext.adm)}</dd>`:''}${ext.mt?`<dt>טסט פנימי אופנוע</dt><dd>${esc(ext.mt)}</dd>`:''}
    ${ext.r1?`<dt>השתלמות רכיבה יום א</dt><dd>${esc(ext.r1)}</dd>`:''}${ext.r2?`<dt>השתלמות רכיבה יום ב</dt><dd>${esc(ext.r2)}</dd>`:''}
    <dt>השתלמות שנתית 2026</dt><dd>${p.x&&p.x.ann?`<b class="bad">לא בוצעה (${esc(p.x.ann)})</b>`:'בוצעה / לא נדרשת'}</dd></dl>
    ${(p.crs||[]).length?`<div class="tags">${p.crs.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>`:''}</section>
  <section class="box"><h3>הדרכות רכיבה ונהיגה</h3>${(p.ride||[]).length||(p.alt||[]).length?`<ol class="tl">${(p.ride||[]).map(r=>`<li><b>${esc(r.d)}</b> · 🏍️ רכיבה · ציון ${esc(r.sc||'—')}${r.ins?' · '+esc(r.ins):''}${r.note?`<br><small>${esc(r.note)}</small>`:''}</li>`).join('')}${(p.alt||[]).map(r=>`<li><b>${esc(r.d)}</b> · 🚑 אלטרנטיב ${esc(r.st||'')} · ${(r.sc||[]).map(z=>esc(z[0])+' '+esc(z[1])).join(' · ')}${r.note?`<br><small>${esc(r.note)}</small>`:''}</li>`).join('')}</ol>`:'<p class="mu">אין רשומות</p>'}</section>
  </div>
  <p class="legend">"ק"מ בשנה" הוא הערכה: ממוצע החודשים שיש מאיתורן × 12. "תאונה כל X ק"מ" = הק"מ השנתי חלקי מספר התאונות ב־12 החודשים האחרונים. ▲ טוב מהממוצע, ▼ פחות טוב, ≈ דומה (בטווח 10%).</p>`;
  window.scrollTo(0,0);
}
function route(){if(!DATA)return;const h=location.hash.match(/^#p=(.+)$/);h?profView(decodeURIComponent(h[1])):listView()}
window.addEventListener('hashchange',route);

async function decrypt(pw){
  const buf=new Uint8Array(await (await fetch('profile/profile.bin',{cache:'no-cache'})).arrayBuffer());
  if(String.fromCharCode(buf[0],buf[1],buf[2])!=='KB1')throw new Error('file');
  const salt=buf.slice(3,19),iv=buf.slice(19,31),ct=buf.slice(31);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  let gz;try{gz=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct)}catch(e){throw new Error('pw')}
  return JSON.parse(await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
}
function lockView(err){$('lockB').hidden=true;
  $('app').innerHTML=`<div class="lockc"><h2>🔐 פרופיל נהג</h2><p style="margin:0;color:var(--muted)">הקלד את הסיסמה של ניהול קצב"ת</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="סיסמה" onkeydown="if(event.key==='Enter')unlock()">
  <label style="color:var(--muted);font-weight:600"><input type="checkbox" id="rem" checked> לזכור במכשיר הזה</label>
  <button class="go" id="ub" onclick="unlock()">פתיחה 🔓</button><div class="err">${esc(err||'')}</div></div>`;setTimeout(()=>{const i=$('pw');if(i)i.focus()},50)}
async function unlock(saved){
  const pw=saved||$('pw').value.trim().replace(/[.\s]+$/,'');
  if(!saved){$('ub').disabled=true;$('ub').textContent='פותח… (כמה שניות)'}else $('app').innerHTML='<div class="empty">פותח את הנתונים…</div>';
  try{DATA=await decrypt(pw);if(!saved)ls('kbt_pw',$('rem').checked?pw:'');$('lockB').hidden=false;$('upd').textContent='עודכן: '+DATA.upd;prep();route()}
  catch(e){if(saved&&e.message==='pw')ls('kbt_pw','');lockView(e.message==='pw'?'סיסמה שגויה':'אין חיבור לאינטרנט, נסה שוב')}
}
function relock(){if(!confirm('לנעול ולשכוח את הסיסמה במכשיר הזה?'))return;ls('kbt_pw','');DATA=null;lockView()}
{const p=ls('kbt_pw');p?unlock(p):lockView()}
