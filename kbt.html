<style>
/* Layout: sticky header with tabs, single column of person/vehicle cards grouped by severity */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --fg:#17202b; --muted:#5d6876; --line:#dde2e9;
  --accent:#1f4f8f; --accent-fg:#ffffff;
  --bad:#c62f2f; --bad-bg:#fbe9e9; --warn:#a96200; --warn-bg:#fdf1dd; --ok:#1d7a46; --ok-bg:#e3f4ea;
  --today:#7a2bb8; --today-bg:#f1e7fb;
  --plate:#f6c800; --plate-fg:#111;
  --wa:#1b9e52;
  --f-display:"Secular One","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#18202a; --fg:#e7ecf2; --muted:#9aa6b4; --line:#2a3542;
  --accent:#6fa3e8; --accent-fg:#0b1220;
  --bad:#ff7b7b; --bad-bg:#3a1c1f; --warn:#f0b257; --warn-bg:#352813; --ok:#6fd49a; --ok-bg:#16301f;
  --today:#c99bf3; --today-bg:#2c1d3c; --plate:#e8bd00; --plate-fg:#111; --wa:#3ccf7c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#18202a; --fg:#e7ecf2; --muted:#9aa6b4; --line:#2a3542;
  --accent:#6fa3e8; --accent-fg:#0b1220;
  --bad:#ff7b7b; --bad-bg:#3a1c1f; --warn:#f0b257; --warn-bg:#352813; --ok:#6fd49a; --ok-bg:#16301f;
  --today:#c99bf3; --today-bg:#2c1d3c; --plate:#e8bd00; --plate-fg:#111; --wa:#3ccf7c; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-fg)}
header .wrap{padding-block:14px 0}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{background:#fff;border-radius:10px;padding:5px 8px;flex:none}
.logo img{display:block;width:84px;height:auto}
.hbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hb{border:0;background:#ffffff26;color:inherit;border-radius:10px;padding:7px 11px;font:700 .9rem var(--f-body);cursor:pointer;white-space:nowrap}
.lockc{max-width:380px;margin:30px auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px;text-align:center}
.lockc h2{margin:0;font-family:var(--f-display);font-weight:400}
.lockc input[type=password],.lockc input[type=text]{font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);text-align:center;direction:ltr;width:100%}
.lockc .go{border:0;border-radius:12px;padding:13px;font:700 1.05rem var(--f-body);background:var(--accent);color:var(--accent-fg);cursor:pointer}
.lockc .err{color:var(--bad);font-weight:700;min-height:1.2em}
h1{font-family:var(--f-display);font-weight:400;font-size:1.6rem;margin:0;letter-spacing:.01em}
.upd{font-size:.85rem;opacity:.85}
.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
.tab{appearance:none;border:0;background:transparent;color:inherit;font:600 1rem var(--f-body);padding:10px 14px;border-radius:10px 10px 0 0;opacity:.8;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--bg);color:var(--fg);opacity:1}
.tab .n{display:inline-block;min-width:1.6em;padding:0 .4em;margin-inline-start:6px;border-radius:99px;background:var(--bad);color:#fff;font-size:.8rem;text-align:center}
main .wrap{padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat{appearance:none;font:inherit;color:inherit;text-align:start;cursor:pointer}
.stat:hover{border-color:var(--accent)}
.stat.on{outline:3px solid var(--accent);outline-offset:-1px}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--muted)}
.stat.today b{color:var(--today)} .stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.controls input,.controls select{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);min-width:0}
.controls input{flex:1 1 200px}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cats button{appearance:none;flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:600 .95rem var(--f-body);padding:8px 12px;border-radius:99px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.cats button span{font-size:.78rem;font-weight:700;background:var(--bg);color:var(--muted);border-radius:99px;padding:0 7px;font-variant-numeric:tabular-nums}
.cats button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.cats button[aria-pressed="true"] span{background:#ffffff33;color:inherit}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{appearance:none;border:0;background:transparent;color:var(--fg);font:600 .95rem var(--f-body);padding:9px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h2{font-family:var(--f-display);font-weight:400;font-size:1.15rem;margin:8px 0 0;display:flex;align-items:center;gap:8px}
h2 .cnt{font-family:var(--f-body);font-weight:700;font-size:.85rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start}
.card .who{min-width:0}
.name{font-weight:700;font-size:1.05rem}
.meta{color:var(--muted);font-size:.88rem;display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center}
.plate{display:inline-block;background:var(--plate);color:var(--plate-fg);border:1.5px solid #111;border-radius:4px;padding:0 6px;font:700 .85rem/1.5 ui-monospace,Menlo,Consolas,monospace;direction:ltr;letter-spacing:.04em}
.veh{margin-top:6px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.veh.none{color:var(--muted);font-weight:600;font-size:.88rem}
.issues{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.irow.dovi{background:var(--bg);border-radius:10px;padding:6px 8px}
.irow.dovi .dl{font-size:.86rem;font-weight:700;color:var(--muted)}
.routebar{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.go-maps{display:block;text-align:center;text-decoration:none;background:var(--accent);color:var(--accent-fg);font-weight:700;padding:11px;border-radius:10px}
.stopn{display:inline-grid;place-items:center;min-width:1.7em;height:1.7em;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:.85rem;margin-inline-end:8px}
.card.off{opacity:.55}
.addr{display:flex;gap:6px;margin-top:8px;align-items:center}
.addr input{flex:1;min-width:0;font:inherit;font-size:.92rem;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.inc{display:inline-flex;align-items:center;gap:4px;font-size:.88rem;font-weight:600;color:var(--muted)}
.irow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.sm{padding:6px 10px!important;font-size:.88rem;border-radius:8px}
.mail{display:inline-flex;align-items:center;text-decoration:none;background:transparent;color:var(--accent);border:1.5px solid var(--accent);font:700 .88rem var(--f-body);cursor:pointer}
.em{direction:ltr;unicode-bidi:isolate;word-break:break-all}
.chip{font-size:.86rem;font-weight:600;padding:3px 9px;border-radius:99px;font-variant-numeric:tabular-nums}
.chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.today{background:var(--today-bg);color:var(--today)} .chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.miss{background:var(--bg);color:var(--muted);border:1px dashed var(--line)}
.acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.wa{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;background:var(--wa);color:#fff;font-weight:700;padding:8px 12px;border-radius:10px;white-space:nowrap}
.wa svg{width:18px;height:18px}
.wa.done{background:transparent;color:var(--wa);border:1.5px solid var(--wa)}
.nophone{font-size:.82rem;color:var(--muted);text-align:center}
.tel{font-size:.85rem;color:var(--muted);direction:ltr;text-align:center;user-select:all;font-variant-numeric:tabular-nums}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{position:sticky;top:0;background:var(--surface);color:var(--muted);font-weight:700;font-size:.8rem}
td.d-bad{color:var(--bad);font-weight:700} td.d-warn{color:var(--warn);font-weight:700} td.d-today{color:var(--today);font-weight:700}
.more{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 .95rem var(--f-body);padding:10px;border-radius:10px;cursor:pointer}
.legend{font-size:.85rem;color:var(--muted)}
@media (max-width:520px){.card{grid-template-columns:1fr}.acts{flex-direction:row;flex-wrap:wrap}.wa{flex:1}}
/*ACC-CSS*/
.acck.pend{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.accq{margin:8px 0 0;font-size:.92rem;white-space:pre-wrap}.pendt{color:var(--bad)}
details.accq summary{cursor:pointer;color:var(--accent)}details.accq .pre{margin-top:6px;background:var(--bg);border-radius:8px;padding:8px 10px;font-size:.88rem}
.invov{position:fixed;inset:0;z-index:50;background:#0008;display:flex;align-items:center;justify-content:center;padding:12px}
.invbox{background:var(--surface);color:var(--fg);border-radius:16px;width:100%;max-width:760px;max-height:94vh;display:flex;flex-direction:column;gap:10px;padding:14px}
.invh{display:flex;justify-content:space-between;align-items:center;gap:10px}.invh small{color:var(--muted)}
.invh .x{background:var(--bg);color:var(--fg)}
#invt{flex:1;min-height:52vh;font:15px/1.5 var(--f-body);direction:rtl;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--fg);resize:vertical}
/*ACC-CSS-END*/
/*CHG-CSS*/
.chgr{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;padding:6px 10px;border-radius:8px;margin:4px 0;background:var(--bg);border-inline-start:4px solid var(--muted);font-size:.92rem}
.chgr.good{border-color:var(--ok);background:var(--ok-bg)}.chgr.bad{border-color:var(--bad);background:var(--bad-bg)}
.chgr .f{font-weight:700}.chgr .o{color:var(--muted);text-decoration:line-through}.chgr .ar{color:var(--muted)}.chgr.good .v{color:var(--ok);font-weight:700}.chgr.bad .v{color:var(--bad);font-weight:700}
.chgk{padding:0 6px;border-radius:6px;font-weight:700}.chgk.good{background:var(--ok-bg);color:var(--ok)}.chgk.bad{background:var(--bad-bg);color:var(--bad)}.chgk.info{background:var(--bg);color:var(--muted)}
.stat.ok b{color:var(--ok)}.chgc{display:inline-block;margin-top:6px}
tr.chgrow td{background:var(--today-bg)}tr.chgrow td:first-child{box-shadow:inset -4px 0 0 var(--today)}
.tab .n.fresh{background:var(--today);color:#fff}
/*CHG-CSS-END*/
</style>
</head>

<script>
const WA_ICON='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5 0a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.7-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-1 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3Z"/></svg>';

/* ===== נוסחי הודעות ===== */
const FORM_URL='https://dannybd20-hue.github.io/akordim/bdika.html';
const SIGN='בברכה,\nדני בן דוד\nקצין בטיחות בתעבורה\nמרחב ירושלים';
const APP_PATH='https://uh1221.com/myProfileI\n*(למטה: עדכון פרטי רישיון)*';
const DBJ_URL='https://uh1221.com/DBJ';
/* קישור לטופס הבדיקה עם פרטי הנהג וסוג הכלי מהמערכת (שם מקודד בקיצור, כדי שהקישור לא יהיה ארוך) */
const TCODE={'אופנוע':'m','אמבולנס':'a','מינילנס':'n','רכב':'c',"ג'יפ":'s','רכב שטח':'s'};
function formLink(v){const d=(DATA.drivers||[]).find(x=>(v.phone&&x.phone===v.phone)||x.name===v.name)||{};
  const b64=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s||''))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return `${FORM_URL}#v${v.num}.${v.priv||d.priv||''}.${TCODE[v.type]||''}.${b64(v.name)}`}
function first(n){return (n||'').split(' ')[0]}
function carTxt(c){return `כלי מס' ${c.num}`}
function carLine(d){return d.cars&&d.cars.length?`\n(${d.cars.map(carTxt).join(', ')})`:''}
const DOVI={wa:'972502073341',mail:'doviD@1221.org.il',cc:'yehudalv@1221.org.il'};
function doviMsg(d,i){return `שלום דובי,\n\nלנהג שפרטיו מופיעים מטה פג תוקף בדיקת המידע התעבורתי (עבר תעבורתי) בתאריך ${i.dateStr}.\nאודה לך אם תוציא עבורו בדיקה חדשה, ותעדכן אותי ברגע שהבדיקה בוצעה.\n\n*פרטי הנהג:*\nשם: ${d.name}\nת.ז.: ${(d.idn||'').replace(/-/g,'')||'________'}\nמס' רישיון נהיגה: ${d.licn||'________'}\nפרייבט: ${d.priv||'—'}\nסניף: ${d.branch||'—'}\n\nתודה רבה,\n${SIGN.replace('בברכה,\n','')}`}
// i = {k, lvl, n, dateStr, srcStr}
function soonTxt(i,f){return i.n===1?(f?'*תפוג מחר*':'*יפוג מחר*'):`*${f?'תפוג':'יפוג'} בעוד ${i.n} ימים*`}
const MSG={

const DAY=86400000;
const T0=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const TODAY_KEY=T0.toISOString().slice(0,10);
function pd(s){const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s||'');if(!m)return null;return new Date(+m[3],+m[2]-1,+m[1])}
function fmt(d){return d?d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric'}):'—'}
function addYear(d){const x=new Date(d);x.setFullYear(x.getFullYear()+1);return x}
function diff(d){return Math.round((d-T0)/DAY)}

const VEH_ITEMS=[
  {k:'test',label:'טסט (רישיון רכב)',due:v=>pd(v.test),word:'בתוקף עד',minWin:7},
  {k:'service',label:'טיפול שנתי',due:v=>{const d=pd(v.service);return d?addYear(d):null},word:'טיפול אחרון',src:v=>pd(v.service)},
  {k:'check',label:'בדיקת תקינות',due:v=>pd(v.check),word:'מועד הבדיקה',skip:v=>isDone(v)}

const DRV_ITEMS=[
  {k:'lic',label:'רישיון נהיגה',due:d=>pd(d.lic),word:'בתוקף עד'},
  {k:'health',label:'הצהרת בריאות',due:d=>pd(d.health),word:'בתוקף עד'},
  {k:'traffic',label:'מידע תעבורתי',due:d=>pd(d.traffic),word:'בתוקף עד',skip:d=>d.pp}
];
function evalItems(rec,items,win){
  const out=[];
  for(const it of items){
    if(it.skip&&it.skip(rec))continue; // בעלי דרכון: אין בדיקת מידע תעבורתי
    const due=it.due(rec);
    if(!due){out.push({k:it.k,label:it.label,lvl:'miss',chip:`${it.label}: חסר תאריך`});continue}
    const n=diff(due);
    const base={k:it.k,label:it.label,n,dateStr:fmt(due),srcStr:it.src?fmt(it.src(rec)):fmt(due)};
    if(n===0) out.push({...base,lvl:'today',chip:`${it.label} · פג היום`});
    else if(n<0) out.push({...base,lvl:'bad',chip:`${it.label} · באיחור ${-n} ימים`});
    else if(n<=Math.max(win,it.minWin||0)) out.push({...base,lvl:'warn',chip:`${it.label} · עוד ${n} ימים`});
  }
  return out;
}

/* הנתונים שמורים באתר רק כקובץ מוצפן (kbt/kbt.bin), ונפתחים בטלפון עם הסיסמה.
   הצפנה: PBKDF2 (600,000 סבבים) + AES-GCM, כמו ספר הטלפונים. */
async function decrypt(pw){
  const buf=new Uint8Array(await (await fetch('kbt/kbt.bin',{cache:'no-cache'})).arrayBuffer());
  if(String.fromCharCode(buf[0],buf[1],buf[2])!=='KB1')throw new Error('file');
  const salt=buf.slice(3,19),iv=buf.slice(19,31),ct=buf.slice(31);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  let gz;try{gz=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct)}catch(e){throw new Error('pw')}
  const txt=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(txt);
}

}

  for(const d of DATA.drivers){let is=evalItems(d,DRV_ITEMS,state.win);if(!state.showMiss)is=is.filter(i=>i.lvl!=='miss');if(state.cat&&!allCats)is=is.filter(i=>i.k===state.cat);if(is.length)rows.push({type:'driver',rec:d,is,key:'d:'+(d.id||d.priv)})}

function card(r){
  const o=r.rec,isV=r.type==='vehicle';
  const meta=isV
    ?`<span class="plate">${esc(o.plate)}</span><span>מס' פנימי ${esc(o.num)}</span><span>${esc(o.type)}</span><span>${esc(o.branch)}</span>`
    :`<span>פרייבט ${esc(o.priv)}</span><span>${esc(o.branch)}</span>`;
  const veh=isV?`<div class="veh">🚑 כלי ${esc(o.num)}${o.type?' · '+esc(o.type):''}</div>`
    :(o.cars&&o.cars.length?o.cars.map(c=>`<div class="veh">🚑 כלי ${esc(c.num)}${c.type?' · '+esc(c.type):''}${c.plate?` <span class="plate">${esc(c.plate)}</span>`:''}</div>`).join(''):`<div class="veh none">אין כלי צמוד${o.perm?' · מורשה: '+esc(o.perm.replace(/;\s*/g,', ')):''}</div>`);
  const contact=`<div class="tel">${unitOf(o)?`<b style="color:var(--accent)">↪ דרך הרכז ${esc(unitOf(o).n)}</b><br>${fmtPhone(unitOf(o).ph)}<br><span class="em">מתנדב: </span>`:''}${o.phone?fmtPhone(o.phone):'אין טלפון'}${o.email?`<br><span class="em">${esc(o.email)}</span>`:''}</div>`;
  const rows=r.is.map(i=>{
    if(i.lvl==='miss'||!MSG[i.k])return `<div class="irow"><span class="chip ${i.lvl}">${esc(i.chip)}</span></div>`;
    const fk=r.key+':'+i.k,fr=firstRec(fk);
    const is2=!!(fr&&fr.due===i.dateStr&&fr.d<TODAY_KEY&&(i.lvl==='bad'||i.lvl==='today'));
    const text=is2?MSG2[i.k](o,i,fr):MSG[i.k](o,i);
    const sk='sent:'+r.key+':'+i.k+':'+TODAY_KEY;const sent=ls(sk);
    const fa=` data-first="${esc(fk)}" data-due="${esc(i.dateStr||'')}"`;
    const subj=`${is2?'תזכורת: ':''}${SUBJ[i.k]}${isV?` – כלי ${o.num}`:''} – קצב"ת ירושלים`;
    const wa=uPh(o)?`<a class="wa sm${sent?' done':''}" href="${waLink(uPh(o),uTxt(o,text))}" target="_blank" rel="noopener" data-sent="${esc(sk)}"${fa}>${WA_ICON}${sent?'נפתח היום':unitOf(o)?'לרכז '+first(unitOf(o).n):is2?'וואטסאפ · תזכורת':'וואטסאפ'}</a>`:'';
    const ml=`<a class="mail sm" href="mailto:${esc(uMail(o))}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(uTxt(o,text).replace(/\*/g,''))}" data-sent="${esc(sk)}"${fa}>${is2?'מייל · תזכורת':'מייל'}</a>`;
    const cp=`<button class="mail sm" type="button" data-copy="${esc(uTxt(o,text))}">העתק</button>`;
    let dov='';
    if(i.k==='traffic'&&(i.lvl==='bad'||i.lvl==='today')){
      const t=doviMsg(o,i),dk='sent:'+r.key+':dovi:'+TODAY_KEY,ds=ls(dk);
      dov=`<div class="irow dovi"><span class="dl">בקשה לבדיקה חדשה מדובי</span><span class="btns"><a class="wa sm${ds?' done':''}" href="${waLink(DOVI.wa,t)}" target="_blank" rel="noopener" data-sent="${esc(dk)}">${WA_ICON}${ds?'נפתח היום':'לדובי'}</a><a class="mail sm" href="mailto:${DOVI.mail}?cc=${DOVI.cc}&subject=${encodeURIComponent('בקשה לבדיקת מידע תעבורתי – '+o.name)}&body=${encodeURIComponent(t.replace(/\*/g,''))}" data-sent="${esc(dk)}">מייל לדובי</a><button class="mail sm" type="button" data-copy="${esc(t)}">העתק</button></span></div>`;
    }
    const note=fr&&fr.due===i.dateStr?`<span class="chip miss">${is2?'🔁 תזכורת · ':''}הודעה ראשונה נשלחה ${fmt(new Date(fr.d))}</span>`:'';
    return `<div class="irow"><span class="chip ${i.lvl}">${esc(i.chip)}</span>${note}<span class="btns">${wa}${ml}${cp}</span></div>${dov}`;
  }).join('');
  return `<div class="card"><div class="who"><div class="name">${esc(o.name)}</div><div class="meta">${isV?'<span>נהג</span>':''}${meta}</div>${veh}${isV&&o.susp?`<span class="chip warn chgc">⚠ חשוד כתקול בסייפטי: ${o.susp.worse} מתוך ${o.susp.n} נהגים מקבלים עליו ציון נמוך מהרגיל (${o.susp.t} פניות ל־100 ק״מ מול ${o.susp.te}) – לפתוח קריאה באיתורן</span>`:''}${isV?chgChip('veh',o.num):chgChip('p',o.priv)}${!isV&&o.sh?`<span class="chip ${o.sh.a?'warn':'bad'} chgc">🚑 לא פעיל במשמרות · ${o.sh.a} משמרות ינו–אוג, 0 ביול–אוג</span>`:''}</div>${contact}<div class="issues">${rows}</div></div>`;
}

const CATS=[['','הכל'],['test','טסט'],['service','טיפול שנתי'],['check','בדיקת תקינות'],['lic','רישיון נהיגה'],['health','הצהרת בריאות'],['traffic','מידע תעבורתי']];
function catBar(every){
  const n={};every.forEach(r=>{if(state.kind!=='all'&&r.type!==state.kind)return;r.is.forEach(i=>{if(i.lvl!=='miss'){n[i.k]=(n[i.k]||0)+1;n['']=(n['']||0)+1}})});
  const vk=['test','service','check'],dk=['lic','health','traffic'];
  return `<div class="cats" role="group" aria-label="קטגוריית חריגה">${CATS.filter(([k])=>!k||state.kind==='all'||(state.kind==='vehicle'?vk:dk).includes(k)).map(([k,l])=>`<button data-cat="${k}" aria-pressed="${state.cat===k}">${l}<span>${n[k]||0}</span></button>`).join('')}</div>`;
}
function controls(withKind){
  const branches=[...new Set([...DATA.vehicles,...DATA.drivers].map(x=>x.branch).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'he'));
  return `<div class="controls">
    <input id="q" type="search" placeholder="חיפוש שם, פרייבט, מס' רכב, טלפון…" value="${esc(state.q)}">
    <select id="branch"><option value="">כל הסניפים</option>${branches.map(b=>`<option${b===state.branch?' selected':''}>${esc(b)}</option>`).join('')}</select>
    ${withKind?`<div class="seg" role="group" aria-label="סוג">${[['all','הכל'],['vehicle','רכבים'],['driver','נהגים']].map(([k,l])=>`<button data-kind="${k}" aria-pressed="${state.kind===k}">${l}</button>`).join('')}</div>
    <select id="win" aria-label="התראה מוקדמת">${[3,7,14,30,60,0].map(n=>`<option value="${n}"${n===state.win?' selected':''}>${n?`התראה ${n} ימים מראש`:'רק מה שכבר פג'}</option>`).join('')}</select>`:''}
  </div>`;
}

function render(){
  if(!DATA)return;
  const app=document.getElementById('app');
  const all=buildAlerts(),every=buildAlerts(true);
  document.getElementById('n-alerts').textContent=every.filter(r=>r.lvl==='today'||r.lvl==='bad').length||'';
  if(state.view==='route'){renderRoute();return}
  if(state.view==='acc'){renderAcc();return}
  if(state.view==='ann'){renderAnn();return}
  if(state.view==='chg'){renderChg();return}
  if(state.view==='insp'){renderInsp();return}
  if(state.view==='alerts'){
    const rows=all.filter(r=>(state.kind==='all'||r.type===state.kind)&&matches(r)&&(!state.only||r.lvl===state.only));
    const c=l=>rows.filter(r=>r.lvl===l).length;
    const groups=[['today','נכנסו לחריגה היום','var(--today)'],['bad','בחריגה','var(--bad)'],['warn',`יפוג ב־${state.win} הימים הקרובים`,'var(--warn)'],['miss','חסר תאריך במערכת','var(--muted)']];
    let html=`<div class="summary">
      <button class="stat today${state.only==='today'?' on':''}" data-only="today"><b>${c('today')}</b><span>חריגות חדשות היום</span></button>
      <button class="stat bad${state.only==='bad'?' on':''}" data-only="bad"><b>${c('bad')}</b><span>בחריגה</span></button>
      <button class="stat warn${state.only==='warn'?' on':''}" data-only="warn"><b>${c('warn')}</b><span>מתקרבים לפקיעה</span></button>
      <button class="stat" data-goto="veh"><b>${DATA.vehicles.length} / ${DATA.drivers.length}</b><span>רכבים / נהגים במעקב</span></button>
    </div>${controls(true)}
    ${catBar(every)}
    ${state.only?`<div class="legend">מוצג רק: <b>${{today:'חריגות חדשות היום',bad:'בחריגה',warn:'מתקרבים לפקיעה'}[state.only]}</b> · <a href="#" data-only="${state.only}">הצג הכל</a></div>`:''}
    <label class="legend"><input type="checkbox" id="miss"${state.showMiss?' checked':''}> הצג גם רשומות בלי תאריך</label>
    <div class="legend">טיפול שנתי נחשב בחריגה כשעברה שנה מהטיפול האחרון. טסט מופיע תמיד שבוע לפני.</div>`;
    let shown=0;
    for(const [l,t,col] of groups){
      const g=rows.filter(r=>r.lvl===l).sort((a,b)=>(a.is[0].n??0)-(b.is[0].n??0));
      if(!g.length)continue;
      const slice=g.slice(0,Math.max(0,state.limit-shown));shown+=slice.length;
      html+=`<h2><span class="dot" style="background:${col}"></span>${t}<span class="cnt">${g.length}</span></h2><div class="list">${slice.map(card).join('')}</div>`;
      if(slice.length<g.length){html+=`<button class="more" id="more">הצג עוד</button>`;break}
    }
    if(!rows.length)html+=`<div class="empty">אין חריגות לפי הסינון הנוכחי.</div>`;
    app.innerHTML=html;
  } else {
    const isV=state.view==='veh';
    const list=(isV?DATA.vehicles:DATA.drivers).filter(o=>matches({rec:o}));
    const cell=(d,src)=>{if(!d)return '<td>—</td>';const n=diff(d);const cl=n<0?'d-bad':n===0?'d-today':n<=state.win?'d-warn':'';return `<td class="${cl}">${fmt(src||d)}</td>`};
    const head=isV?['רישוי','מס\' פנימי','סוג','נהג','סניף','טסט עד','טיפול אחרון','בדיקת תקינות','ביטוח עד','טלפון']
                  :['שם','פרייבט','סניף','רכב','רישיון נהיגה','הצהרת בריאות','מידע תעבורתי','הדרכה שנתית','משמרות ינו–אוג','טלפון'];
    const body=list.map(o=>isV
      ?`<tr${chgOf('veh',o.num).length?` class="chgrow" title="${esc(chgTip(chgOf('veh',o.num)))}"`:''}><td><span class="plate">${esc(o.plate)}</span>${o.susp?`<br><span class="chip warn" title="${o.susp.worse} מתוך ${o.susp.n} נהגים קיבלו עליו ציון נמוך בממוצע ב־${-o.susp.d} נק׳ מהרגיל שלהם; ${o.susp.t} פניות ל־100 ק״מ מול ${o.susp.te} בכלים אחרים">⚠ חשוד כתקול בסייפטי</span>`:''}</td><td>${esc(o.num)}</td><td>${esc(o.type)}</td><td>${esc(o.name)}</td><td>${esc(o.branch)}</td>${cell(pd(o.test))}${cell(pd(o.service)?addYear(pd(o.service)):null,pd(o.service))}${cell(pd(o.check))}${cell(pd(o.ins))}<td dir="ltr">${fmtPhone(o.phone)}</td></tr>`
      :`<tr${chgOf('p',o.priv).length?` class="chgrow" title="${esc(chgTip(chgOf('p',o.priv)))}"`:''}><td>${chgOf('p',o.priv).length?'🆕 ':''}${esc(o.name)}</td><td>${esc(o.priv)}</td><td>${esc(o.branch)}</td><td>${esc((o.cars||[]).map(c=>c.num+(c.type?' '+c.type:'')).join(', '))}</td>${cell(pd(o.lic))}${cell(pd(o.health))}${o.pp?'<td>דרכון</td>':cell(pd(o.traffic))}${cell(pd(o.train))}${o.sh?`<td class="${o.sh.a?'d-warn':'d-bad'}" title="לא ביצע משמרת מלאה כראש צוות ביולי–אוגוסט">${o.sh.a} · לא פעיל</td>`:'<td>—</td>'}<td dir="ltr">${fmtPhone(o.phone)||'—'}</td></tr>`).join('');
    app.innerHTML=`${controls(false)}<div class="legend">${list.length} רשומות · <span style="color:var(--bad)">אדום</span> = פג, <span style="color:var(--warn)">כתום</span> = יפוג בקרוב · <span style="background:var(--today-bg);padding:0 4px">רקע מודגש</span> = השתנה בעדכון האחרון (לחיצה ארוכה/ריחוף מראה מה)</div><div class="tbl-wrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
  }
  bind();
}
/* ===== מסלול בדיקות קצב"ת ===== */
const RT={day:ls('rt_day')||'מחר',hrs:ls('rt_hrs')||'17:00–20:00',seq:{},off:{}};
const CHK={...VEH_ITEMS[2],skip:null};
function isDone(v){const d=ls('done:'+v.num);if(!d)return false;const due=pd(v.check);return !due||new Date(d)>=due}
function addrOf(v){const s=ls('addr:'+v.num);if(s)return s;const a=v.addr||{};return [a.st,a.city].filter(Boolean).join(', ')}
function routeAll(){
  return DATA.vehicles.map(v=>{const is=evalItems(v,[CHK],state.win).filter(i=>i.lvl!=='miss');return is.length?{v,i:is[0]}:null}).filter(Boolean);
}
function routeList(){
  const col=new Intl.Collator('he');
  let L=routeAll().filter(x=>!state.branch||x.v.branch===state.branch);
  L.sort((a,b)=>col.compare((a.v.addr||{}).city||'',(b.v.addr||{}).city||'')||col.compare(addrOf(a.v),addrOf(b.v)));
  const key=state.branch||'*',seq=RT.seq[key];
  if(seq)L.sort((a,b)=>{const x=seq.indexOf(a.v.num),y=seq.indexOf(b.v.num);return (x<0?1e9:x)-(y<0?1e9:y)});
  return L;
}
function visitMsg(v){
  return `מה נשמע ${first(v.name)},\n\nאני מתכנן לעבור ${RT.day} בין ${RT.hrs} לבצע בדיקת קצב"ת לכלי מס' *${v.num}* (${v.type}, רישוי ${v.plate}).\nהכתובת שמופיעה אצלי: ${addrOf(v)||'לא ידועה'}.\n\nאם הכלי יהיה במקום אחר (למשל בעבודה) – תשלח לי בבקשה כתובת מדויקת, ואם השעה לא מתאימה תעדכן אותי.\n\nתודה רבה,\nדני בן דוד\nקצב"ת ירושלים`;
}
function mapsDir(addrs){return 'https://www.google.com/maps/dir//'+addrs.map(a=>encodeURIComponent(a)).join('/')}
function renderRoute(){
  const app=document.getElementById('app');
  const all=routeAll(),cnt={};all.forEach(x=>{if(!isDone(x.v))cnt[x.v.branch]=(cnt[x.v.branch]||0)+1});
  const brs=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  const L=routeList(),todo=L.filter(x=>!isDone(x.v)),done=L.filter(x=>isDone(x.v));
  const key=state.branch||'*',off=RT.off[key]||(RT.off[key]={});
  const sel=todo.filter(x=>!off[x.v.num]&&addrOf(x.v));
  const chunks=[];for(let k=0;k<sel.length;k+=9)chunks.push(sel.slice(k,k+9));
  let html=`<div class="controls">
    <select id="rbranch"><option value="">בחר אזור / סניף (${Object.values(cnt).reduce((a,b)=>a+b,0)})</option>${brs.map(b=>`<option value="${esc(b)}"${b===state.branch?' selected':''}>${esc(b)} (${cnt[b]})</option>`).join('')}</select>
    <input id="rday" type="text" value="${esc(RT.day)}" aria-label="יום הביקור" style="flex:1 1 110px">
    <input id="rhrs" type="text" value="${esc(RT.hrs)}" aria-label="שעות" style="flex:1 1 120px;direction:ltr;text-align:right">
  </div>
  <div class="legend">כלים שבדיקת הקצב"ת שלהם עברה${state.win?` או תגיע ב־${state.win} הימים הקרובים`:''}. יום ושעות נכנסים להודעה לנהג. הכתובת היא הכתובת של הנהג מספר הטלפונים, ואפשר לשנות אותה.</div>`;
  if(!state.branch){html+=`<div class="empty">בחר אזור כדי לבנות מסלול.</div>`}
  else{
    html+=`<div class="routebar"><b>${sel.length} תחנות במסלול</b>${chunks.map((c,n)=>`<a class="go-maps" href="${mapsDir(c.map(x=>addrOf(x.v)))}" target="_blank" rel="noopener">🗺️ פתח בגוגל מפות${chunks.length>1?` · חלק ${n+1} (תחנות ${n*9+1}–${n*9+c.length})`:''}</a>`).join('')}${sel.length?'':'<span class="legend">אין תחנות מסומנות עם כתובת.</span>'}</div>`;
    html+=`<div class="list">${todo.map((x,k)=>stopCard(x,k,off)).join('')||'<div class="empty">כל הכלים באזור הזה נבדקו.</div>'}</div>`;
    if(done.length)html+=`<h2><span class="dot" style="background:var(--ok)"></span>נבדקו<span class="cnt">${done.length}</span></h2><div class="list">${done.map(x=>`<div class="card"><div class="who"><div class="name">${esc(x.v.name)}</div><div class="meta"><span class="plate">${esc(x.v.plate)}</span><span>כלי ${esc(x.v.num)}</span><span>נבדק ${fmt(new Date(ls('done:'+x.v.num)))}</span></div></div><div class="acts"><button class="mail sm" data-undo="${esc(x.v.num)}">ביטול</button></div></div>`).join('')}</div>`;
  }
  app.innerHTML=html;
  const q=id=>document.getElementById(id);
  q('rbranch').onchange=e=>{state.branch=e.target.value;renderRoute()};
  q('rday').onchange=e=>{RT.day=e.target.value.trim()||'מחר';ls('rt_day',RT.day);renderRoute()};
  q('rhrs').onchange=e=>{RT.hrs=e.target.value.trim()||'17:00–20:00';ls('rt_hrs',RT.hrs);renderRoute()};
  app.querySelectorAll('[data-addr]').forEach(i=>i.onchange=()=>{ls('addr:'+i.dataset.addr,i.value.trim());renderRoute()});
  app.querySelectorAll('[data-inc]').forEach(c=>c.onchange=()=>{if(c.checked)delete off[c.dataset.inc];else off[c.dataset.inc]=1;renderRoute()});
  app.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{const [num,d]=b.dataset.mv.split('|');const s=todo.map(x=>x.v.num);const k=s.indexOf(num),j=k+(+d);if(j<0||j>=s.length)return;[s[k],s[j]]=[s[j],s[k]];RT.seq[key]=s.concat(done.map(x=>x.v.num));renderRoute()});
  app.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{ls('done:'+b.dataset.done,new Date().toISOString());renderRoute()});
  app.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>{ls('done:'+b.dataset.undo,'');renderRoute()});
  app.querySelectorAll('a[data-sent]').forEach(a=>a.addEventListener('click',()=>{ls(a.dataset.sent,'1');setTimeout(renderRoute,300)}));
}
function stopCard(x,k,off){
  const v=x.v,i=x.i,a=addrOf(v),sk='sent:visit:'+v.num+':'+TODAY_KEY,sent=ls(sk),inc=!off[v.num];
  return `<div class="card stop${inc?'':' off'}">
    <div class="who"><div class="name"><span class="stopn">${k+1}</span>${esc(v.name)}</div>
      <div class="meta"><span class="plate">${esc(v.plate)}</span><span>כלי ${esc(v.num)} · ${esc(v.type)}</span><span>${esc(v.branch)}</span></div>
      <div class="addr"><input data-addr="${esc(v.num)}" value="${esc(a)}" placeholder="כתובת (רחוב, מספר, עיר)" aria-label="כתובת">${a?`<a class="mail sm" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(a)}" target="_blank" rel="noopener">מפה</a>`:''}</div>
    </div>
    <div class="tel">${fmtPhone(v.phone)}</div>

  const sent=L.filter(o=>ls(annKey(o))).length;
  const row=o=>{const t=uTxt(o,annMsgK(o)),k=annKey(o),s=ls(k),ph=uPh(o);
    return `<div class="card"><div class="who"><div class="name">${esc(o.name)}</div>${(o.perm||[]).length?`<div class="perms">${o.perm.map(x=>`<span class="perm${/משתלם/.test(x)?' tr':''}">${esc(x)}</span>`).join('')}</div>`:''}<div class="meta">${o.pv?`<span>פרייבט ${esc(o.pv)}</span>`:''}<span>${esc(o.branch)}</span>${o.coord?`<span>רכז: ${esc(o.coord)}</span>`:''}</div>
      <div class="veh">חסר: ${esc(o.course)}</div>
      <div class="crsl"><b>קורסים והשתלמויות:</b> ${o.crs.length?o.crs.map(x=>`<span class="crs${/2026/.test(x)?' y':''}">${esc(x)}</span>`).join(''):'<span style="color:var(--muted)">אין רשומים</span>'}</div></div>
      <div class="tel">${unitOf(o)?`<b style="color:var(--accent)">↪ דרך הרכז ${esc(unitOf(o).n)}</b><br>`:''}${ph?fmtPhone(ph):'אין טלפון'}</div>
      <div class="issues"><div class="irow"><span class="chip ${s?'ok':'bad'}">${s?'✓ נשלחה תזכורת החודש':'לא ביצע השתלמות '+DATA.ann.y}</span><span class="btns">${ph?`<a class="wa sm${s?' done':''}" href="${waLink(ph,t)}" target="_blank" rel="noopener" data-ak="${esc(k)}">${WA_ICON}${s?'נשלח':unitOf(o)?'לרכז '+first(unitOf(o).n):'וואטסאפ'}</a>`:''}<a class="mail sm" href="mailto:${esc(uMail(o))}?subject=${encodeURIComponent('השתלמות שנתית '+DATA.ann.y)}&body=${encodeURIComponent(t.replace(/\*/g,''))}" data-ak="${esc(k)}">מייל</a><button class="mail sm" type="button" data-copy="${esc(t)}">העתק</button></span></div></div></div>`};
  const G=['אופנוע','אמבולנס','רכב'].map(t=>[t,L.filter(o=>o.need===t).sort((a,b)=>(!!ls(annKey(a)))-(!!ls(annKey(b)))||a.branch.localeCompare(b.branch,'he')||a.name.localeCompare(b.name,'he'))]).filter(g=>g[1].length);
  app.innerHTML=`<div class="summary">
      <div class="stat bad"><b>${n('')}</b><span>לא ביצעו השתלמות ${DATA.ann.y}${state.branch?' בסניף':' במרחב'}</span></div>
      <div class="stat"><b>${n('אופנוע')}</b><span>אופנוע</span></div><div class="stat"><b>${n('אמבולנס')}</b><span>אמבולנס</span></div><div class="stat"><b>${n('רכב')}</b><span>רכב</span></div></div>
    <div class="controls"><input id="q" type="search" placeholder="חיפוש שם, פרייבט, טלפון…" value="${esc(state.q)}"><select id="branch"><option value="">כל הסניפים</option>${brs.map(b=>`<option${b===state.branch?' selected':''}>${esc(b)}</option>`).join('')}</select></div>
    <div class="cats">${[['','הכל'],['אופנוע','אופנוע'],['אמבולנס','אמבולנס'],['רכב','רכב']].map(([k,l])=>`<button data-at="${k}" aria-pressed="${ANNS.t===k}">${l}<span>${n(k)}</span></button>`).join('')}</div>
    <div class="legend">אותם כללים כמו אצל הרכזים: אופנוע > אמבולנס > רכב – השתלמות של הדרגה הגבוהה פוטרת מהנמוכות. פטורים גם: חיים בדרכים / אלטרנטיב / טסט השנה / יום א׳ של השתלמות רכיבה / משתלם אמבולנס-רכב. ${sent?`✓ ${sent} קיבלו תזכורת החודש (מופיעים בסוף).`:''}</div>
    ${G.map(([t,g])=>`<h2>${t}<span class="cnt">${g.length}</span></h2><div class="list">${g.map(row).join('')}</div>`).join('')||'<div class="empty">כולם ביצעו 👍</div>'}`;
  bind();
  document.querySelectorAll('[data-at]').forEach(b=>b.onclick=()=>{ANNS.t=b.dataset.at;render()});
  document.querySelectorAll('a[data-ak]').forEach(a=>a.addEventListener('click',()=>{ls(a.dataset.ak,'1');annBadge();setTimeout(render,300)}));
}
/*ANN-END*/
</script>
</body>
</html>
