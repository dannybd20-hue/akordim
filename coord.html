<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="icon" href="icons/apps-192.png">

<title>בטיחות סניף</title>
<meta property="og:title" content="בטיחות סניף – רכזי תחבורה">

<style>
/* Layout: sticky header with tabs, single column of person/vehicle cards grouped by severity */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --fg:#17202b; --muted:#5d6876; --line:#dde2e9;
  --accent:#1f4f8f; --accent-fg:#ffffff;
  --bad:#c62f2f; --bad-bg:#fbe9e9; --warn:#a96200; --warn-bg:#fdf1dd; --ok:#1d7a46; --ok-bg:#e3f4ea;
  --today:#7a2bb8; --today-bg:#f1e7fb;
  --plate:#f6c800; --plate-fg:#111;
  --wa:#1b9e52;
  --f-display:"Secular One","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#18202a; --fg:#e7ecf2; --muted:#9aa6b4; --line:#2a3542;
  --accent:#6fa3e8; --accent-fg:#0b1220;
  --bad:#ff7b7b; --bad-bg:#3a1c1f; --warn:#f0b257; --warn-bg:#352813; --ok:#6fd49a; --ok-bg:#16301f;
  --today:#c99bf3; --today-bg:#2c1d3c; --plate:#e8bd00; --plate-fg:#111; --wa:#3ccf7c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#18202a; --fg:#e7ecf2; --muted:#9aa6b4; --line:#2a3542;
  --accent:#6fa3e8; --accent-fg:#0b1220;
  --bad:#ff7b7b; --bad-bg:#3a1c1f; --warn:#f0b257; --warn-bg:#352813; --ok:#6fd49a; --ok-bg:#16301f;
  --today:#c99bf3; --today-bg:#2c1d3c; --plate:#e8bd00; --plate-fg:#111; --wa:#3ccf7c; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-fg)}
header .wrap{padding-block:14px 0}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{background:#fff;border-radius:10px;padding:5px 8px;flex:none}
.logo img{display:block;width:84px;height:auto}
.hbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hb{border:0;background:#ffffff26;color:inherit;border-radius:10px;padding:7px 11px;font:700 .9rem var(--f-body);cursor:pointer;white-space:nowrap}
.lockc{max-width:380px;margin:30px auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px;text-align:center}
.lockc h2{margin:0;font-family:var(--f-display);font-weight:400}
.lockc input[type=password],.lockc input[type=text]{font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);text-align:center;direction:ltr;width:100%}
.lockc .go{border:0;border-radius:12px;padding:13px;font:700 1.05rem var(--f-body);background:var(--accent);color:var(--accent-fg);cursor:pointer}
.lockc .err{color:var(--bad);font-weight:700;min-height:1.2em}
h1{font-family:var(--f-display);font-weight:400;font-size:1.6rem;margin:0;letter-spacing:.01em}
.upd{font-size:.85rem;opacity:.85}
.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
.tab{appearance:none;border:0;background:transparent;color:inherit;font:600 1rem var(--f-body);padding:10px 14px;border-radius:10px 10px 0 0;opacity:.8;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--bg);color:var(--fg);opacity:1}
.tab .n{display:inline-block;min-width:1.6em;padding:0 .4em;margin-inline-start:6px;border-radius:99px;background:var(--bad);color:#fff;font-size:.8rem;text-align:center}
main .wrap{padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--muted)}
.stat.today b{color:var(--today)} .stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.controls input,.controls select{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);min-width:0}
.controls input{flex:1 1 200px}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cats button{appearance:none;flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:600 .95rem var(--f-body);padding:8px 12px;border-radius:99px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.cats button span{font-size:.78rem;font-weight:700;background:var(--bg);color:var(--muted);border-radius:99px;padding:0 7px;font-variant-numeric:tabular-nums}
.cats button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.cats button[aria-pressed="true"] span{background:#ffffff33;color:inherit}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{appearance:none;border:0;background:transparent;color:var(--fg);font:600 .95rem var(--f-body);padding:9px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h2{font-family:var(--f-display);font-weight:400;font-size:1.15rem;margin:8px 0 0;display:flex;align-items:center;gap:8px}
h2 .cnt{font-family:var(--f-body);font-weight:700;font-size:.85rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start}
.card .who{min-width:0}
.name{font-weight:700;font-size:1.05rem}
.meta{color:var(--muted);font-size:.88rem;display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center}
.plate{display:inline-block;background:var(--plate);color:var(--plate-fg);border:1.5px solid #111;border-radius:4px;padding:0 6px;font:700 .85rem/1.5 ui-monospace,Menlo,Consolas,monospace;direction:ltr;letter-spacing:.04em}
.veh{margin-top:6px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.veh.none{color:var(--muted);font-weight:600;font-size:.88rem}
.issues{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.irow.dovi{background:var(--bg);border-radius:10px;padding:6px 8px}
.irow.dovi .dl{font-size:.86rem;font-weight:700;color:var(--muted)}
.routebar{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.go-maps{display:block;text-align:center;text-decoration:none;background:var(--accent);color:var(--accent-fg);font-weight:700;padding:11px;border-radius:10px}
.stopn{display:inline-grid;place-items:center;min-width:1.7em;height:1.7em;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:.85rem;margin-inline-end:8px}
.card.off{opacity:.55}
.addr{display:flex;gap:6px;margin-top:8px;align-items:center}
.addr input{flex:1;min-width:0;font:inherit;font-size:.92rem;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.inc{display:inline-flex;align-items:center;gap:4px;font-size:.88rem;font-weight:600;color:var(--muted)}
.irow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.sm{padding:6px 10px!important;font-size:.88rem;border-radius:8px}
.mail{display:inline-flex;align-items:center;text-decoration:none;background:transparent;color:var(--accent);border:1.5px solid var(--accent);font:700 .88rem var(--f-body);cursor:pointer}
.em{direction:ltr;unicode-bidi:isolate;word-break:break-all}
.chip{font-size:.86rem;font-weight:600;padding:3px 9px;border-radius:99px;font-variant-numeric:tabular-nums}
.chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.today{background:var(--today-bg);color:var(--today)} .chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.miss{background:var(--bg);color:var(--muted);border:1px dashed var(--line)}
.acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.wa{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;background:var(--wa);color:#fff;font-weight:700;padding:8px 12px;border-radius:10px;white-space:nowrap}
.wa svg{width:18px;height:18px}
.wa.done{background:transparent;color:var(--wa);border:1.5px solid var(--wa)}
.nophone{font-size:.82rem;color:var(--muted);text-align:center}
.tel{font-size:.85rem;color:var(--muted);direction:ltr;text-align:center;user-select:all;font-variant-numeric:tabular-nums}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{position:sticky;top:0;background:var(--surface);color:var(--muted);font-weight:700;font-size:.8rem}
td.d-bad{color:var(--bad);font-weight:700} td.d-warn{color:var(--warn);font-weight:700} td.d-today{color:var(--today);font-weight:700}
.more{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 .95rem var(--f-body);padding:10px;border-radius:10px;cursor:pointer}
.legend{font-size:.85rem;color:var(--muted)}
@media (max-width:520px){.card{grid-template-columns:1fr}.acts{flex-direction:row;flex-wrap:wrap}.wa{flex:1}}
</style>
<style>
.pcard{cursor:pointer}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem}
.kv b{color:var(--muted);font-weight:600}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.sec h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.05rem}
.rec{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.rec.ok{background:var(--ok-bg);color:var(--ok)}.rec.warn{background:var(--warn-bg);color:var(--warn)}.rec.bad{background:var(--bad-bg);color:var(--bad)}
.rec b{font-size:1.15rem}
.rec ul{margin:0;padding-inline-start:18px;color:var(--fg)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.92rem}
.form input,.form select,.form textarea{font:inherit;font-weight:400;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);min-width:0}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.big{font:700 1rem var(--f-body);padding:11px 14px;border-radius:10px;border:0;cursor:pointer}
.big.yes{background:var(--ok);color:#fff}.big.no{background:var(--bad);color:#fff}
.hist td,.hist th{white-space:normal}
.ov{position:fixed;inset:0;background:#0007;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet .x{align-self:flex-start;border:0;background:var(--surface);border-radius:50%;width:36px;height:36px;font-size:1.1rem;cursor:pointer;color:var(--fg)}
.ro{font-size:.82rem;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top"><div class="brand"><span class="logo"><img src="brand/uh-logo.png" alt="איחוד הצלה" width="440" height="273"></span><h1 id="ttl">בטיחות סניף</h1></div><span class="hbs"><span class="upd" id="upd"></span><button class="hb" id="lockB" hidden onclick="relock()" title="יציאה">🔒 יציאה</button></span></div>
    <div class="tabs" role="tablist" id="tabs" hidden>
      <button class="tab" role="tab" aria-selected="true" data-v="sum">סיכום</button>
      <button class="tab" role="tab" aria-selected="false" data-v="ppl">נהגים</button>
      <button class="tab" role="tab" aria-selected="false" data-v="veh">רכבים</button>
      <button class="tab" role="tab" aria-selected="false" data-v="exit">יציאה מגזרה</button>
    </div>
  </div>
</header>
<main><div class="wrap" id="app"><div class="empty">טוען…</div></div></main>

<script>
const WA_ICON='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5 0a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.7-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-1 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3Z"/></svg>';
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){return null}}
const first=n=>(n||'').split(' ')[0];
function waLink(p,t){p=(p||'').replace(/\D/g,'');if(p.startsWith('0'))p='972'+p.slice(1);return `https://wa.me/${p}?text=${encodeURIComponent(t)}`}
const fmtPhone=p=>{p=(p||'').replace(/\D/g,'');return p.length===10?p.slice(0,3)+'-'+p.slice(3):p};
const T0=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
function pd(s){const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s||'');return m?new Date(+m[3],+m[2]-1,+m[1]):null}
const days=d=>Math.round((d-T0)/864e5);
const fmt=d=>d?d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric'}):'—';
const num=x=>{const n=parseFloat(String(x||'').replace(/[^\d.]/g,''));return isNaN(n)||n>10?null:n};

/* ===== הצפנה ===== */
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function dec(path,pw){
  const r=await fetch(path,{cache:'no-cache'});if(!r.ok)throw new Error('pw');
  const buf=new Uint8Array(await r.arrayBuffer());const salt=buf.slice(3,19),iv=buf.slice(19,31),ct=buf.slice(31);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  let gz;try{gz=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct)}catch(e){throw new Error('pw')}
  return JSON.parse(await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
}
const fileOf=async pw=>'coord/'+(await sha('dbd-coord:'+pw)).slice(0,24)+'.bin';

/* ===== מצב תקינות של נהג ===== */
function docStatus(p){
  const out=[];
  const chk=(k,l)=>{const d=pd(p[k]);if(!d){if(k!=='traffic'||!p.pp)out.push({l,lvl:'miss',t:'אין תאריך'});return}const n=days(d);out.push({l,lvl:n<0?'bad':n<=30?'warn':'ok',t:n<0?`פג ב־${fmt(d)}`:`בתוקף עד ${fmt(d)}`,n})};
  chk('lic','רישיון נהיגה');chk('health','תיק נהג (הצהרת בריאות)');if(!p.pp)chk('traffic','מידע תעבורתי');
  return out;
}
function safetyNow(p){if(!p.s)return null;let m=p.s.length-1;while(m>=0&&p.s[m]==null)m--;if(m<0)return null;let k=0;for(let j=m;j>=0&&p.s[j]!=null&&p.s[j]<25;j--)k++;let prev=null;for(let j=m-1;j>=0;j--)if(p.s[j]!=null){prev=p.s[j];break}return {x:p.s[m],m,streak:k,prev}}
const lastRide=p=>(p.ride||[])[0]||null, lastAlt=p=>(p.alt||[])[0]||null;
const isMoto=p=>/אופנוע/.test(p.perm||'')||(p.cars||[]).some(c=>/אופנוע/.test(c.type||''));
function vehOf(p){return DATA.veh.filter(v=>(p.cars||[]).some(c=>c.num===v.num)||(p.ph&&v.phone===p.ph))}
function vehIssues(v){const r=[];const t=pd(v.test);if(t&&days(t)<0)r.push({lvl:'bad',t:`טסט פג ב־${fmt(t)}`});else if(t&&days(t)<=14)r.push({lvl:'warn',t:`טסט פג בעוד ${days(t)} ימים`});
  const s=pd(v.service);if(s){const due=new Date(s);due.setFullYear(due.getFullYear()+1);if(days(due)<0)r.push({lvl:'warn',t:`טיפול אחרון ${fmt(s)} – עברה שנה`})}
  const c=pd(v.check);if(c&&days(c)<0)r.push({lvl:'warn',t:`בדיקת קצב"ת באיחור (${fmt(c)})`});
  const i=pd(v.ins);if(i&&days(i)<0)r.push({lvl:'bad',t:`ביטוח פג ב־${fmt(i)}`});return r}

/* ===== המלצה ליציאה מגזרה ===== */
function evaluate(p,f){
  const bad=[],warn=[],good=[];
  docStatus(p).forEach(d=>{if(d.lvl==='bad')bad.push(`${d.l}: ${d.t}`);else if(d.lvl==='miss')warn.push(`${d.l}: אין תאריך במערכת`);else if(f.to&&d.n!=null&&d.n<days(f.to))warn.push(`${d.l} פג לפני סוף היציאה (${d.t.replace('בתוקף עד ','')})`)});
  const sn=safetyNow(p);
  if(sn){const M=DATA.months[sn.m];if(sn.x<25&&sn.streak>=2)bad.push(`ציון סייפטי ${sn.x} ב${M} – ${sn.streak} חודשים ברצף מתחת ל־25`);else if(sn.x<25)warn.push(`ציון סייפטי ${sn.x} ב${M} – מתחת לרף`);else if(sn.prev!=null&&sn.prev-sn.x>=20)warn.push(`ציון סייפטי ירד מ־${sn.prev} ל־${sn.x}`);else if(sn.x>=50)good.push(`ציון סייפטי טוב: ${sn.x}`);else good.push(`ציון סייפטי ${sn.x}`)}
  else warn.push('אין ציון סייפטי במערכת');
  const r=lastRide(p),rs=r&&num(r.sc);

  const a=lastAlt(p),as=a&&num(a.g);
  if(a){if(as!=null&&as<7)bad.push(`ציון מגרש (אלטרנתיבי) נמוך: ${as} (${a.d})`);else if(as!=null&&as<8)warn.push(`ציון מגרש ${as} (${a.d})`);else if(as!=null)good.push(`ציון מגרש ${as} (${a.d})`)}
  if((p.acc||[]).length>=2)warn.push(`${p.acc.length} תאונות בעבר`);
  const v=f.veh?DATA.veh.find(x=>x.num===f.veh):null;

  return {lvl,bad,warn,good,title:lvl==='bad'?'לא מומלץ לאשר':lvl==='warn'?'אפשר לאשר – לשים לב':'מומלץ לאשר'};
}

  const q=$('q');if(q)q.oninput=e=>{st.q=e.target.value;const pos=e.target.selectionStart;render();const n=$('q');n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}};
  const cp=$('cpm');if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(coordMsg(DATA.br));cp.textContent='הועתק'}catch(e){cp.textContent='לא הועתק'}};
  const a=$('adm');if(a)a.onchange=async e=>{const b=e.target.value;$('app').innerHTML='<div class="empty">פותח…</div>';DATA=await dec(await fileOf(ADMIN[b].pw),ADMIN[b].pw);ls('coord_adm_br',b);st.sel=null;st.f={};show()};
}
function show(){$('ttl').textContent='בטיחות סניף · '+DATA.br;$('upd').textContent='עודכן: '+DATA.upd;$('tabs').hidden=false;$('lockB').hidden=false;render()}

/* ===== כניסה ===== */
function lockView(err){
  $('tabs').hidden=true;$('lockB').hidden=true;
  $('app').innerHTML=`<div class="lockc"><h2>🔐 בטיחות סניף</h2><p style="margin:0;color:var(--muted)">כניסה לרכזי תחבורה. הקלד את הסיסמה של הסניף שלך</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="סיסמה" dir="ltr" onkeydown="if(event.key==='Enter')unlock()">
  <label style="color:var(--muted);font-weight:600"><input type="checkbox" id="rem" checked> לזכור במכשיר הזה</label>
  <button class="go" id="ub" onclick="unlock()">כניסה</button><div class="err">${esc(err||'')}</div></div>`;
  setTimeout(()=>{const i=$('pw');if(i)i.focus()},50);
}
async function unlock(saved){
  const pw=saved||($('pw')&&$('pw').value.trim());if(!pw)return;
  if(!saved){$('ub').disabled=true;$('ub').textContent='פותח…'}else $('app').innerHTML='<div class="empty">פותח…</div>';
  try{DATA=await dec(await fileOf(pw),pw);if(!saved)ls('coord_pw',$('rem').checked?pw:null);show()}
  catch(e){if(saved)ls('coord_pw',null);lockView(e.message==='pw'?'סיסמה שגויה':!window.DecompressionStream?'הדפדפן ישן מדי, צריך לעדכן':'אין חיבור לאינטרנט, נסה שוב')}
}
function relock(){ls('coord_pw',null);DATA=null;ADMIN=null;lockView()}
(async()=>{
  /* מנהל (קצב"ת): אם יש במכשיר את סיסמת ניהול קצב"ת – פותח את כל הסניפים */
  const k=ls('kbt_pw');
  if(k){try{ADMIN=await dec('coord/index.bin',k);const b=ls('coord_adm_br');const br=ADMIN[b]?b:Object.keys(ADMIN)[0];DATA=await dec(await fileOf(ADMIN[br].pw),ADMIN[br].pw);show();return}catch(e){ADMIN=null}}
  const p=ls('coord_pw');p?unlock(p):lockView();
})();
</script>
</body>
</html>
