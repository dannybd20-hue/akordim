<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="icons/apps-192.png">
<meta name="theme-color" content="#0f2a4a">
<title>בטיחות סניף</title>
<meta property="og:title" content="בטיחות סניף – רכזי תחבורה">
<meta property="og:description" content="איחוד הצלה · קצב&quot;ת ירושלים">
<meta property="og:image" content="https://dannybd20-hue.github.io/akordim/brand/uh-og.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: navy app bar + underline tabs; content in panels with fixed metric columns so rows scan like a table */
:root{
  --bg:#f3f5f9;--surface:#fff;--fg:#14202e;--muted:#5f6b7a;--line:#e1e6ee;--soft:#f7f9fc;
  --bar:#0f2a4a;--bar2:#163a63;--accent:#1f5fae;--accent-fg:#fff;
  --ok:#147a43;--ok-bg:#e4f4ea;--warn:#9a5b00;--warn-bg:#fdf0d9;--bad:#c22b2b;--bad-bg:#fbe7e7;--mid:#1f5fae;--mid-bg:#e6effa;--na:#6b7684;--na-bg:#eef1f5;
  --wa:#1b9e52;--plate:#f6c800;
  --f:"Heebo","Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:14px;--sh:0 1px 2px #0f2a4a0f,0 4px 16px #0f2a4a0d;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d141d;--surface:#152030;--fg:#e8eef5;--muted:#9aa8b8;--line:#243346;--soft:#111b28;--bar:#0a1e36;--bar2:#11294a;--accent:#6aa5ec;--accent-fg:#0b1626;--ok:#6fd49a;--ok-bg:#15301f;--warn:#f0b257;--warn-bg:#352813;--bad:#ff8080;--bad-bg:#3a1c1f;--mid:#8db9f0;--mid-bg:#182b44;--na:#93a0af;--na-bg:#1c2836;--wa:#3ccf7c;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d141d;--surface:#152030;--fg:#e8eef5;--muted:#9aa8b8;--line:#243346;--soft:#111b28;--bar:#0a1e36;--bar2:#11294a;--accent:#6aa5ec;--accent-fg:#0b1626;--ok:#6fd49a;--ok-bg:#15301f;--warn:#f0b257;--warn-bg:#352813;--bad:#ff8080;--bad-bg:#3a1c1f;--mid:#8db9f0;--mid-bg:#182b44;--na:#93a0af;--na-bg:#1c2836;--wa:#3ccf7c;--sh:none;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f);direction:rtl}
svg{width:18px;height:18px;fill:currentColor;flex:none}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(180deg,var(--bar),var(--bar2));color:#fff;box-shadow:0 2px 12px #0003}
.appbar .wrap{padding-block:12px 0;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:12px}
.brandc{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.contact{color:#fff;opacity:.85;font-size:.68rem;font-weight:600;line-height:1.25;text-align:center;text-decoration:none;white-space:nowrap}
.contact:hover{opacity:1;text-decoration:underline}
.logo{background:#fff;border-radius:10px;padding:4px 7px;flex:none}.logo img{display:block;width:62px;height:auto}
.ttl{flex:1;min-width:0}.ttl h1{margin:0;font-size:1.15rem;font-weight:800;letter-spacing:.01em}.ttl p{margin:0;font-size:.85rem;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{display:inline-flex;align-items:center;gap:6px;border:1px solid #ffffff33;background:#ffffff14;color:#fff;border-radius:10px;padding:7px 11px;font:600 .85rem var(--f);cursor:pointer;text-decoration:none;white-space:nowrap}
.hb:hover{background:#ffffff26}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{appearance:none;border:0;background:none;color:#ffffffb3;font:600 .95rem var(--f);padding:10px 14px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:#fff}
main .wrap{padding-block:18px 40px;display:flex;flex-direction:column;gap:16px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* חיפוש כללי */
.gsearch{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:0 12px;color:#5f6b7a;box-shadow:0 2px 10px #0003}
.gsearch input{flex:1;border:0;outline:none;background:none;font:inherit;font-size:1rem;color:#14202e;padding:11px 0;min-width:0}
.gres{position:sticky;z-index:4;top:calc(env(safe-area-inset-top,0px) + var(--hh,150px));padding-top:8px}
.gres .panel{max-height:70vh;overflow:auto;box-shadow:0 10px 30px #0f2a4a33}
/* KPIs */
button.kpi{appearance:none;font:inherit;color:inherit;text-align:start;cursor:pointer;width:100%;position:relative}
button.kpi:hover{border-color:var(--accent)}
.kgo{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);opacity:.6}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--sh)}
.kpi .ki{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--mid-bg);color:var(--mid);flex:none}
.kpi.ok .ki{background:var(--ok-bg);color:var(--ok)}.kpi.warn .ki{background:var(--warn-bg);color:var(--warn)}.kpi.bad .ki{background:var(--bad-bg);color:var(--bad)}
.kpi small{display:block;color:var(--muted);font-size:.8rem;font-weight:600}
.kpi b{display:block;font-size:1.75rem;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi.bad b{color:var(--bad)}.kpi.warn b{color:var(--warn)}
.kpi em{display:block;font-style:normal;color:var(--muted);font-size:.78rem}
/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.panel>header{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel h2{margin:0;font-size:1.02rem;font-weight:800}
.count{background:var(--na-bg);color:var(--na);font-weight:700;font-size:.78rem;border-radius:99px;padding:1px 9px;font-variant-numeric:tabular-nums}
.hint{margin:0;padding:8px 16px;color:var(--muted);font-size:.84rem}
.empty{padding:22px;text-align:center;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:.8rem;margin:0}
.muted{color:var(--muted);margin:0;font-size:.9rem}
/* rows – בסגנון ספר הטלפונים */
.prow .minis{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.mp{font-size:.74rem;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--na-bg);color:var(--na);white-space:nowrap}
.mp b{font-weight:800}.mp.ok{background:var(--ok-bg);color:var(--ok)}.mp.mid{background:var(--mid-bg);color:var(--mid)}.mp.warn{background:var(--warn-bg);color:var(--warn)}.mp.bad{background:var(--bad-bg);color:var(--bad)}
.cb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.cb svg{width:20px;height:20px}.cb.call{background:#2563eb}.cb.wa{background:#22c55e}
.sub{padding:0 16px 10px 70px;display:flex;flex-wrap:wrap;gap:4px}
/* rows */
.plist,.vlist{display:flex;flex-direction:column}
.prow,.vrow{appearance:none;width:100%;text-align:start;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:11px 16px}
.plist>.prow:first-child,.vlist>.vrow:first-child{border-top:0}
.prow{cursor:pointer}.prow:hover{background:var(--soft)}
.prow.attn,.vrow.attn{box-shadow:inset -3px 0 0 var(--bad)}
.vrow{grid-template-columns:auto minmax(0,1fr) auto}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:800;font-size:1rem}
.av.lg{width:54px;height:54px;font-size:1.15rem;background:#ffffff1f;color:#fff}
.pid{min-width:0;display:flex;flex-direction:column}
.pid b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pid small{color:var(--muted);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mets{display:grid;grid-template-columns:repeat(4,78px);gap:6px}
.m{border-radius:9px;padding:4px 6px;text-align:center;background:var(--na-bg);color:var(--na)}
.m small{display:block;font-size:.68rem;font-weight:600;opacity:.9}
.m b{display:block;font-size:.92rem;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m.ok{background:var(--ok-bg);color:var(--ok)}.m.warn{background:var(--warn-bg);color:var(--warn)}.m.bad{background:var(--bad-bg);color:var(--bad)}.m.mid{background:var(--mid-bg);color:var(--mid)}
.go{color:var(--muted)}
@media (max-width:640px){
  .vrow{grid-template-columns:auto minmax(0,1fr)}.vrow .mets{grid-column:1/-1}
  .mets{grid-template-columns:repeat(4,minmax(0,1fr))}
}
.plate{display:inline-block;background:var(--plate);color:#111;border:1.5px solid #111;border-radius:4px;padding:0 6px;font:700 .82rem/1.5 ui-monospace,Menlo,Consolas,monospace;direction:ltr;white-space:nowrap}
.pill{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--na-bg);color:var(--na)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
/* vehicles */
.vcard{border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.vlist>.vcard:first-child{border-top:0}
.vcard.bad{box-shadow:inset -4px 0 0 var(--bad)}.vcard.warn{box-shadow:inset -4px 0 0 var(--warn)}
.vh2{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center}
.vstat{display:flex;flex-wrap:wrap;gap:6px}
.dgrid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (max-width:640px){.dgrid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dc{border-radius:10px;padding:6px 8px;background:var(--na-bg);color:var(--na)}
.dc small{display:block;font-size:.72rem;font-weight:700;opacity:.85}.dc b{display:block;font-size:.95rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--fg)}.dc em{display:block;font-style:normal;font-size:.76rem;font-weight:700}
.dc.ok{background:var(--ok-bg);color:var(--ok)}.dc.warn{background:var(--warn-bg);color:var(--warn)}.dc.bad{background:var(--bad-bg);color:var(--bad)}
/* phonebook */
.lt{position:sticky;top:0;background:var(--soft);color:var(--accent);font-weight:800;padding:4px 16px;border-top:1px solid var(--line);font-size:.9rem}
.prow.pb{grid-template-columns:auto minmax(0,1fr) auto auto}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin:3px 0 1px}
.bdg{font-size:.78rem;font-weight:800;padding:3px 9px;border-radius:99px;background:#fde7d6;color:#9a3412;font-variant-numeric:tabular-nums}
.bdg.car{background:#dbeafe;color:#1e3a8a;white-space:nowrap}
.prow.pb{gap:8px}
@media (max-width:420px){.prow.pb .cb{width:38px;height:38px}.bdg{padding:3px 7px;font-size:.74rem}}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;padding:0 16px}
.qa a,.qa button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font:700 .82rem var(--f);text-decoration:none;cursor:pointer}
.qa i{font-style:normal;font-size:1.3rem}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin:0 16px;overflow:hidden}
.box h3{margin:0;padding:12px 16px 4px;color:var(--muted);font-size:.9rem;font-weight:800}
.it{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.box h3+.it{border-top:0}
.it .k{font-size:1.3rem;width:30px;text-align:center}.it .v{display:flex;flex-direction:column;min-width:0}.it .v small{font-weight:800;color:var(--fg);font-size:.86rem}.it .v span{font-size:1rem;overflow-wrap:anywhere}
a.it .v span{color:#c2410c}
.tag{display:inline-block;background:#fde7d6;color:#9a3412;border-radius:99px;padding:1px 10px;font-weight:700;font-size:.82rem;margin:2px 0 2px 4px}
/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--muted)}
.search input{flex:1;border:0;background:none;font:inherit;color:var(--fg);padding:10px 0;min-width:0;outline:none}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;overflow-x:auto}
.seg button{appearance:none;border:0;background:none;color:var(--muted);font:600 .86rem var(--f);padding:7px 11px;border-radius:9px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:10px;padding:10px 14px;font:700 .92rem var(--f);cursor:pointer;text-decoration:none;color:#fff;background:var(--accent)}
.btn.wa{background:var(--wa)}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
/* admin */
.admin{background:var(--surface);border:1px dashed var(--accent);border-radius:var(--r);padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.admin select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.admin .info{flex:1 1 220px;font-size:.85rem;color:var(--muted)}
.admin .info b{color:var(--fg);direction:ltr;unicode-bidi:isolate}
.online{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.online b{display:flex;align-items:center;gap:8px;width:100%;font-size:.92rem}
.online .dot{width:10px;height:10px;border-radius:50%;background:var(--na)}.online .dot.on{background:#22c55e;box-shadow:0 0 0 4px #22c55e33}
.online .who{background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:5px 10px;font-weight:700;font-size:.85rem;display:flex;flex-direction:column}
.online .who small{color:var(--muted);font-weight:500;font-size:.74rem}
/* drawer */
.ov{position:fixed;inset:0;background:#0b1626a6;z-index:30;display:flex;justify-content:flex-start}
.drawer>*{flex-shrink:0}
.drawer{background:var(--bg);width:min(760px,100%);height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));box-shadow:-8px 0 30px #0004}
.dh{background:linear-gradient(180deg,var(--bar),var(--bar2));color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:1}
.dh h2{margin:0;font-size:1.2rem;font-weight:800}.dh p{margin:0;opacity:.8;font-size:.86rem}
.dh .x{order:3;margin-inline-start:auto;border:0;background:#ffffff1f;color:#fff;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
.mets.big{grid-template-columns:repeat(4,minmax(0,1fr));padding:0 16px}.mets.big .m{padding:8px}.mets.big .m b{font-size:1.2rem}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
@media (max-width:640px){.dgrid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.wide{grid-column:1/-1}
.card h3{margin:0;font-size:.95rem;font-weight:800}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:.9rem}dt{color:var(--muted);font-weight:600}dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ltr{direction:ltr;text-align:right}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:9px;background:var(--na-bg);font-size:.88rem}
.checks li b{font-weight:700}.checks li.ok{background:var(--ok-bg)}.checks li.ok b{color:var(--ok)}.checks li.warn{background:var(--warn-bg)}.checks li.warn b{color:var(--warn)}.checks li.bad{background:var(--bad-bg)}.checks li.bad b{color:var(--bad)}
.vmini{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.88rem}
.strip{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
@media (max-width:640px){.strip{grid-template-columns:repeat(6,minmax(0,1fr))}}
.sc{border-radius:8px;text-align:center;padding:4px 0;background:var(--na-bg);color:var(--na)}
.sc small{display:block;font-size:.66rem}.sc b{font-size:.95rem;font-weight:800;font-variant-numeric:tabular-nums}
.sc.ok{background:var(--ok-bg);color:var(--ok)}.sc.mid{background:var(--mid-bg);color:var(--mid)}.sc.warn{background:var(--warn-bg);color:var(--warn)}.sc.bad{background:var(--bad-bg);color:var(--bad)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tl li{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start}
.tl small{color:var(--muted);font-size:.78rem}.tl p{margin:2px 0 0;font-size:.88rem}
.tb{border-radius:9px;text-align:center;font-weight:800;padding:6px 0;background:var(--na-bg);color:var(--na);font-size:.9rem}
.tb.ok{background:var(--ok-bg);color:var(--ok)}.tb.warn{background:var(--warn-bg);color:var(--warn)}.tb.bad{background:var(--bad-bg);color:var(--bad)}
/* exit */
.exit{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:820px){.exit{grid-template-columns:1fr}}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.form label{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:.86rem;color:var(--muted)}
.form input,.form select,.form textarea{font:inherit;font-weight:400;color:var(--fg);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);min-width:0}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.verdict{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:12px;border-top:5px solid var(--na)}
.verdict.ok{border-top-color:var(--ok)}.verdict.warn{border-top-color:var(--warn)}.verdict.bad{border-top-color:var(--bad)}
.vh{display:flex;gap:12px;align-items:center}
.vi{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none}
.vi svg{width:26px;height:26px}
.verdict.ok .vi{background:var(--ok-bg);color:var(--ok)}.verdict.warn .vi{background:var(--warn-bg);color:var(--warn)}.verdict.bad .vi{background:var(--bad-bg);color:var(--bad)}
.vh small{color:var(--muted);font-weight:600;font-size:.78rem}.vh h2{margin:0;font-size:1.25rem;font-weight:800}.vh p{margin:0;color:var(--muted);font-size:.85rem}
.verdict.ok h2{color:var(--ok)}.verdict.warn h2{color:var(--warn)}.verdict.bad h2{color:var(--bad)}
.vlist2{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.vlist2 li{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;padding:7px 10px;border-radius:9px}

async function dec(path,pw){
  const r=await fetch(path,{cache:'no-cache'});if(!r.ok)throw new Error('pw');
  const buf=new Uint8Array(await r.arrayBuffer());const salt=buf.slice(3,19),iv=buf.slice(19,31),ct=buf.slice(31);

  return JSON.parse(await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text());

function evaluate(p,f){

}

  if(k==='all'){title='כל הנהגים בסניף';body=P.map(pRow).join('')}
  else if(k==='veh'){title='כלים בסניף';const V=[...DATA.veh].sort((a,b)=>vehIssues(b).length-vehIssues(a).length);body=`<div class="vlist">${V.map(vRow).join('')}</div>`}
  else if(k==='avg'){title='ציוני סייפטי · '+M;const L=P.filter(p=>safetyNow(p)).sort((a,b)=>safetyNow(a).x-safetyNow(b).x);body=L.map(pRow).join('')+(P.length>L.length?`<p class="hint">${P.length-L.length} נהגים בלי ציון סייפטי</p>`:'')}
  else if(k==='low'){title='מתחת ל־25 בסייפטי';body=P.filter(p=>{const s=safetyNow(p);return s&&s.x<25}).sort((a,b)=>safetyNow(a).x-safetyNow(b).x).map(pRow).join('')}
  else if(k==='docs'){title='נהגים עם מסמך שפג';body=P.filter(p=>docStatus(p).some(d=>d.lvl==='bad')).map(p=>pRow(p)+`<div class="sub">${docStatus(p).filter(d=>d.lvl==='bad').map(d=>pill('bad',d.l+': '+d.t)).join(' ')}</div>`).join('')}
  const ov=document.createElement('div');ov.className='ov';ov.innerHTML=`<aside class="drawer"><header class="dh"><button class="x" aria-label="סגירה">${IC.x}</button><div><h2>${esc(title)}</h2><p>${esc(DATA.br)}</p></div></header><section class="panel" style="margin:0 16px"><div class="plist">${body||'<div class="empty">אין</div>'}</div></section></aside>`;
  ov.onclick=e=>{if(e.target===ov||e.target.closest('.x'))return ov.remove();const r=e.target.closest('.prow');if(r&&!e.target.closest('a'))personSheet(r.dataset.p)};
  document.body.append(ov);
}

/* ===== ספר טלפונים (בסגנון ספר הטלפונים הראשי) ===== */
function age(bd){const d=pd(bd);if(!d)return '';let a=T0.getFullYear()-d.getFullYear();if(T0<new Date(T0.getFullYear(),d.getMonth(),d.getDate()))a--;return a>0&&a<120?a:''}
function hebBd(bd){const d=pd(bd);if(!d)return '';try{return new Intl.DateTimeFormat('he-IL-u-ca-hebrew',{day:'numeric',month:'long'}).format(d)}catch(e){return ''}}
function pbRow(p){const tel=(p.ph||'').replace(/\D/g,''),cars=p.cars||[];
  const vb=cars.map(c=>`<span class="bdg car">${/אופנוע|אופניים/.test(c.type||'')?'🏍️':/רכב|ג'יפ/.test(c.type||'')?'🚗':'🚑'} ${esc(c.num)}</span>`).join('');
  return `<div class="prow pb" role="button" tabindex="0" data-c="${esc(p.pv||p.n)}"><span class="av" style="background:${colorOf(p.n)}">${esc(ini(p.n))}</span>
    <span class="pid"><b>${esc(p.n)}</b><span class="badges">${p.pv?`<span class="bdg">${esc(p.pv)}</span>`:''}${vb}</span><small>${esc([(p.perm||'').split(/;\s*/)[0],p.city].filter(Boolean).join(' · ')||DATA.br)}</small></span>
    ${tel?`<a class="cb call" href="tel:${esc(tel)}" aria-label="חיוג">${IC.phone}</a><a class="cb wa" href="${waLink(tel,'')}" target="_blank" rel="noopener" aria-label="וואטסאפ">${WA_ICON}</a>`:''}</div>`}
function phonebookView(){
  const q=st.q.trim(),L=DATA.people.filter(p=>!q||[p.n,p.pv,p.ph,p.city,(p.cars||[]).map(c=>c.num).join(' ')].some(x=>(x||'').includes(q)));
  const col=new Intl.Collator('he');L.sort((a,b)=>col.compare(a.n,b.n));
  let h=`<div class="toolbar"><div class="search">${IC.users}<input id="q" type="search" placeholder="חיפוש: שם, טלפון, פרייבט, מס׳ רכב, יישוב…" value="${esc(st.q)}"></div></div><section class="panel">`,last='';
  L.forEach(p=>{const l=(p.n||'#').charAt(0);if(l!==last){h+=`<div class="lt">${esc(l)}</div>`;last=l}h+=pbRow(p)});
  return h+(L.length?'':'<div class="empty">לא נמצאו אנשי קשר</div>')+`</section><p class="foot">${L.length} אנשי קשר עם הרשאת נהיגה · ${esc(DATA.br)}</p>`;
}
function contactSheet(key){
  const p=DATA.people.find(x=>(x.pv||x.n)===key);if(!p)return;const o=DATA.org||{},tel=(p.ph||'').replace(/\D/g,''),addr=[p.st,p.city].filter(Boolean).join(', '),a=age(p.bd),hb=hebBd(p.bd);
  const it=(ic,l,val,href)=>val?`<${href?`a href="${esc(href)}"${href.startsWith('http')?' target="_blank" rel="noopener"':''}`:'div'} class="it"><span class="k">${ic}</span><span class="v"><small>${l}</small><span>${val}</span></span></${href?'a':'div'}>`:'';
  const ov=document.createElement('div');ov.className='ov';ov.innerHTML=`<aside class="drawer pbs"><header class="dh"><button class="x" aria-label="סגירה">${IC.x}</button><span class="av lg" style="background:${colorOf(p.n)}">${esc(ini(p.n))}</span><div><h2>${esc(p.n)}</h2><p>${esc([p.pv&&'פרייבט '+p.pv,DATA.br].filter(Boolean).join(' · '))}</p></div></header>
    <div class="qa">${tel?`<a href="tel:${esc(tel)}"><i>📞</i>חיוג</a><a href="${waLink(tel,'')}" target="_blank" rel="noopener"><i>💬</i>וואטסאפ</a><a href="sms:${esc(tel)}"><i>✉️</i>הודעה</a>`:''}${p.em?`<a href="mailto:${esc(p.em)}"><i>📧</i>מייל</a>`:''}<button type="button" id="toSafety"><i>🛡️</i>תיק בטיחות</button></div>
    <section class="box"><h3>פרטי קשר</h3>${it('📱','טלפון נייד',esc(fmtPhone(p.ph)),tel?'tel:'+tel:'')}${it('📧','מייל',esc(p.em),p.em?'mailto:'+p.em:'')}${it('🏠','כתובת',esc(addr),addr?'https://waze.com/ul?q='+encodeURIComponent(addr)+'&navigate=yes':'')}</section>
    <section class="box"><h3>ארגון</h3>${it('🏷️','פרייבט',esc(p.pv))}${it('🚦','הרשאות נהיגה',(p.perm||'').split(/;\s*/).filter(Boolean).map(x=>`<span class="tag">${esc(x)}</span>`).join(''))}${it('🏢','סניף',esc(DATA.br))}${it('🗺️','מחוז',esc(o.dist))}${it('👤','ראש סניף / מנהל אגף',esc(o.head))}${it('👥','סגן ראש סניף',esc(o.dep))}${it('🚗','רכז תחבורה סניפי',esc(DATA.coord))}${it('🦺','קצין בטיחות מחוזי',esc(o.officer))}</section>
    ${p.bd||(p.cars||[]).length?`<section class="box"><h3>פרטים נוספים</h3>${it('🎂','תאריך לידה',esc(p.bd+(a?` (גיל ${a})`:'')))}${it('✡️','יום הולדת עברי',esc(hb))}${(p.cars||[]).map(c=>it('🚑','כלי ארגוני',esc(`כלי ${c.num}${c.type?' · '+c.type:''}${c.plate?' · '+c.plate:''}`))).join('')}</section>`:''}
  </aside>`;
  ov.onclick=e=>{if(e.target===ov||e.target.closest('.x'))return ov.remove();if(e.target.closest('#toSafety')){ov.remove();personSheet(key)}};document.body.append(ov);
}

/* ===== חיפוש כללי: אנשים ורכבים ===== */
function gsearch(q){
  const box=$('gres');q=q.trim();if(!q){box.hidden=true;box.innerHTML='';return}
  const d=q.replace(/\D/g,''),qq=q.replace(/-/g,'');
  const P=DATA.people.filter(p=>p.n.includes(q)||(d.length>=3&&((p.ph||'').includes(d)||(p.pv||'')===d||(p.pv||'').startsWith(d)))||(p.cars||[]).some(c=>c.num===d||(c.plate||'').replace(/-/g,'').includes(qq))).slice(0,30);
  const V=DATA.veh.filter(v=>(d&&(v.num===d||v.num.startsWith(d)||v.plate.replace(/-/g,'').includes(d)||(v.phone||'').includes(d)))||(v.name||'').includes(q)).slice(0,20);
  box.hidden=false;
  box.innerHTML=`<section class="panel"><header><h2>תוצאות חיפוש</h2><span class="count">${P.length+V.length}</span><button class="btn ghost" id="gsx" style="margin-inline-start:auto;padding:6px 10px">סגירה</button></header>
    ${P.length?`<div class="lt">אנשים</div>${P.map(pbRow).join('')}`:''}${V.length?`<div class="lt">רכבים</div><div class="vlist">${V.map(vRow).join('')}</div>`:''}${P.length||V.length?'':'<div class="empty">לא נמצא</div>'}</section>`;
  box.querySelectorAll('.prow.pb').forEach(c=>c.onclick=e=>{if(!e.target.closest('a'))contactSheet(c.dataset.c)});
  $('gsx').onclick=()=>{$('gs').value='';gsearch('')};
}

/* מתנדב לבדיקה: הרכז יכול לנסות את כל התהליך, וההודעה נשלחת לדני */
const TEST_P={n:'דני בן דוד (בדיקה)',pv:'',ph:'0508820408',em:'danny.b.d.20@gmail.com',perm:'אופנוע',cars:[],s:null,ride:[],alt:[],acc:[],lic:'31/12/2030',health:'31/12/2030',traffic:'',pp:1};

function coordMsg(b){const c=ADMIN[b];return `שלום ${first(c.coord)||''},\n\nפתחתי לך מערכת חדשה לניהול הבטיחות של סניף *${b}* 🚑\n\nבמערכת תוכל לראות:\n• את כל הנהגים בסניף – פרטים, מסמכים ותוקף רישיונות\n• ציוני סייפטי לכל חודש\n• ציוני הדרכות רכיבה (חיים בדרכים) והדרכות נהיגה (אלטרנתיבי)\n• את כל הכלים של הסניף ומצב הטסטים, הטיפולים והבדיקות\n• *טופס יציאה מגזרה* – בוחרים מתנדב, המערכת בודקת את כל הנתונים שלו ונותנת המלצה, ואם מאשרים – יש הודעת בטיחות מוכנה לשליחה\n\nכניסה:\n🔗 https://dannybd20-hue.github.io/akordim/coord.html\n🔑 סיסמה: *${c.pw}*\n\nהמערכת לצפייה בלבד, ורואים בה רק את הסניף שלך. כדאי להוסיף את הקישור למסך הבית בטלפון.\nהסיסמה אישית לך – לא להעביר הלאה.\n\nאם יש שאלה, אני זמין.\nדני בן דוד\nקצב"ת ירושלים`}

function onlineBox(){if(!SYNC_URL)return '<div id="onl"></div>';const L=ONLINE||[];const ago=t=>{const m=Math.max(0,Math.round((Date.now()-t)/60000));return m<1?'עכשיו':m<60?m+' דק׳':Math.floor(m/60)+' שע׳'};
  return `<div id="onl" class="online"><b><span class="dot${L.length?' on':''}"></span>${ONLINE==null?'בודק מי מחובר…':L.length?(L.length===1?'רכז אחד מחובר עכשיו':`${L.length} רכזים מחוברים עכשיו`):'אף רכז לא מחובר כרגע'}</b>${L.map(x=>`<span class="who">${esc(x.n||'רכז')} · ${esc(x.br)}<small>${esc(x.dev||'')} · מחובר ${ago(x.s)}</small></span>`).join('')}</div>`}
function adminBar(){const c=ADMIN[DATA.br],m=coordMsg(DATA.br);const on=new Set((ONLINE||[]).map(x=>x.br));return onlineBox()+`<div class="admin"><select id="adm" aria-label="סניף">${Object.keys(ADMIN).map(b=>`<option value="${esc(b)}"${b===DATA.br?' selected':''}>${on.has(b)?'🟢 ':''}${esc(b)}</option>`).join('')}</select><span class="info">מצב מנהל · רכז: <b>${esc(c.coord||'—')}</b>${c.cph?' · '+fmtPhone(c.cph):''} · סיסמה: <b>${esc(c.pw)}</b></span><span class="acts">${c.cph?`<a class="btn wa" href="${waLink(c.cph,m)}" target="_blank" rel="noopener">${WA_ICON}שליחת סיסמה לרכז</a>`:''}<button class="btn ghost" type="button" id="cpm">העתקת ההודעה</button></span></div>`}
document.querySelectorAll('.tab[data-v]').forEach(b=>b.onclick=()=>{st.view=b.dataset.v;document.querySelectorAll('.tab[data-v]').forEach(x=>x.setAttribute('aria-selected',x===b));render()});
function bind(){
  document.querySelectorAll('#app .prow:not(.pb)').forEach(c=>{c.onclick=e=>{if(!e.target.closest('a'))personSheet(c.dataset.p)};c.onkeydown=e=>{if(e.key==='Enter')personSheet(c.dataset.p)}});
  document.querySelectorAll('#app .prow.pb').forEach(c=>{c.onclick=e=>{if(!e.target.closest('a'))contactSheet(c.dataset.c)};c.onkeydown=e=>{if(e.key==='Enter')contactSheet(c.dataset.c)}});
  document.querySelectorAll('.kpi[data-k]').forEach(b=>b.onclick=()=>drill(b.dataset.k));
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{st.flt=b.dataset.f;render()});
  const q=$('q');if(q)q.oninput=e=>{st.q=e.target.value;const pos=e.target.selectionStart;render();const n=$('q');n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}};
  const cp=$('cpm');if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(coordMsg(DATA.br));cp.textContent='הועתק'}catch(e){cp.textContent='לא הועתק'}};
  const a=$('adm');if(a)a.onchange=async e=>{const b=e.target.value;$('app').innerHTML='<div class="empty">פותח…</div>';DATA=await dec(await fileOf(ADMIN[b].pw),ADMIN[b].pw);ls('coord_adm_br',b);st.sel=null;st.f={};show()};
}
function watermark(){
  let w=$('wm');if(!w){w=document.createElement('div');w.id='wm';document.body.append(w)}
  const t=`${DATA.br} · ${ADMIN?'מנהל':(DATA.coord||'רכז')} · ${new Date().toLocaleDateString('he-IL')}`;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200"><text x="210" y="105" font-family="Arial" font-size="20" font-weight="700" fill="#0f2a4a" text-anchor="middle" transform="rotate(-20 210 100)" direction="rtl">${t.replace(/[<&>"]/g,'')}</text></svg>`,u=`url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}")`;
  w.style.backgroundImage=u+','+u;
  document.body.classList.add('secure');
}
document.addEventListener('visibilitychange',()=>document.body.classList.toggle('hide-all',document.hidden));
window.addEventListener('blur',()=>document.body.classList.add('hide-all'));window.addEventListener('focus',()=>document.body.classList.remove('hide-all'));
document.addEventListener('copy',e=>{if(document.body.classList.contains('secure')&&!/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||''))e.preventDefault()});
document.addEventListener('contextmenu',e=>{if(document.body.classList.contains('secure'))e.preventDefault()});
function show(){$('gsw').hidden=false;const gi=$('gs');gi.oninput=()=>gsearch(gi.value);document.documentElement.style.setProperty('--hh',document.querySelector('.appbar').offsetHeight+'px');watermark();REMOTE=null;setTimeout(syncHist,0);setTimeout(()=>ping(),50);$('sub').textContent=DATA.br+(DATA.coord?' · רכז: '+DATA.coord:'');$('upd').textContent='עודכן '+DATA.upd;$('tabs').hidden=false;$('lockB').hidden=!!ADMIN;$('homeB').hidden=!ADMIN;render()}

/* ===== כניסה ===== */
function lockView(err){
  $('tabs').hidden=true;$('lockB').hidden=true;$('homeB').hidden=true;$('gsw').hidden=true;$('gres').hidden=true;$('sub').textContent='קצב"ת ירושלים';
  $('app').innerHTML=`<div class="lockc"><h2>בטיחות סניף</h2><p style="margin:0;color:var(--muted)">כניסה לרכזי תחבורה. הקלד את הסיסמה של הסניף שלך</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="סיסמה" dir="ltr" onkeydown="if(event.key==='Enter')unlock()">
  <label style="color:var(--muted);font-weight:600"><input type="checkbox" id="rem" checked> לזכור במכשיר הזה</label>
  <button class="go" id="ub" onclick="unlock()">כניסה</button><div class="err">${esc(err||'')}</div></div>`;
  setTimeout(()=>{const i=$('pw');if(i)i.focus()},50);
}
async function unlock(saved){
  const pw=saved||($('pw')&&$('pw').value.trim());if(!pw)return;
  if(!saved){$('ub').disabled=true;$('ub').textContent='פותח…'}else $('app').innerHTML='<div class="empty">פותח…</div>';
  try{DATA=await dec(await fileOf(pw),pw);CUR_PW=pw;if(!saved)ls('coord_pw',$('rem').checked?pw:null);show()}
  catch(e){if(saved)ls('coord_pw',null);lockView(e.message==='pw'?'סיסמה שגויה':!window.DecompressionStream?'הדפדפן ישן מדי, צריך לעדכן':'אין חיבור לאינטרנט, נסה שוב')}
}
function relock(){ls('coord_pw',null);DATA=null;ADMIN=null;lockView()}
(async()=>{
  /* מנהל (קצב"ת): אם יש במכשיר את סיסמת ניהול קצב"ת – פותח את כל הסניפים */
  const k=ls('kbt_pw');
  if(k){try{ADMIN=await dec('coord/index.bin',k);CUR_PW=k;const b=ls('coord_adm_br');const br=ADMIN[b]?b:Object.keys(ADMIN)[0];DATA=await dec(await fileOf(ADMIN[br].pw),ADMIN[br].pw);show();return}catch(e){ADMIN=null}}
  const p=ls('coord_pw');p?unlock(p):lockView();
})();
</script>
