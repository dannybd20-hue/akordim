<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<script>try{if(sessionStorage.getItem('gate_game')!=='1'){document.documentElement.style.display='none';location.replace('./?open=game')}}catch(e){location.replace('./')}</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>משחק חי – מסך מארח</title>
<meta name="theme-color" content="#46178f">
<link rel="icon" href="icons/apps-192.png">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#46178f;--tx:#1f1440}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);background-image:radial-gradient(circle at 15% 10%,#5b25b0 0,transparent 45%),radial-gradient(circle at 90% 95%,#2c0d5e 0,transparent 50%);color:#fff;font-family:Heebo,sans-serif;display:flex;flex-direction:column}
body.uh{--bg:#f26a21;background-image:radial-gradient(circle at 15% 10%,#ff8a3d 0,transparent 45%),radial-gradient(circle at 90% 95%,#c84f14 0,transparent 50%)}
button{font:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:14px;padding:12px 22px;background:rgba(0,0,0,.18)}
header img{height:44px;background:#fff;border-radius:8px;padding:3px 8px}
header h1{margin:0;font-size:clamp(16px,2.2vw,24px);font-weight:900;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb{border:0;border-radius:10px;padding:10px 18px;font-weight:900;font-size:16px;background:#fff;color:var(--tx)}
.hb.pr{background:#333;color:#fff}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:18px;text-align:center}
.card{background:#fff;color:var(--tx);border-radius:18px;padding:24px;box-shadow:0 14px 40px rgba(0,0,0,.3)}
.lobby{display:flex;gap:32px;align-items:center;flex-wrap:wrap;justify-content:center}
.pinbox .l{font-size:22px;font-weight:800;color:#555}
.pinbox .pin{font-size:clamp(56px,9vw,110px);font-weight:900;letter-spacing:6px;line-height:1.05;direction:ltr}
.pinbox .url{font-size:18px;font-weight:700;color:#555;direction:ltr;margin-top:6px}
#qr{background:#fff;padding:14px;border-radius:14px}
#qr img,#qr canvas{display:block;width:clamp(180px,24vw,300px)!important;height:auto!important}
.cnt{font-size:22px;font-weight:900}
.names{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1100px}
.names span{background:rgba(255,255,255,.95);color:var(--tx);font-weight:800;border-radius:10px;padding:8px 16px;font-size:20px;animation:pop .35s}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.qhead{background:#fff;color:var(--tx);border-radius:14px;padding:16px 22px;font-size:clamp(22px,3.2vw,40px);font-weight:900;max-width:1200px;width:100%;line-height:1.3}
.qmid{display:flex;align-items:center;justify-content:center;gap:28px;width:100%;max-width:1200px;flex:1;min-height:0}
.qimg{max-height:30vh;max-width:56vw;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);background:#fff}
.circle{width:clamp(90px,10vw,140px);height:clamp(90px,10vw,140px);border-radius:50%;background:#864cbf;display:flex;align-items:center;justify-content:center;font-size:clamp(40px,5vw,64px);font-weight:900;flex-shrink:0;border:6px solid rgba(255,255,255,.3)}
.side{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:900;font-size:20px}
.side b{font-size:clamp(34px,4vw,56px)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:1200px}
main{gap:14px}
.tile{border-radius:10px;padding:16px 20px;font-size:clamp(18px,2.2vw,28px);font-weight:800;display:flex;align-items:center;gap:16px;box-shadow:0 5px 0 rgba(0,0,0,.2);min-height:clamp(64px,9vh,100px);text-align:start;position:relative;overflow:hidden}
.tile .s{font-size:1.5em}
.tile .n{margin-inline-start:auto;font-weight:900;background:rgba(0,0,0,.25);border-radius:8px;padding:2px 12px}
.tile.dim{opacity:.28}
.tile.right{outline:5px solid #fff;outline-offset:-5px}.tile.right .n::before{content:"✓ "}
.c0{background:#e21b3c}.c1{background:#1368ce}.c2{background:#d89e00}.c3{background:#26890c}
.board{width:100%;max-width:820px;display:flex;flex-direction:column;gap:10px}
.board .r{display:flex;align-items:center;gap:14px;background:#fff;color:var(--tx);border-radius:12px;padding:14px 20px;font-size:clamp(18px,2.4vw,28px);font-weight:900;animation:pop .4s}
.board .r i{font-style:normal;width:44px;height:44px;border-radius:50%;background:var(--bg);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.board .r span{flex:1;text-align:start}
.title{font-size:clamp(30px,4vw,52px);font-weight:900;margin:0}
.pod{display:flex;align-items:flex-end;gap:16px;justify-content:center}
.pod div{width:clamp(110px,16vw,200px);background:#fff;color:var(--tx);border-radius:12px 12px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:14px;font-weight:900;font-size:clamp(16px,2vw,24px);animation:rise .8s}
.pod .p1{height:clamp(220px,32vh,320px);background:#ffd23f}.pod .p2{height:clamp(170px,25vh,250px)}.pod .p3{height:clamp(130px,19vh,190px)}
.pod em{font-style:normal;font-size:2em}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.setup{max-width:440px;width:100%}
.setup label{display:block;font-weight:800;margin:10px 0 6px;text-align:start}
.setup select{width:100%;padding:12px;border-radius:10px;border:2px solid #ddd;font:inherit;font-size:18px}
.err{color:#e21b3c;font-weight:800}
.spin{width:50px;height:50px;border:6px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header><span id="logo"></span><h1 id="ttl">🎮 משחק חי</h1><button class="hb" id="nextB" hidden onclick="next()"></button><button class="hb" id="backB" onclick="location.href='./'">→ אפליקציות</button></header>
<main id="M"><div class="spin"></div></main>
<script>
/* מסך המארח (מקרן / טלוויזיה): פותח משחק מטופס בוחן, מציג ברקוד וקוד, מריץ שאלות, טיימר, חשיפה וטבלת מובילים */
/* סקריפט המשחק (game-script.gs) – פרויקט נפרד מהטפסים */
const CLOUD='';
const PLAY='https://dannybd20-hue.github.io/akordim/go/game.html';
const $=id=>document.getElementById(id),M=$('M');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SH=['▲','◆','●','■'];
const P=new URLSearchParams(location.search);let KEY=P.get('key');
let pw='',G=null,players=[],answered=0,off=0,Q=null,QI=-1,tmr=0,shown='',busy=false;
try{pw=sessionStorage.getItem('hub_admin')||''}catch(e){}
function api(o){return fetch(CLOUD,{method:'POST',body:JSON.stringify({...o,password:pw})}).then(r=>r.json())}
function brand(t){if(/הצלה/.test(t||'')){document.body.classList.add('uh');$('logo').innerHTML='<img src="brand/uh-logo.png" alt="">'}}

/* בחירת משחק: המשחקים מוגדרים בסקריפט (GAMES) */
async function pick(){
  if(!pw||!CLOUD){setup();return}
  M.innerHTML='<div class="spin"></div>';
  try{const r=await api({action:'g_list'});if(!r.ok){setup(r.error==='password'?'הסיסמה הראשית לא אושרה בסקריפט':r.error);return}
    if(r.games.length===1){KEY=r.games[0].key;setup();return}
    M.innerHTML=`<h2 class="title">🎮 בחר משחק</h2><div class="board">`+r.games.map((g,i)=>`<button class="r" style="border:0;font:inherit;cursor:pointer" onclick="KEY='${g.key}';setup()"><i>${i+1}</i><span>${esc(g.title)}</span>${g.n} שאלות ▶</button>`).join('')+`</div>`;
  }catch(e){setup('אין חיבור לאינטרנט')}
}
function setup(err){
  if(!CLOUD){M.innerHTML='<div class="card"><b>עוד לא חובר סקריפט המשחק.</b><p>צריך להתקין את game-script.gs בגוגל ולשלוח את הכתובת שלו.</p></div>';return}
  if(!pw){M.innerHTML='<div class="card"><b>מסך המארח פתוח רק עם הסיסמה הראשית.</b><p>היכנס לדף הבית עם הסיסמה הראשית ופתח מאפליקציית הטפסים.</p></div>';return}
  M.innerHTML=`<div class="card setup"><h2 style="margin:0 0 6px">🎮 פתיחת משחק חי</h2><p style="margin:0;color:#555">השחקנים יענו מהטלפון עם קוד משחק או ברקוד</p>
    <label>זמן לכל שאלה</label><select id="dur"><option value="10">10 שניות</option><option value="20" selected>20 שניות</option><option value="30">30 שניות</option><option value="45">45 שניות</option><option value="60">דקה</option></select>
    <p class="err" id="er">${esc(err||'')}</p><button class="hb pr" style="width:100%;margin-top:8px" id="cb" onclick="create()">פתח משחק ←</button>
</div>`;
}
async function create(){
  $('cb').disabled=true;$('cb').textContent='פותח… (כמה שניות)';
  try{const r=await api({action:'g_create',key:KEY,dur:+$('dur').value});
    if(!r.ok){setup(r.error==='password'?'הסיסמה הראשית לא אושרה בסקריפט':r.error);return}
    G=r.game;brand(G.title);$('ttl').textContent='🎮 '+G.title;history.replaceState(null,'','?key='+KEY+'&pin='+G.pin);
    lobby();loop();setInterval(loop,1500);
  }catch(e){setup('אין חיבור לאינטרנט')}
}
async function loop(){
  if(busy||!G)return;busy=true;
  try{const r=await api({action:'g_host',pin:G.pin});if(r.ok){off=r.now-Date.now();G=r.game;players=r.players;answered=r.answered;render()}}catch(e){}
  busy=false;
}
function nb(t){const b=$('nextB');b.hidden=!t;b.textContent=t||''}
function render(){
  const ph=G.phase;
  if(ph==='lobby'){updLobby();return}
  if(ph==='question'){if(shown!=='q'+G.q)showQ();else{const a=$('ansN');if(a)a.textContent=answered;
    if(players.length&&answered>=players.length)next()}return}
  if(ph==='reveal'&&shown!=='r'+G.q)showReveal();
  if(ph==='leader'&&shown!=='l'+G.q)showBoard();
  if(ph==='end'&&shown!=='end')showEnd();
}
function lobby(){
  shown='lobby';$('backB').hidden=true;const url=PLAY+'?pin='+G.pin;
  M.innerHTML=`<div class="lobby"><div id="qr"></div><div class="card pinbox"><div class="l">נכנסים ל- <b>${esc(PLAY.replace('https://',''))}</b></div><div class="l" style="margin-top:6px">קוד משחק:</div><div class="pin">${G.pin}</div><div class="url">או סורקים את הברקוד 📷</div></div></div>
    <div class="cnt" id="pc">0 שחקנים</div><div class="names" id="nm"></div>`;
  try{new QRCode($('qr'),{text:url,width:300,height:300,correctLevel:QRCode.CorrectLevel.M})}catch(e){$('qr').textContent=url}
  nb('▶ התחל משחק');
}
function updLobby(){
  if(shown!=='lobby')lobby();
  const nm=$('nm');if(!nm)return;const have=[...nm.children].map(x=>x.dataset.p);
  players.forEach(p=>{if(!have.includes(p.pid)){const s=document.createElement('span');s.dataset.p=p.pid;s.textContent=p.name;nm.append(s)}});
  $('pc').textContent=players.length+(players.length===1?' שחקן':' שחקנים');
}
async function next(){
  const b=$('nextB');if(b.disabled)return;b.disabled=true;
  try{const r=await api({action:'g_next',pin:G.pin});if(r.ok){G=r.game;off=r.now-Date.now();render()}}catch(e){}
  b.disabled=false;
}
async function showQ(){
  shown='q'+G.q;clearInterval(tmr);nb('דלג ⏭');
  M.innerHTML='<div class="spin"></div>';
  if(QI!==G.q){const r=await api({action:'g_q',pin:G.pin});if(r.ok){Q=r.q;Q.img=r.img;QI=G.q}}
  M.innerHTML=`<div class="qhead">${esc(Q.t)}</div>
    <div class="qmid"><div class="side"><div class="circle" id="tm">${G.dur}</div></div>${Q.img?`<img class="qimg" src="${Q.img}" alt="">`:''}<div class="side"><b id="ansN">${answered}</b>תשובות</div></div>
    <div class="tiles">${Q.ch.map((c,i)=>`<div class="tile c${i}"><span class="s">${SH[i]}</span>${esc(c)}</div>`).join('')}</div>
    <div style="font-weight:800;opacity:.85">שאלה ${G.q+1} מתוך ${G.n}</div>`;
  tmr=setInterval(()=>{const left=Math.max(0,Math.ceil((G.qStart+G.dur*1000-(Date.now()+off))/1000));const t=$('tm');if(t)t.textContent=left;if(!left){clearInterval(tmr);if(G.phase==='question')setTimeout(next,600)}},250);
}
function showReveal(){
  shown='r'+G.q;clearInterval(tmr);nb(G.q>=G.n-1?'🏆 לתוצאות':'טבלת מובילים ←');
  const tot=Math.max(1,G.dist.reduce((a,b)=>a+b,0));
  M.innerHTML=`<div class="qhead">${esc(Q.t)}</div>
    <div class="tiles">${Q.ch.map((c,i)=>`<div class="tile c${i} ${i===G.right?'right':'dim'}"><span class="s">${SH[i]}</span>${esc(c)}<span class="n">${G.dist[i]}</span></div>`).join('')}</div>
    <div class="card" style="font-size:22px;font-weight:900">${G.dist[G.right]} מתוך ${players.length} ענו נכון (${Math.round(G.dist[G.right]*100/Math.max(1,players.length))}%)</div>`;
}
function topN(n){return [...players].sort((a,b)=>b.score-a.score).slice(0,n)}
function showBoard(){
  shown='l'+G.q;nb('שאלה הבאה ←');
  M.innerHTML=`<h2 class="title">🏅 טבלת מובילים</h2><div class="board">${topN(5).map((p,i)=>`<div class="r" style="animation-delay:${i*.08}s"><i>${i+1}</i><span>${esc(p.name)}</span>${p.score.toLocaleString('he-IL')}</div>`).join('')}</div>`;
}
function showEnd(){
  shown='end';nb('');const t=topN(3);
  M.innerHTML=`<h2 class="title">🏆 הזוכים</h2><div class="pod">
    ${t[1]?`<div class="p2"><em>🥈</em>${esc(t[1].name)}<small>${t[1].score.toLocaleString('he-IL')}</small></div>`:''}
    ${t[0]?`<div class="p1"><em>🥇</em>${esc(t[0].name)}<small>${t[0].score.toLocaleString('he-IL')}</small></div>`:''}
    ${t[2]?`<div class="p3"><em>🥉</em>${esc(t[2].name)}<small>${t[2].score.toLocaleString('he-IL')}</small></div>`:''}</div>
    <div class="board" style="max-width:600px">${[...players].sort((a,b)=>b.score-a.score).slice(3,10).map((p,i)=>`<div class="r"><i>${i+4}</i><span>${esc(p.name)}</span>${p.score.toLocaleString('he-IL')}</div>`).join('')}</div>`;
}
/* אם רעננו את הדף באמצע משחק, ממשיכים את אותו משחק */
(function(){const pin=P.get('pin');if(pin&&pw){G={pin,phase:'lobby',q:-1,n:0,dur:20};loop().then(()=>{if(G.title){brand(G.title);$('ttl').textContent='🎮 '+G.title}});setInterval(loop,1500)}else if(!KEY)pick();else setup()})();
</script>
<script src="presence.js"></script><script>dbdPresence('game')</script>
</body>
</html>
