<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<script>try{if(sessionStorage.getItem('gate_game')!=='1'){document.documentElement.style.display='none';location.replace('./?open=game')}}catch(e){location.replace('./')}</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>משחק חי – מסך מארח</title>
<meta name="theme-color" content="#f4f5fb">
<link rel="icon" href="icons/apps-192.png">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1e1b4b;--mut:#64748b;--bd:#e5e7f0;--pr:#4f46e5;--pr2:#0ea5e9;--ok:#16a34a;--no:#e11d48;
  --grad:linear-gradient(90deg,var(--pr),var(--pr2));--a0:#6366f1;--a1:#0ea5e9;--a2:#f59e0b;--a3:#ec4899}
body{--grad:linear-gradient(90deg,var(--pr),var(--pr2))}
body.uh{--pr:#f26a21;--pr2:#ff8a3d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.c0{--c:var(--a0)}.c1{--c:var(--a1)}.c2{--c:var(--a2)}.c3{--c:var(--a3)}
body{margin:0;min-height:100vh;background:var(--bg);background-image:radial-gradient(900px 500px at 100% -10%,rgba(99,102,241,.13),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(14,165,233,.11),transparent 60%);color:var(--tx);font-family:Heebo,sans-serif;display:flex;flex-direction:column}
body.uh{background-image:radial-gradient(900px 500px at 100% -10%,rgba(242,106,33,.14),transparent 60%)}
button{font:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:14px;padding:12px 22px;background:var(--card);border-bottom:1px solid var(--bd)}
header img{height:42px}
header h1{margin:0;font-size:clamp(16px,2.2vw,22px);font-weight:900;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb{border:1.5px solid var(--bd);border-radius:12px;padding:10px 18px;font-weight:900;font-size:16px;background:var(--card);color:var(--tx)}
.hb.pr,#nextB{background:var(--grad);color:#fff;border:0;box-shadow:0 8px 20px rgba(79,70,229,.25)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px;text-align:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:24px;box-shadow:0 10px 30px rgba(30,27,75,.07)}
.lobby{display:flex;gap:32px;align-items:center;flex-wrap:wrap;justify-content:center}
.pinbox .l{font-size:20px;font-weight:800;color:var(--mut)}
.pinbox .pin{font-size:clamp(56px,9vw,110px);font-weight:900;letter-spacing:6px;line-height:1.05;direction:ltr;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.pinbox .url{font-size:17px;font-weight:700;color:var(--mut);direction:ltr;margin-top:6px}
#qr{background:#fff;padding:14px;border-radius:18px;border:1px solid var(--bd);box-shadow:0 10px 30px rgba(30,27,75,.07)}
#qr img,#qr canvas{display:block;width:clamp(180px,24vw,300px)!important;height:auto!important}
.cnt{font-size:22px;font-weight:900}
.names{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1100px}
.names span{background:var(--card);border:1px solid var(--bd);font-weight:800;border-radius:12px;padding:8px 16px;font-size:20px;animation:pop .35s;box-shadow:0 4px 12px rgba(30,27,75,.06)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.qhead{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px 22px;font-size:clamp(22px,3vw,38px);font-weight:900;max-width:1200px;width:100%;line-height:1.3;box-shadow:0 10px 30px rgba(30,27,75,.07)}
.qmid{display:flex;align-items:center;justify-content:center;gap:28px;width:100%;max-width:1200px;flex:1;min-height:0}
.qimg{max-height:30vh;max-width:56vw;border-radius:16px;box-shadow:0 10px 30px rgba(30,27,75,.15);background:#fff}
.circle{width:clamp(90px,10vw,140px);height:clamp(90px,10vw,140px);border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(40px,5vw,64px);font-weight:900;flex-shrink:0;box-shadow:0 10px 26px rgba(79,70,229,.3)}
.side{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:900;font-size:20px;color:var(--mut)}
.side b{font-size:clamp(34px,4vw,56px);color:var(--tx)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:1200px}
.tile{background:var(--card);border:1.5px solid var(--bd);border-inline-start:8px solid var(--c);border-radius:18px;padding:14px 18px;font-size:clamp(18px,2.1vw,27px);font-weight:800;display:flex;align-items:center;gap:16px;min-height:clamp(64px,9vh,96px);text-align:start;box-shadow:0 6px 18px rgba(30,27,75,.06)}
.tile .s{flex-shrink:0;width:1.9em;height:1.9em;border-radius:14px;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}
.tile .n{margin-inline-start:auto;font-weight:900;background:var(--bg);border-radius:10px;padding:2px 14px}
.tile.dim{opacity:.38}
.tile.right{border-color:var(--ok);background:#f0fdf4;box-shadow:0 0 0 3px rgba(22,163,74,.25)}
.tile.right .n{background:var(--ok);color:#fff}.tile.right .n::before{content:"✓ "}
.hint{font-weight:800;color:var(--mut)}
.board{width:100%;max-width:820px;display:flex;flex-direction:column;gap:10px}
.board .r{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 20px;font-size:clamp(18px,2.4vw,27px);font-weight:900;animation:pop .4s;box-shadow:0 6px 18px rgba(30,27,75,.06);color:var(--tx)}
.board .r i{font-style:normal;width:44px;height:44px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.board .r span{flex:1;text-align:start}
.title{font-size:clamp(30px,4vw,50px);font-weight:900;margin:0}
.pod{display:flex;align-items:flex-end;gap:16px;justify-content:center}
.pod div{width:clamp(110px,16vw,200px);background:var(--card);border:1px solid var(--bd);border-radius:18px 18px 0 0;display:flex;flex-direction:column;align-items:center;padding-top:14px;font-weight:900;font-size:clamp(16px,2vw,24px);animation:rise .8s;box-shadow:0 10px 30px rgba(30,27,75,.1)}
.pod .p1{height:clamp(220px,32vh,320px);background:var(--grad);color:#fff;border:0}.pod .p2{height:clamp(170px,25vh,250px)}.pod .p3{height:clamp(130px,19vh,190px)}
.pod em{font-style:normal;font-size:2em}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.setup{max-width:440px;width:100%}
.setup label{display:block;font-weight:800;margin:10px 0 6px;text-align:start}
.setup select{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--bd);font:inherit;font-size:18px;background:#fafaff}
.err{color:var(--no);font-weight:800}
.spin{width:50px;height:50px;border:6px solid var(--bd);border-top-color:var(--pr);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sum{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:900px;width:100%}
.who-b{font-size:17px}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;width:100%;max-height:34vh;overflow:auto;text-align:start}
.who[hidden]{display:none}
.wr{display:flex;align-items:center;gap:10px;border-radius:12px;padding:8px 12px;color:#fff;font-size:16px;font-weight:700}
.wr.ok{background:var(--ok)}.wr.no{background:var(--no)}.wr.none{background:#94a3b8}
.wr b{font-weight:900;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wr span{flex:1;display:flex;align-items:center;gap:6px;font-weight:600;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.wr span i{font-style:normal;width:24px;height:24px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex-shrink:0;background:rgba(255,255,255,.25)}
.wr em{font-style:normal;font-weight:900}
.hotn{animation:hotp 1s infinite;background:linear-gradient(135deg,#ef4444,#b91c1c)!important;color:#fff!important;border-color:#b91c1c!important}
@keyframes hotp{0%{transform:scale(1)}50%{transform:scale(1.35)}100%{transform:scale(1)}}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(239,68,68,.45));transition:opacity .3s}
body.hot::after{opacity:1;animation:hotf 1s infinite}
@keyframes hotf{0%,100%{opacity:.35}50%{opacity:1}}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.waitl{font-weight:800;color:var(--mut);font-size:17px;max-width:1100px}
.names span{cursor:pointer}
.ph{display:block;font-size:12px;font-weight:700;color:var(--mut)}
.names span.nm{display:flex;flex-direction:column;align-items:center;line-height:1.15;padding:8px 18px}.names span.nm small{font-size:13px;font-weight:700;color:var(--mut);margin-top:2px}
.shq{max-width:520px;width:100%}
.shq a{color:var(--pr);font-weight:900}
.pp{position:fixed;z-index:5;pointer-events:none;background:var(--bgc,var(--grad));color:#fff;font-weight:900;border-radius:99px;padding:.25em .7em;box-shadow:0 8px 22px rgba(30,27,75,.25);animation:ppop 2s ease-out forwards;white-space:nowrap}
@keyframes ppop{0%{transform:scale(.2) rotate(-6deg);opacity:0}12%{transform:scale(1.15) rotate(2deg);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{transform:translateY(-28px) scale(.9);opacity:0}}
.more{font-weight:800;color:var(--mut)}
.board.all{max-height:38vh;overflow:auto;padding:4px}
.board.all .r{padding:8px 16px;font-size:18px}.board.all .r i{width:34px;height:34px;font-size:15px}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.ov .card{width:100%;max-width:520px;max-height:94vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.pl{overflow:auto;display:flex;flex-direction:column;gap:6px}
.pl div{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:12px;padding:8px 10px;font-weight:800;text-align:start}
.pl div span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl button{border:1px solid var(--bd);background:var(--bg);border-radius:10px;padding:6px 10px}
.rm{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px}
.rm .big{font-size:22px;font-weight:900}
.rm .huge{width:100%;font-size:26px;padding:22px;border-radius:18px}
.rm .stat{display:flex;justify-content:space-around;font-weight:800;color:var(--mut)}.rm .stat b{display:block;font-size:34px;color:var(--tx)}
.rm .pin{font-size:48px;font-weight:900;letter-spacing:4px;direction:ltr}
@media (max-width:760px){
  header{padding:10px 12px;gap:8px;flex-wrap:wrap}header img{height:32px}.hb{padding:8px 12px;font-size:14px}
  main{padding:12px;justify-content:flex-start}
  .tiles{grid-template-columns:1fr}.tile{min-height:52px;font-size:17px;padding:10px 12px}
  .qmid{flex-direction:column;gap:12px}.qimg{max-width:92vw;max-height:26vh}
  .side{flex-direction:row;gap:10px}
  .lobby{gap:16px}.pod{gap:8px}.pod div{width:30vw}
  .who{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header><span id="logo"><img src="icons/apps-192.png" alt="" style="border-radius:12px"></span><h1 id="ttl">🎮 משחק חי</h1><button class="hb" id="altB" hidden></button><button class="hb" id="nextB" hidden onclick="next()"></button><button class="hb" id="qrB" hidden onclick="joinQR()">➕ 📷</button><button class="hb" id="plB" hidden onclick="manage()">👥</button><button class="hb" id="modeB" hidden onclick="setMode(!REM)"></button><button class="hb" id="backB" onclick="location.href='./'">→ אפליקציות</button></header>
<main id="M"><div class="spin"></div></main>
<script>
/* מסך המארח (מקרן / טלוויזיה): פותח משחק מטופס בוחן, מציג ברקוד וקוד, מריץ שאלות, טיימר, חשיפה וטבלת מובילים */
/* סקריפט המשחק (game-script.gs) – פרויקט נפרד מהטפסים */
const CLOUD='https://script.google.com/macros/s/AKfycbyAdq-zplTeoIv1OPqxSOmbykpNM_7lRFtQ1fBcP0q0R0Abr4Qhk9a1G6nomO8k1EF_MA/exec';
const PLAY='https://dannybd20-hue.github.io/akordim/go/game.html';
const $=id=>document.getElementById(id),M=$('M');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SH=['א','ב','ג','ד'];
const P=new URLSearchParams(location.search);let KEY=P.get('key');
let pw='',G=null,players=[],answered=0,done=[],off=0,Q=null,QI=-1,tmr=0,shown='',busy=false,looping=0;
/* REM = מצב שלט: מסך קטן לטלפון לניהול המשחק (גם כשהמחשב כבוי) */
let REM=P.get('remote')==='1'||(P.get('remote')!=='0'&&matchMedia('(max-width:760px)').matches);
try{pw=sessionStorage.getItem('hub_admin')||''}catch(e){}
function api(o){return fetch(CLOUD,{method:'POST',body:JSON.stringify({...o,password:pw})}).then(r=>r.json())}
function brand(t){if(/הצלה/.test(t||'')){document.body.classList.add('uh');$('logo').innerHTML='<img src="brand/uh-logo.png" alt="">'}}

/* בחירת משחק: המשחקים מוגדרים בסקריפט (GAMES) */
async function pick(){
  if(!pw||!CLOUD){setup();return}
  M.innerHTML='<div class="spin"></div>';
  try{const [r,ac]=await Promise.all([api({action:'g_list'}),api({action:'g_active'}).catch(()=>null)]);if(!r.ok){setup(r.error==='password'?'הסיסמה הראשית לא אושרה בסקריפט':r.error);return}
    /* גם משחק שנפתח לפני העדכון: מזהים אותו לפי הקוד האחרון ששמור במכשיר הזה */
    const act=ac&&ac.ok?ac.games.slice():[];
    let last='';try{last=localStorage.getItem('game_host_last')||''}catch(e){}
    if(last&&!act.some(x=>x.pin===last)){try{const h=await api({action:'g_host',pin:last});
      if(h.ok&&h.game.phase!=='end')act.unshift({pin:last,key:h.game.key,title:h.game.title,phase:h.game.phase,q:h.game.q,n:h.game.n,players:h.players.length})}catch(e){}}
    if(act.length){activeList(act,r.games);return}
    if(r.games.length===1){KEY=r.games[0].key;setup();return}
    M.innerHTML=`<h2 class="title">🎮 בחר משחק</h2><div class="board">`+r.games.map((g,i)=>`<button class="r" style="border:0;font:inherit;cursor:pointer" onclick="KEY='${g.key}';setup()"><i>${i+1}</i><span>${esc(g.title)}</span>${g.n} שאלות ◀</button>`).join('')+`</div>`;
  }catch(e){setup('אין חיבור לאינטרנט')}
}
/* משחקים שעדיין רצים: אפשר להמשיך לנהל אותם מכל מכשיר */
const PH={lobby:'בלובי',question:'בשאלה',reveal:'בתשובה',leader:'בטבלת מובילים'};
function activeList(act,games){
  M.innerHTML=`<h2 class="title">◀ משחקים פעילים</h2><div class="board">`+act.map(g=>`<div class="r" style="flex-wrap:wrap"><span>${esc(g.title)} · קוד ${g.pin}<br><small style="color:var(--mut)">${PH[g.phase]||''}${g.q>=0?' · שאלה '+(g.q+1)+'/'+g.n:''} · ${g.players} שחקנים</small></span>
    <button class="hb pr" onclick="resume('${g.pin}',0)">🖥 מסך</button><button class="hb" onclick="resume('${g.pin}',1)">📱 שלט</button><button class="hb" style="color:var(--no)" onclick="closeGame('${g.pin}')">✖ סגור משחק</button></div>`).join('')+`</div>
    ${BOX}<button class="hb" onclick="${games.length===1?`KEY='${games[0].key}';setup()`:'pickNew()'}">＋ משחק חדש</button>`;
  window._games=games;
}
const BOX=`<div class="card" style="max-width:440px;width:100%"><b>יש משחק פתוח במכשיר אחר?</b><div style="display:flex;gap:8px;margin-top:8px"><input id="rp" inputmode="numeric" maxlength="6" placeholder="קוד המשחק (6 ספרות)" style="flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--bd);font:inherit;font-size:18px;text-align:center"><button class="hb pr" onclick="resumePin()">המשך</button></div></div>`;
function resumePin(){const v=($('rp').value||'').replace(/\D/g,'');if(v.length===6)resume(v,REM?1:0)}
/* סגירת משחק פתוח (גם ממכשיר אחר): השחקנים רואים שהמשחק הסתיים */
async function closeGame(pin){
  if(!confirm('לסגור את המשחק '+pin+'? השחקנים יראו שהמשחק הסתיים.'))return;
  let r=null;try{r=await api({action:'g_close',pin})}catch(e){}
  if(r&&r.ok){try{if(localStorage.getItem('game_host_last')===pin)localStorage.removeItem('game_host_last')}catch(e){}
    if(G&&G.pin===pin){clearInterval(looping);location.href='host.html'}else pick()}
  else alert(r&&r.error==='unknown action'?'צריך לעדכן את סקריפט המשחק (הגרסה החדשה)':(r&&r.error)||'אין חיבור');
}
function pickNew(){const g=window._games;M.innerHTML=`<h2 class="title">🎮 בחר משחק</h2><div class="board">`+g.map((x,i)=>`<button class="r" style="border:0;font:inherit;cursor:pointer" onclick="KEY='${x.key}';setup()"><i>${i+1}</i><span>${esc(x.title)}</span>${x.n} שאלות ◀</button>`).join('')+`</div>`}
function resume(pin,rem){location.href='?pin='+pin+'&remote='+rem}
function setup(err){
  if(!CLOUD){M.innerHTML='<div class="card"><b>עוד לא חובר סקריפט המשחק.</b><p>צריך להתקין את game-script.gs בגוגל ולשלוח את הכתובת שלו.</p></div>';return}
  if(!pw){M.innerHTML='<div class="card"><b>מסך המארח פתוח רק עם הסיסמה הראשית.</b><p>היכנס לדף הבית עם הסיסמה הראשית ופתח מאפליקציית הטפסים.</p></div>';return}
  M.innerHTML=`<div class="card setup"><h2 style="margin:0 0 6px">🎮 פתיחת משחק חי</h2><p style="margin:0;color:#555">השחקנים יענו מהטלפון עם קוד משחק או ברקוד</p>
    <label>זמן לכל שאלה</label><select id="dur"><option value="10">10 שניות</option><option value="20" selected>20 שניות</option><option value="30">30 שניות</option><option value="45">45 שניות</option><option value="60">דקה</option></select>
    <label>טבלת מובילים</label><select id="lb"><option value="1">אחרי כל שאלה</option><option value="2">כל 2 שאלות</option><option value="3" selected>כל 3 שאלות</option><option value="5">כל 5 שאלות</option><option value="0">רק בסוף המשחק</option></select>
    <p class="err" id="er">${esc(err||'')}</p><button class="hb pr" style="width:100%;margin-top:8px" id="cb" onclick="create()">פתח משחק ←</button>
</div>${BOX}`;
}
async function create(){
  $('cb').disabled=true;$('cb').textContent='פותח… (כמה שניות)';
  try{const r=await api({action:'g_create',key:KEY,dur:+$('dur').value,lb:+$('lb').value});
    if(!r.ok){setup(r.error==='password'?'הסיסמה הראשית לא אושרה בסקריפט':r.error);return}
    G=r.game;brand(G.title);$('ttl').textContent='🎮 '+G.title;history.replaceState(null,'','?key='+KEY+'&pin='+G.pin);
    started();render();
  }catch(e){setup('אין חיבור לאינטרנט')}
}
async function loop(){
  if(busy||!G)return;busy=true;
  try{const r=await api({action:'g_host',pin:G.pin});if(r.ok){off=r.now-Date.now();G=r.game;players=r.players;answered=r.answered;done=r.done||[];render()}
    else if(r.error==='nogame'){M.innerHTML='<div class="card"><b>המשחק הזה כבר לא קיים</b> (עברו יותר מ-6 שעות)</div>';nb('')}}catch(e){}

}
function started(){try{localStorage.setItem('game_host_last',G.pin)}catch(e){}
 
  $('backB').hidden=true;$('plB').hidden=false;$('qrB').hidden=false;$('modeB').hidden=false;modeLbl();
  if(!looping){looping=setInterval(loop,1000);loop()}
}
function modeLbl(){$('modeB').textContent=REM?'🖥 מסך':'📱 שלט'}
function setMode(r){REM=r;modeLbl();shown='';const u=new URL(location.href);u.searchParams.set('remote',r?1:0);history.replaceState(null,'',u);render()}
/* שלט מצגת: PageDown / רווח / Enter / חץ שמאלה = הבא. B = הצג או דלג על טבלת המובילים. אין "אחורה" */
document.addEventListener('keydown',e=>{
  if(!G||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||$('ov'))return;
  if(['PageDown','ArrowLeft','ArrowDown',' ','Enter'].includes(e.key)){e.preventDefault();if(!$('nextB').hidden)next()}
  else if(e.key==='b'||e.key==='B'||e.key==='נ'){e.preventDefault();const a=$('altB');if(!a.hidden)a.click()}
});
function nb(t){const b=$('nextB');b.hidden=!t;b.textContent=t||''}
function alt(t,fn){const b=$('altB');b.hidden=!t;b.textContent=t||'';b.onclick=fn||null}
/* האם אחרי השאלה הזאת מגיעה טבלת מובילים (לפי ההגדרה בפתיחת המשחק) */
function due(){const lb=G.lb===undefined?1:G.lb;return lb>0&&(G.q+1)%lb===0}
function render(){

/* "ממתינים ל…": מי עוד לא שלח תשובה (כשנשארו מעטים, מציגים את השמות) */
/* כל מי שעונה "קופץ" לרגע על המסך עם השם שלו (בצדדים ובאמצע) ונעלם אחרי שנייה-שתיים */

const PPC=[['#ef4444','#f97316'],['#f59e0b','#eab308'],['#22c55e','#10b981'],['#06b6d4','#3b82f6'],['#6366f1','#8b5cf6'],['#ec4899','#f43f5e'],['#14b8a6','#22c55e'],['#a855f7','#ec4899'],['#0ea5e9','#6366f1'],['#84cc16','#16a34a']];
function popNames(){
  if(REM||G.phase!=='question')return;

    setTimeout(()=>{if(G.phase!=='question')return;const e=document.createElement('div');e.className='pp';e.textContent=p.name;
      /* צבע וגודל אחרים בכל פעם */
      const k=PPC[Math.floor(Math.random()*PPC.length)];e.style.setProperty('--bgc','linear-gradient(135deg,'+k[0]+','+k[1]+')');
      e.style.fontSize=Math.round(Math.max(16,innerWidth*(.016+Math.random()*.028)))+'px';
      const z=Math.random(),w=innerWidth,h=innerHeight;
      /* שליש מהשמות בצד ימין, שליש בשמאל, שליש באמצע – בלי להסתיר את הכותרת */
      const x=z<.33?w*(.02+Math.random()*.12):z<.66?w*(.78+Math.random()*.12):w*(.38+Math.random()*.2);
      e.style.left=Math.min(x,w-160)+'px';e.style.top=(h*(.3+Math.random()*.5))+'px';
      document.body.append(e);setTimeout(()=>e.remove(),2100)},i*(1400/Math.max(1,fresh.length)))});
}
function waitList(){popNames();
  const w=$('waitL');if(!w)return;const left=players.filter(p=>!done.includes(p.pid));
  w.textContent=!left.length?'כולם ענו ✓':left.length<=12?'⏳ ממתינים ל: '+left.map(p=>p.name).join(', '):'⏳ ממתינים ל-'+left.length+' שחקנים';
}

/* 5 השניות האחרונות: צפצוף בכל שנייה, המספר מתנפח ורקע אדום מהבהב */
let ac=null;
function beep(f,d){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.18,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d)}catch(e){}}
let lastTick=-1;
function hot(left){
  const t=$('tm');document.body.classList.toggle('hot',left>0&&left<=5);
  if(t)t.classList.toggle('hotn',left>0&&left<=5);
  if(left>0&&left<=5&&left!==lastTick){lastTick=left;beep(left===1?880:660,.18);try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}
  if(left===0&&lastTick!==0){lastTick=0;beep(300,.5);document.body.classList.remove('hot')}
  if(left>5)lastTick=-1;
}
function startTimer(){
  clearInterval(tmr);
  tmr=setInterval(()=>{const left=Math.max(0,Math.ceil((G.qStart+G.dur*1000-(Date.now()+off))/1000));const t=$('tm');if(t)t.textContent=left;hot(left);if(!left){clearInterval(tmr);if(G.phase==='question')setTimeout(next,600)}},250);
}
/* כפתורי החשיפה: הכפתור הראשי לפי ההגדרה, והשני עוקף אותה (מקש B בשלט) */
function revealBtns(){
  if(G.q>=G.n-1){nb('🏆 לתוצאות');alt('');return}
  if(due()){nb('🏅 טבלת מובילים ←');alt('דלג על הטבלה ←',()=>next('skip'))}
  else{nb('שאלה הבאה ←');alt('🏅 הצג טבלה',()=>next('board'))}
}
function counts(){
  const L=G.last||{};let ok=0,no=0,none=0;
  players.forEach(p=>{const l=L[p.pid];if(!l||l.none)none++;else if(l.ok)ok++;else no++});
  return {ok,no,none};
}
function countsTxt(){const c=counts();return `✓ ${c.ok} ענו נכון · ✗ ${c.no} טעו`+(c.none?` · ⏳ ${c.none} לא ענו`:'')}
function lobby(){
  shown='lobby';$('backB').hidden=true;const url=PLAY+'?pin='+G.pin;
  M.innerHTML=`<div class="lobby"><div id="qr"></div><div class="card pinbox"><div class="l">נכנסים ל- <b>${esc(PLAY.replace('https://',''))}</b></div><div class="l" style="margin-top:6px">קוד משחק:</div><div class="pin">${G.pin}</div><div class="url">או סורקים את הברקוד 📷</div></div></div>
    <div class="cnt" id="pc">0 שחקנים</div><div class="names" id="nm"></div>`;
  try{new QRCode($('qr'),{text:url,width:300,height:300,correctLevel:QRCode.CorrectLevel.M})}catch(e){$('qr').textContent=url}
  nb('◀ התחל משחק');alt('');
}
function updLobby(){
  if(shown!=='lobby')lobby();
  const nm=$('nm');if(!nm)return;const have=[...nm.children].map(x=>x.dataset.p);
  const chip=p=>esc(p.name)+(p.phone?`<small>כונן ${esc(p.phone)}</small>`:'');
  [...nm.children].forEach(x=>{const p=players.find(q=>q.pid===x.dataset.p);if(!p)x.remove();else if(x.dataset.h!==chip(p)){x.dataset.h=chip(p);x.innerHTML=chip(p)}});
  players.forEach(p=>{if(!have.includes(p.pid)){const s=document.createElement('span');s.className='nm';s.dataset.p=p.pid;s.dataset.h=chip(p);s.innerHTML=chip(p);s.title='לחיצה: שינוי שם או הוצאה';s.onclick=()=>manage();nm.append(s)}});
  nm.style.fontSize=players.length>40?'15px':'';
  $('pc').textContent=players.length+(players.length===1?' שחקן':' שחקנים');

let nexting=false;
async function next(show){

  try{const r=await api({action:'g_next',pin:G.pin,from:G.phase+':'+G.q,show:typeof show==='string'?show:undefined});if(r.ok){G=r.game;off=r.now-Date.now();render()}}catch(e){}
  nexting=false;$('nextB').disabled=$('altB').disabled=false;

async function showQ(){

function showReveal(){

    <div class="card sum"><div style="font-size:22px;font-weight:900">${countsTxt()}</div>

/* "מי ענה מה": כל שחקן עם הצורה והתשובה שבחר. ירוק = נכון, אדום = לא נכון, אפור = לא ענה */

/* בסוף המשחק: לשאול אם ליצור טבלה בגוגל שיטס (שם, טלפון, ומה כל אחד ענה בכל שאלה) */

  return `<div class="card shq" id="shq"><b>📊 ליצור טבלה בגוגל שיטס?</b><div class="mid" style="margin:6px 0 10px;color:var(--mut);font-weight:700">שם, מס' כונן, ניקוד ומה כל שחקן ענה בכל שאלה</div><div class="btns"><button class="hb pr" onclick="mkSheet()">כן, צור טבלה</button><button class="hb" onclick="$('shq').remove()">לא תודה</button></div></div>`;

/* קונפטי לזוכים */
function boom(){

/* מצב שלט: הכול בעמוד אחד קטן – מה קורה עכשיו, כמה ענו, ממתינים ל…, וכפתור "הבא" גדול */

/* ניהול שחקנים: שינוי שם או הוצאה מהמשחק */

async function ren(id){

}
async function kick(id){
  const p=players.find(x=>x.pid===id);if(!p||!confirm('להוציא את '+p.name+' מהמשחק?'))return;
  const r=await api({action:'g_kick',pin:G.pin,pid:id}).catch(()=>null);
  if(r&&r.ok){players=players.filter(x=>x.pid!==id);manage();await loop()}else alert(r?r.error:'אין חיבור');
}
/* אם רעננו את הדף באמצע משחק, ממשיכים את אותו משחק */
(function(){const pin=P.get('pin');if(pin&&pw){G={pin,phase:'',q:-1,n:0,dur:20};busy=false;loop().then(()=>{if(G.title){brand(G.title);$('ttl').textContent='🎮 '+G.title}started()})}else pick()})();
</script>
