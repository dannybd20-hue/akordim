<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>משחק חי</title>
<meta property="og:title" content="🎮 משחק חי – הצטרפו!">
<meta property="og:description" content="נכנסים עם קוד המשחק ומשחקים מהטלפון">
<meta property="og:image" content="https://dannybd20-hue.github.io/akordim/brand/og/game.png">
<meta name="theme-color" content="#f4f5fb">
<link rel="icon" href="icons/apps-192.png">
<script src="cert.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1e1b4b;--mut:#64748b;--bd:#e5e7f0;--pr:#4f46e5;--pr2:#0ea5e9;--ok:#16a34a;--no:#e11d48;
  --grad:linear-gradient(90deg,var(--pr),var(--pr2));--a0:#6366f1;--a1:#0ea5e9;--a2:#f59e0b;--a3:#ec4899}
body{--grad:linear-gradient(90deg,var(--pr),var(--pr2))}
body.uh{--pr:#f26a21;--pr2:#ff8a3d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.c0{--c:var(--a0)}.c1{--c:var(--a1)}.c2{--c:var(--a2)}.c3{--c:var(--a3)}
html,body{height:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(600px 400px at 100% -10%,rgba(99,102,241,.14),transparent 60%),radial-gradient(500px 400px at -10% 110%,rgba(14,165,233,.12),transparent 60%);color:var(--tx);font-family:Heebo,sans-serif;display:flex;flex-direction:column;min-height:100vh}
body.uh{background-image:radial-gradient(600px 400px at 100% -10%,rgba(242,106,33,.14),transparent 60%)}
button,input{font:inherit;color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-weight:800;font-size:15px;background:var(--card);border-bottom:1px solid var(--bd)}
.top .sc{background:var(--grad);color:#fff;border-radius:99px;padding:4px 14px;font-weight:900}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 16px;text-align:center;gap:14px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:24px 20px;width:100%;max-width:380px;box-shadow:0 10px 30px rgba(30,27,75,.08)}
.box h1{margin:0 0 14px;font-size:24px;font-weight:900}
.fld{width:100%;border:1.5px solid var(--bd);border-radius:14px;padding:14px;font-size:20px;font-weight:800;text-align:center;margin-bottom:10px;outline:none;background:#fafaff}
.fld:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.go{width:100%;border:0;border-radius:14px;padding:14px;font-size:19px;font-weight:900;background:var(--grad);color:#fff;cursor:pointer;box-shadow:0 8px 20px rgba(79,70,229,.25)}
.go:active{transform:scale(.98)}
.err{color:var(--no);font-weight:800;min-height:22px;margin:4px 0 0}
.big{font-size:28px;font-weight:900;line-height:1.25}
.mid{font-size:17px;font-weight:700;color:var(--mut)}
.spin{width:42px;height:42px;border:5px solid var(--bd);border-top-color:var(--pr);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.qt{font-size:19px;font-weight:800;max-width:520px;line-height:1.4;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px 16px;width:100%}
.ans{display:grid;grid-template-columns:1fr;gap:10px;width:100%;max-width:520px}
.ans button{border:1.5px solid var(--bd);border-inline-start:6px solid var(--c);border-radius:16px;background:var(--card);font-size:17px;font-weight:800;padding:16px 14px;display:flex;align-items:center;gap:12px;text-align:start;cursor:pointer;box-shadow:0 4px 14px rgba(30,27,75,.06);min-height:68px;touch-action:manipulation}
.ans button:active{transform:scale(.98);background:#f8f8ff}
.ans .s{flex-shrink:0;width:38px;height:38px;border-radius:12px;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900}
.timer{font-size:15px;font-weight:900;background:var(--card);border:1px solid var(--bd);color:var(--pr);border-radius:99px;padding:5px 16px}
.res{width:100%;max-width:380px;border-radius:22px;padding:28px 18px;color:#fff;box-shadow:0 12px 30px rgba(30,27,75,.15)}
.res.ok{background:linear-gradient(135deg,#22c55e,#15803d)}.res.no{background:linear-gradient(135deg,#fb7185,#e11d48)}
.res .ic{font-size:60px;line-height:1}
.pts{display:inline-block;background:rgba(255,255,255,.22);border-radius:12px;padding:6px 16px;font-size:22px;font-weight:900;margin-top:10px}
.timer.hotn{animation:hotp 1s infinite;background:linear-gradient(135deg,#ef4444,#b91c1c)!important;color:#fff!important;border-color:#b91c1c!important}
@keyframes hotp{0%{transform:scale(1)}50%{transform:scale(1.35)}100%{transform:scale(1)}}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(239,68,68,.45));transition:opacity .3s}
body.hot::after{opacity:1;animation:hotf 1s infinite}
@keyframes hotf{0%,100%{opacity:.35}50%{opacity:1}}
.snd{border:1.5px solid var(--bd);background:var(--bg);border-radius:99px;padding:3px 10px;font-size:16px;cursor:pointer;margin-inline-start:8px}
.pimg{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:6px}
.pimg img{max-width:100%;max-height:30vh;border-radius:14px;border:1px solid var(--bd);background:#fff;cursor:zoom-in}
.imgb{border:1.5px solid var(--bd);background:var(--card);border-radius:99px;padding:5px 14px;font-weight:800;font-size:14px;cursor:pointer}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:20;padding:10px}.zoom img{max-width:100%;max-height:100%;border-radius:10px;background:#fff}
.net{font-size:13px;font-weight:800;color:var(--no)}
.ans button.me{outline:5px solid #fff;box-shadow:0 0 0 9px rgba(0,0,0,.35);transform:scale(1.02)}
.sent{font-size:15px;font-weight:800;color:var(--ok)}
.rank{font-size:58px;font-weight:900;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
</style>
</head>
<body>
<div class="top"><span id="tName">🎮 משחק חי</span><span class="net" id="net" hidden>📶 חיבור חלש…</span><button class="snd" id="sndB" onclick="toggleSnd()" title="צליל בלחיצה על תשובה"></button><span class="sc" id="tScore" hidden>0</span></div>
<main id="M"></main>
<script>
/* מסך השחקן: נכנסים עם קוד משחק ושם, ומקבלים מהסקריפט (forms-script.gs) את מצב המשחק כל שנייה וקצת */
/* סקריפט המשחק (game-script.gs) – פרויקט נפרד מהטפסים */
const CLOUD='https://script.google.com/macros/s/AKfycbyAdq-zplTeoIv1OPqxSOmbykpNM_7lRFtQ1fBcP0q0R0Abr4Qhk9a1G6nomO8k1EF_MA/exec';
const $=id=>document.getElementById(id),M=$('M');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SH=['א','ב','ג','ד'];
let pin=new URLSearchParams(location.search).get('pin')||'',pid='',me='',st=null,timer=0,shown='',off=0,busy=false,polling=0,lastOk=Date.now(),pend=null,qShown=0;
const ss=(k,v)=>{try{v===undefined?0:sessionStorage.setItem(k,v);return sessionStorage.getItem(k)}catch(e){return null}};
function api(o){return fetch(CLOUD,{method:'POST',body:JSON.stringify(o)}).then(r=>r.json())}

function joinView(msg){
  if(!CLOUD){M.innerHTML='<div class="box"><h1>🎮 המשחק עוד לא מוכן</h1><p>נסו שוב בקרוב</p></div>';return}
  M.innerHTML=`<div class="box"><h1>🎮 הצטרפות למשחק</h1>
    <input class="fld" id="pin" inputmode="numeric" maxlength="6" placeholder="קוד משחק" value="${esc(pin)}">
    <input class="fld" id="nm" maxlength="20" placeholder="השם שלך" value="${esc(localStorage.getItem('game_name')||'')}">
    <input class="fld" id="ph" type="tel" inputmode="numeric" maxlength="10" placeholder="מס' כונן" value="${esc(localStorage.getItem('game_phone')||'')}" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
    <div class="mid" style="font-size:13px;margin:-4px 0 10px">מס' הכונן מגיע רק למארח של המשחק</div>
    <button class="go" id="jb" onclick="join()">כניסה ←</button><p class="err" id="er">${esc(msg||'')}</p></div>`;
  (pin?$('nm'):$('pin')).focus();
  $('ph').onkeyup=e=>{if(e.key==='Enter')join()};
}
async function join(){
  const p=$('pin').value.replace(/\D/g,''),n=$('nm').value.trim();
  if(p.length!==6){$('er').textContent='קוד המשחק הוא 6 ספרות';return}
  if(!n){$('er').textContent='נא לכתוב שם';return}
  const ph=$('ph').value.replace(/\D/g,'');
  if(ph.length<1||ph.length>10){$('er').textContent='נא לכתוב מס\' כונן';return}
  $('jb').disabled=true;$('jb').textContent='נכנס…';
  try{
    const r=await api({action:'g_join',pin:p,name:n,phone:ph});
    if(!r.ok){$('er').textContent=r.error==='nogame'?'לא נמצא משחק עם הקוד הזה':r.error;$('jb').disabled=false;$('jb').textContent='כניסה ←';return}
    pin=p;pid=r.pid;me=r.name;try{localStorage.setItem('game_name',n);localStorage.setItem('game_phone',ph);sessionStorage.setItem('game_'+pin,JSON.stringify({pid,me}));localStorage.setItem('game_last',JSON.stringify({pin,pid,me,t:Date.now()}))}catch(e){}
    history.replaceState(null,'','?pin='+pin);start();
  }catch(e){$('er').textContent='אין חיבור לאינטרנט';$('jb').disabled=false;$('jb').textContent='כניסה ←'}
}
function start(){$('tName').textContent='👤 '+me;$('tScore').hidden=false;wait('אתה בפנים! 🎉','מחכים שהמשחק יתחיל…');poll();if(!polling)polling=setInterval(poll,1200)}
/* קליטה חלשה: אם לא הגיעה תשובה מהשרת כמה שניות, מציגים סימון למעלה */
setInterval(()=>{$('net').hidden=!pid||Date.now()-lastOk<5000},1000);
async function poll(){
  if(busy)return;busy=true;
  try{const r=await api({action:'g_state',pin,pid});lastOk=Date.now();
    if(r.ok&&r.kicked){kicked();busy=false;return}
    if(r.ok){off=r.now-Date.now();st=r;draw()}else if(r.error==='nogame'){try{localStorage.removeItem('game_last')}catch(e){}wait('המשחק הסתיים','אפשר לסגור את הדף')}}catch(e){}
  busy=false;
}
function kicked(){
  clearInterval(polling);polling=0;try{sessionStorage.removeItem('game_'+pin);localStorage.removeItem('game_last')}catch(e){}pid='';$('tScore').hidden=true;$('tName').textContent='🎮 משחק חי';
  M.innerHTML=`<div class="big">יצאת מהמשחק</div><div class="mid">המארח הוציא אותך מהמשחק</div><button class="go" style="max-width:380px" onclick="joinView()">להצטרף שוב</button>`;shown='';
}
function wait(a,b){shown='';M.innerHTML=`<div class="big">${a}</div><div class="mid">${b}</div><div class="spin"></div>`}
function draw(){
  $('tScore').textContent=st.score.toLocaleString('he-IL');
  if(st.name&&st.name!==me){me=st.name;$('tName').textContent='👤 '+me;try{sessionStorage.setItem('game_'+pin,JSON.stringify({pid,me}))}catch(e){}}
  if(/uh|הצלה|אופנוע/.test(st.title||''))document.body.classList.add('uh');
  const key=st.phase+':'+st.q+':'+(st.answered?1:0)+(st.phase==='question'?':'+st.qStart:'');
  if(st.closed){if(shown!=='closed'){shown='closed';clearInterval(timer);document.body.classList.remove('hot');try{localStorage.removeItem('game_last')}catch(e){}M.innerHTML='<div class="big">המשחק נסגר</div><div class="mid">המארח סגר את המשחק</div>'}return}
  if(st.phase==='lobby'){if(shown!=='lobby'){shown='lobby';M.innerHTML=`<div class="big">אתה בפנים! 🎉</div><div class="mid">רואים את השם שלך על המסך?<br>מחכים שהמשחק יתחיל…</div><div class="spin"></div>`}return}
  if(st.phase==='question'){
    const tl=()=>Math.min(st.qStart+st.dur*1000,st.until||Infinity)-(Date.now()+off); // כמה זמן עוד אפשר לשנות תשובה
    if(st.answered&&!(changing===st.q&&tl()>0&&st.chg!==false)){if(shown!==key){shown=key;pend=null;M.innerHTML=`<span class="timer" id="tm"></span><div class="big">✓ התשובה התקבלה</div>${mine()}${st.chg!==false?`<button class="go" id="chg" style="max-width:380px;background:#fff;color:var(--pr);border:2px solid var(--pr);box-shadow:none" onclick="changeAns()">🔄 שינוי תשובה</button><div class="mid" id="chgT"></div>`:'<div class="mid">מחכים לשאר השחקנים…</div>'}<div class="spin"></div>`;clearInterval(timer);timer=setInterval(tick,250);tick()}return}
    if(pend&&pend.q===st.q)return; // התשובה עדיין בדרך לשרת
    if(shown!==key+(changing===st.q?':c':'')){shown=key+(changing===st.q?':c':'');if(changing!==st.q)qShown=Date.now();
      M.innerHTML=`<span class="timer" id="tm"></span><div class="qt">${esc(st.text)}</div>${st.img?`<div class="pimg"><img id="qimg" src="${esc(st.img)}" alt="" onclick="zoomImg(this.src)" ${showImg?'':'hidden'}><button class="imgb" id="imgb" onclick="toggleImg()">${showImg?'🖼 הסתר תמונה':'🖼 הצג תמונה'}</button></div>`:''}${changing===st.q?'<div class="mid" id="chgH">בחר תשובה חדשה</div>':''}<div class="ans">${st.ch.map((c,i)=>`<button class="c${i}${changing===st.q&&myC()===i?' me':''}" onclick="answer(${i})"><span class="s">${SH[i]}</span>${esc(c)}</button>`).join('')}</div>`;
      clearInterval(timer);timer=setInterval(tick,250);tick()}
    return;
  }
  clearInterval(timer);document.body.classList.remove('hot');
  if(shown===key)return;shown=key;
  pend=null;const L=st.last||{none:true};
  if(st.phase==='reveal'){
    M.innerHTML=L.none?`<div class="res no"><div class="ic">⌛</div><div class="big">לא ענית בזמן</div></div>`:
      `<div class="res ${L.ok?'ok':'no'}"><div class="ic">${L.ok?'✓':'✗'}</div><div class="big">${L.ok?'נכון!':'לא נכון'}</div><div class="pts">+${L.p}</div></div>`;
    M.innerHTML+=`<div class="mid">אתה במקום <b>${st.rank}</b> מתוך ${st.players}</div>`;
    if(st.rimg&&showImg)M.insertAdjacentHTML('beforeend',`<div class="pimg"><img src="${esc(st.rimg)}" alt="" onclick="zoomImg(this.src)"></div>`);
    if(L.ok&&window.confetti)confetti({particleCount:90,spread:75,origin:{y:.35}});
    if(st.buzz&&!L.ok&&!L.none)buzz();
  }else if(st.phase==='leader'){M.innerHTML=`<div class="mid">המקום שלך</div><div class="rank">${st.rank}</div><div class="mid">${st.score.toLocaleString('he-IL')} נקודות</div><div class="mid">מחכים לשאלה הבאה…</div>`}
  else if(st.phase==='end'){if(st.rank<=3&&window.confetti)confetti({particleCount:150,spread:100,origin:{y:.4}});M.innerHTML=examBlock()+`<div class="big">${st.rank===1?'🏆 ניצחת!':st.rank<=3?'🥈 על הפודיום!':'סוף המשחק'}</div><div class="mid">המקום שלך</div><div class="rank">${st.rank}</div><div class="mid">${st.score.toLocaleString('he-IL')} נקודות · מתוך ${st.players} שחקנים</div>`}
}

/* 5 השניות האחרונות: צפצוף בכל שנייה, המספר מתנפח ורקע אדום מהבהב */
let ac=null;
/* צליל: אם הטלפון על שקט/רטט אפשר לכבות כאן. באייפון מתג השקט מנמיך לבד את הצליל */
let snd=true;try{snd=localStorage.getItem('game_snd')!=='0'}catch(e){}
function sndLbl(){const b=$('sndB');if(b)b.textContent=snd?'🔊':'🔇'}
function toggleSnd(){snd=!snd;try{localStorage.setItem('game_snd',snd?'1':'0')}catch(e){}sndLbl();if(snd)pick2()}
function pick2(){beep(660,.08);setTimeout(()=>beep(880,.1),90)}
function beep(f,d){if(!snd)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.18,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d)}catch(e){}}
/* צליל טעות (חצוצרה עצובה) + רטט (כשהמארח הפעיל "צליל טעות"). מתנגן גם אם השחקן השתיק את הצפצופים */
function buzz(){try{navigator.vibrate&&navigator.vibrate([450,150,450,150,450,150,1200])}catch(e){}
  /* "חצוצרה עצובה": וואה-וואה-וואה-וואאאה, ארבעה צלילים יורדים לאט, האחרון ארוך ורועד */
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const t0=ac.currentTime+.05,m=ac.createGain();m.gain.value=.65;m.connect(ac.destination);
    [[293.7,0,.6],[277.2,.65,.6],[261.6,1.3,.6],[246.9,1.95,1.7]].forEach(([f,d,len],i)=>{const t=t0+d,last=i===3;
      const lp=ac.createBiquadFilter();lp.type='lowpass';lp.Q.value=4;lp.frequency.setValueAtTime(400,t);lp.frequency.linearRampToValueAtTime(2400,t+.15);lp.frequency.linearRampToValueAtTime(900,t+len);lp.connect(m);
      const g=ac.createGain();g.connect(lp);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.55,t+.08);g.gain.setValueAtTime(.5,t+len-.25);g.gain.linearRampToValueAtTime(0,t+len);
      [1,1.004].forEach(k=>{const o=ac.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f*k,t);o.frequency.linearRampToValueAtTime(f*k*.985,t+len);
        if(last){o.frequency.linearRampToValueAtTime(f*k*.94,t+len);const v=ac.createOscillator(),vg=ac.createGain();v.frequency.value=5.5;vg.gain.setValueAtTime(0,t);vg.gain.linearRampToValueAtTime(f*.03,t+.5);v.connect(vg);vg.connect(o.frequency);v.start(t);v.stop(t+len+.05)}
        o.connect(g);o.start(t);o.stop(t+len+.05)})})}catch(e){}}
/* פתיחת הצליל בלחיצה הראשונה (הטלפון לא מאפשר צליל בלי לחיצה קודמת) */
document.addEventListener('pointerdown',()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}},true);
let lastTick=-1;
function hot(left){
  const t=$('tm');document.body.classList.toggle('hot',left>0&&left<=5);
  if(t)t.classList.toggle('hotn',left>0&&left<=5);
  if(left>0&&left<=5&&left!==lastTick){lastTick=left;beep(left===1?880:660,.18);try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}
  if(left===0&&lastTick!==0){lastTick=0;beep(300,.5);document.body.classList.remove('hot')}
  if(left>5)lastTick=-1;
}
function tick(){const left=Math.max(0,Math.ceil((st.qStart+st.dur*1000-(Date.now()+off))/1000));const t=$('tm');if(t)t.textContent='⏱ '+left;hot(left);const b=$('chg'),ct=$('chgT'),cl=Math.ceil(chgLeft()/1000);
  if(b){if(cl<=0){b.remove();if(ct)ct.textContent='מחכים לשאר השחקנים…'}else if(ct)ct.textContent='אפשר לשנות עוד '+cl+' שניות'}
  if(changing===st.q&&!pend){const h=$('chgH');if(cl<=0){changing=-1;shown='';draw();return}if(h)h.textContent='בחר תשובה חדשה · עוד '+cl+' שניות'}if(!left)clearInterval(timer)}
/* התמונה של השאלה: אפשר להסתיר (חוסך אינטרנט ומקום), והבחירה נשמרת. לחיצה על התמונה מגדילה אותה */
let showImg=true;try{showImg=localStorage.getItem('game_img')!=='0'}catch(e){}
function toggleImg(){showImg=!showImg;try{localStorage.setItem('game_img',showImg?'1':'0')}catch(e){}
  const i=$('qimg'),b=$('imgb');if(i)i.hidden=!showImg;if(b)b.textContent=showImg?'🖼 הסתר תמונה':'🖼 הצג תמונה'}
function zoomImg(src){const z=document.createElement('div');z.className='zoom';z.onclick=()=>z.remove();z.innerHTML='<img src="'+src+'" alt="">';document.body.append(z)}
/* מבחן: בסוף המשחק השחקן רואה אם עבר, ומי שנכשל יכול להירשם לבחינה חוזרת (10 שאלות אחרות) */
function rtUrl(code){return new URL('retake.html?c='+code,location.href).href}
function examBlock(){
  const e=st.exam;if(!e)return '';
  if(e.pass)return `<div class="res ok"><div class="ic">✓</div><div class="big">עברת את המבחן!</div><div class="pts">${e.c} נכונות מתוך ${e.n}</div></div><button class="go" style="max-width:380px;background:#fff;color:var(--pr);border:2px solid var(--pr);box-shadow:none" onclick="dbdCert({name:me,title:st.title,score:'${e.c} תשובות נכונות מתוך ${e.n}',id:pin+'-'+pid})">🎓 תעודת עובר</button>`;
  return `<div class="res no"><div class="ic">✗</div><div class="big">לא עברת הפעם</div><div class="pts">${e.c} נכונות מתוך ${e.n}</div><div style="margin-top:8px;font-weight:700">צריך לפחות ${e.need} נכונות</div></div>`+
    (e.retake?(e.code?regHtml(e.code):`<div class="box" id="rtb"><b>רוצה לנסות שוב?</b><div class="mid" style="margin:6px 0 10px">בחינה חוזרת של 10 שאלות אחרות</div><button class="go" onclick="regRetake()">📝 אני רוצה לבצע בחינה חוזרת</button><p class="err" id="rter"></p></div>`):'');
}
function regHtml(code){
  const u=rtUrl(code);
  return `<div class="box" id="rtb"><b>נרשמת לבחינה חוזרת ✓</b><div class="mid" style="margin:6px 0 10px">10 שאלות אחרות. אפשר לעשות את זה עכשיו או אחר כך מהקישור הזה:</div>
    <a class="go" style="display:block;text-decoration:none" href="${esc(u)}">▶ התחל בחינה עכשיו</a>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap"><button class="imgb" onclick="copyRt('${esc(u)}')" id="cpb">📋 העתק קישור</button><a class="imgb" style="text-decoration:none;color:inherit" target="_blank" href="https://wa.me/?text=${encodeURIComponent('הבחינה החוזרת שלי: '+u)}">שלח לעצמי בוואטסאפ</a></div>
    <div class="mid" style="margin-top:10px;font-size:14px">קוד: <b style="letter-spacing:2px">${esc(code)}</b></div></div>`;
}
async function regRetake(){
  const er=$('rter');if(er)er.textContent='נרשם…';
  try{const r=await api({action:'g_retake',pin,pid});
    if(r.ok){$('rtb').outerHTML=regHtml(r.code)}else if(er)er.textContent=r.error||'לא הצליח, נסה שוב'}
  catch(e){if(er)er.textContent='אין חיבור, נסה שוב'}
}
function copyRt(u){try{navigator.clipboard.writeText(u).then(()=>{const b=$('cpb');if(b)b.textContent='✓ הועתק'})}catch(e){prompt('העתק את הקישור',u)}}
let changing=-1;
function myC(){return pend?pend.c:(window._mc&&_mc.q===st.q?_mc.c:(st.ac!=null?st.ac:-1))}
/* שינוי תשובה: חוזרים למסך התשובות כל עוד הזמן רץ; התשובה החדשה מחליפה את הקודמת */
function chgLeft(){return Math.min(st.qStart+st.dur*1000,st.until||Infinity)-(Date.now()+off)}
function changeAns(){if(chgLeft()<=0)return;changing=st.q;shown='';draw()}
function mine(){const c=myC();return c>=0&&st.ch?`<div class="qt c${c}" style="border-inline-start:6px solid var(--c)">${SH[c]} · ${esc(st.ch[c])}</div>`:''}
/* שליחת תשובה עם אישור קבלה: אם הקליטה חלשה מנסים שוב (השרת מתעלם מכפילויות).
   הזמן נמדד בטלפון מהרגע שהשאלה הופיעה, כדי שמי שהאינטרנט שלו איטי לא יפסיד נקודות */
async function answer(i){
  if(pend)return;
  pick2();try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}
  const el=Date.now()-Math.max(qShown,st.qStart-off);
  pend={q:st.q,c:i,el};window._mc={q:st.q,c:i};
  M.innerHTML=`<div class="big">שולח את התשובה…</div>${mine()}<div class="mid" id="snd"></div><div class="spin"></div>`;
  for(let k=0;k<8&&pend&&pend.q===st.q&&st.phase==='question';k++){
    if(k){const s=$('snd');if(s)s.textContent='📶 הקליטה חלשה, מנסה שוב ('+k+')…';await new Promise(r=>setTimeout(r,Math.min(4000,700*k)))}
    try{const r=await api({action:'g_answer',pin,pid,c:i,el});lastOk=Date.now();
      if(!pend)return;
      if(!r.ok&&r.error==='late'){pend=null;shown=st.phase+':'+st.q+':1';M.innerHTML=`<div class="big">הזמן נגמר ⌛</div><div class="spin"></div>`;return}
      if(r.ok){st.answered=true;st.ac=i;if(r.until)st.until=r.until;changing=-1;shown='';pend=null;draw();return}
    }catch(e){}
  }
  if(pend){pend=null;shown='';draw()} // לא הצליח – מציגים שוב את התשובות כדי לנסות שוב
}
/* חזרה למשחק: אם האינטרנט נפל או הדף נסגר, השחקן חוזר לאותו משחק עם אותו שם והנקודות שלו (שמורים במכשיר ל-6 שעות) */
function lastGame(){try{const l=JSON.parse(localStorage.getItem('game_last'));return l&&l.pid&&Date.now()-l.t<6*3600e3?l:null}catch(e){return null}}
function backBtn(){
  const l=lastGame();if(!l||(pin&&pin!==l.pin))return;
  M.insertAdjacentHTML('afterbegin',`<div class="box"><h1 style="font-size:20px">חזרה למשחק</h1><div class="mid">${esc(l.me)} · קוד ${l.pin}</div><button class="go" style="margin-top:10px" onclick="resumeGame()">↩ חזור למשחק שלי</button></div>`);
}
function resumeGame(){const l=lastGame();if(!l)return;pin=l.pin;pid=l.pid;me=l.me;try{sessionStorage.setItem('game_'+pin,JSON.stringify({pid,me}))}catch(e){}history.replaceState(null,'','?pin='+pin);start()}
sndLbl();
(function(){
  let s=null;try{s=JSON.parse(sessionStorage.getItem('game_'+pin))}catch(e){}
  if(pin&&s&&s.pid){pid=s.pid;me=s.me;start();return}
  const l=lastGame();
  if(l&&(!pin||pin===l.pin)){resumeGame();return} // אותו משחק – חוזרים אוטומטית
  joinView();backBtn();
})();
</script>
</body>
</html>
