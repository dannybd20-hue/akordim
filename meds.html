<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<script>try{if(sessionStorage.getItem('gate_meds')!=='1'){document.documentElement.style.display='none';location.replace('./?open=meds')}}catch(e){location.replace('./')}
function goHome(){try{sessionStorage.removeItem('gate_meds')}catch(e){}location.href='./'}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>תרופות בבית</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="icons/apps-192.png">
<link rel="apple-touch-icon" href="icons/apps-apple-180.png">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f4;--card:#fff;--tx:#10231f;--mut:#5b7570;--bd:#dbe6e3;--pr:#0f766e;--pr2:#14b8a6;--ok:#16a34a;--warn:#ea580c;--no:#dc2626;--yl:#ca8a04;--sh:0 6px 22px #0f172a12}
:root[data-theme=dark]{--bg:#0b1513;--card:#122320;--tx:#e6f4f1;--mut:#8fb0aa;--bd:#22403b;--sh:0 6px 22px #0006}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1513;--card:#122320;--tx:#e6f4f1;--mut:#8fb0aa;--bd:#22403b;--sh:0 6px 22px #0006}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Heebo,system-ui,sans-serif;min-height:100vh;padding-bottom:96px}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:12px 16px 10px;box-shadow:0 4px 18px #0f766e55}
.hrow{display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:21px;font-weight:900;flex:1}
.hb{border:0;background:#ffffff26;color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:14px}
.sum{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.chip{flex:none;border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px;background:#ffffff26;border:0;color:#fff;cursor:pointer}
.chip.on{background:#fff;color:#0f766e}
main{max-width:720px;margin:0 auto;padding:12px 14px}
.bar{display:flex;gap:8px;margin-bottom:10px}
.bar input{flex:1;border:1.5px solid var(--bd);background:var(--card);border-radius:14px;padding:11px 14px;outline:none}
.bar input:focus{border-color:var(--pr)}
.locs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.lc{flex:none;border:1.5px solid var(--bd);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;cursor:pointer}
.lc.on{background:var(--pr);border-color:var(--pr);color:#fff}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:var(--sh);cursor:pointer;border-inline-start:6px solid var(--ok)}
.card.w{border-inline-start-color:var(--yl)}.card.o{border-inline-start-color:var(--warn)}.card.x{border-inline-start-color:var(--no)}
.th{flex:none;width:68px;height:68px;border-radius:14px;background:#e2efec center/cover;display:flex;align-items:center;justify-content:center;font-size:30px}
.ci{flex:1;min-width:0}
.ci b{display:block;font-size:17px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci small{display:block;color:var(--mut);font-size:13px;direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.tag{border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;background:#e2efec;color:#0b4f48}
:root[data-theme=dark] .tag{background:#1b3a35;color:#b8e6df}
.tag.ok{background:#dcfce7;color:#166534}.tag.w{background:#fef9c3;color:#854d0e}.tag.o{background:#ffedd5;color:#9a3412}.tag.x{background:#fee2e2;color:#991b1b}
.empty{text-align:center;color:var(--mut);padding:50px 10px;line-height:1.7}
.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));inset-inline-start:18px;width:62px;height:62px;border-radius:50%;border:0;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;font-size:34px;line-height:1;box-shadow:0 10px 26px #0f766e66;cursor:pointer;z-index:25}
dialog{border:0;border-radius:22px;padding:0;width:min(560px,96vw);max-height:92vh;background:var(--card);color:var(--tx);box-shadow:0 20px 60px #0008}
dialog::backdrop{background:#0009}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.dh b{font-size:18px;font-weight:900}
.x{border:0;background:var(--bg);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
.db{padding:4px 16px 16px;overflow:auto;max-height:calc(92vh - 130px)}
label.f{display:block;font-weight:700;font-size:13.5px;margin:12px 0 5px;color:var(--mut)}
.in{width:100%;border:1.5px solid var(--bd);background:var(--bg);border-radius:12px;padding:10px 12px;outline:none}
.in:focus{border-color:var(--pr)}
textarea.in{min-height:70px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.sg{border:1.5px solid var(--bd);background:var(--bg);border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:14px}
.sg.on{background:var(--pr);border-color:var(--pr);color:#fff}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer;background:var(--pr);color:#fff;font-size:15px}
.btn.s{background:var(--bg);color:var(--tx);border:1.5px solid var(--bd)}
.btn.d{background:#fee2e2;color:#991b1b}
.btn.b{width:100%}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.acts .btn{flex:1;min-width:120px}
.photo{display:flex;gap:12px;align-items:center;margin-top:6px}
.pv{flex:none;width:110px;height:110px;border-radius:16px;background:#e2efec center/cover;display:flex;align-items:center;justify-content:center;font-size:40px;border:1.5px dashed var(--bd)}
.ai{background:#ecfeff;border:1px solid #a5f3fc;color:#155e75;border-radius:12px;padding:9px 12px;margin-top:10px;font-size:13.5px;line-height:1.5}
:root[data-theme=dark] .ai{background:#0e2a30;border-color:#1c5560;color:#a5eef7}
.big{width:100%;border-radius:16px;max-height:260px;object-fit:contain;background:#e2efec;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:15px}
.kv span:first-child{color:var(--mut)}
.desc{background:var(--bg);border-radius:12px;padding:10px 12px;margin:10px 0;line-height:1.55;font-size:15px}
.note{font-size:12.5px;color:var(--mut);margin-top:8px;line-height:1.5}
.log{font-size:13.5px;color:var(--mut);margin-top:6px}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#10231f;color:#fff;border-radius:999px;padding:10px 18px;font-weight:700;z-index:50;display:none;max-width:90vw;text-align:center}
.spin{width:22px;height:22px;border:3px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.login{max-width:360px;margin:60px auto;text-align:center}
@media print{header,.fab,.locs,.bar{display:none}}
</style>
</head>
<body>
<header>
  <div class="hrow"><button class="hb" onclick="goHome()">→ דף הבית</button><h1>💊 תרופות בבית</h1><button class="hb" id="mm" title="מיקומים">📍</button></div>
  <div class="sum" id="sum"></div>
</header>
<main id="M"><div class="empty">טוען…</div></main>
<button class="fab" id="fab" title="הוספת תרופה" aria-label="הוספת תרופה">＋</button>

<!-- הוספה / עריכה -->
<dialog id="ed">
  <div class="dh"><b id="edt">תרופה חדשה</b><button class="x" onclick="$('ed').close()">✕</button></div>
  <div class="db">
    <div class="photo">
      <div class="pv" id="pv">💊</div>
      <div style="flex:1;display:flex;flex-direction:column;gap:8px">
        <button class="btn" onclick="$('fcam').click()">📷 צילום האריזה</button>
        <button class="btn s" onclick="$('fgal').click()">🖼️ מהגלריה</button>
      </div>
    </div>
    <input type="file" id="fcam" accept="image/*" capture="environment" hidden>
    <input type="file" id="fgal" accept="image/*" hidden>
    <div class="ai" id="aiMsg" hidden></div>
    <label class="f">שם בעברית</label><input class="in" id="fhe" placeholder="למשל: אקמול 500 מ״ג">
    <label class="f">שם באנגלית</label><input class="in" id="fen" dir="ltr" style="text-align:right" placeholder="e.g. Acamol 500 mg">
    <label class="f">מה זה ולמה משתמשים</label><textarea class="in" id="fdesc" placeholder="הסבר קצר"></textarea>
    <label class="f">איפה זה נמצא</label>
    <div class="row"><select class="in" id="floc"></select><input class="in" id="floc2" placeholder="שם מקום חדש" hidden></div>
    <label class="f">סוג</label>
    <div class="seg" id="ftype"></div>
    <label class="f">תאריך תפוגה (כפי שמודפס על האריזה)</label><input class="in" type="date" id="fexp">
    <div id="qtyBox">
      <label class="f" id="qtyL">כמות שנשארה</label>
      <div class="row"><input class="in" type="number" inputmode="decimal" min="0" id="fqty" placeholder="כמות"><input class="in" id="funit" placeholder="יחידה (טבליות, מ״ל…)"></div>
      <label class="f">להתריע כשנשאר עד (אופציונלי)</label><input class="in" type="number" inputmode="decimal" min="0" id="flow" placeholder="למשל 4">
    </div>
    <div id="openBox">
      <label class="f">תאריך פתיחה (למוצר שנפתח)</label><input class="in" type="date" id="fopen">
      <label class="f">תוקף אחרי פתיחה</label>
      <div class="row"><input class="in" type="number" inputmode="decimal" min="0" id="faftN" placeholder="מספר"><select class="in" id="faftU"><option value="m">חודשים</option><option value="d">ימים</option></select></div>
      <div class="note">התוקף שנספר הוא המוקדם מבין התוקף שעל האריזה לבין תאריך הפתיחה + התקופה הזאת.</div>
    </div>
    <label class="f">הערה</label><input class="in" id="fnote" placeholder="אופציונלי">
    <div class="acts"><button class="btn" id="fsave">שמירה</button><button class="btn d" id="fdel" hidden>מחיקה</button></div>
    <div class="note">מידע על התרופה הוא כללי בלבד ולא תחליף לייעוץ רפואי או להוראות האריזה.</div>
  </div>
</dialog>

<!-- פרטי תרופה -->
<dialog id="dt">
  <div class="dh"><b id="dtt"></b><button class="x" onclick="$('dt').close()">✕</button></div>
  <div class="db" id="dtb"></div>
</dialog>

<!-- מיקומים -->
<dialog id="lcd">
  <div class="dh"><b>📍 מיקומים</b><button class="x" onclick="$('lcd').close()">✕</button></div>
  <div class="db"><div id="lcl"></div><div class="row" style="margin-top:10px"><input class="in" id="lcn" placeholder="מקום חדש (למשל: ארון בסלון)"><button class="btn" style="flex:none" onclick="addLoc()">הוספה</button></div></div>
</dialog>
<div id="toast"></div>

<script src="presence.js"></script><script>dbdPresence('meds')</script>
<script>
const CLOUD='https://script.google.com/macros/s/AKfycbw_ZAnKnbqY_G0pRA186ylvFoUOpEVtL9rHYEDJGtfmcX2eYlAzIIamDschjgnKCXtuXw/exec';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lg=k=>{try{return localStorage.getItem(k)||''}catch(e){return''}};
const lp=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const sg=k=>{try{return sessionStorage.getItem(k)||''}catch(e){return''}};
const TYPES={pills:['💊','כדורים / כמוסות'],liquid:['🧴','נוזל / טיפות'],cream:['🧴','משחה / קרם'],other:['📦','אחר']};
const DEF_LOCS=['מטבח','שירותי הורים','שירותי ילדים'];
let items=[],locs=DEF_LOCS.slice(),pw='',ai=null,fLoc='',fSt='',q='',cur=null,photoNew='',thNew='',queue=[];
try{items=JSON.parse(lg('meds_items')||'[]');locs=JSON.parse(lg('meds_locs')||'null')||locs;queue=JSON.parse(lg('meds_queue')||'[]')}catch(e){}

/* ---------- תאריכים ---------- */
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const todayMs=()=>{const n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())};
const dMs=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?Date.UTC(+m[1],+m[2]-1,+m[3]):null};
const fmt=ms=>{const d=new Date(ms);return String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/'+d.getUTCFullYear()};
function eff(it){
  let e=dMs(it.exp);const o=dMs(it.opened);
  if(o!=null&&it.aft&&+it.aft.n>0){const d=new Date(o);if(it.aft.u==='d')d.setUTCDate(d.getUTCDate()+Math.round(+it.aft.n));else d.setUTCMonth(d.getUTCMonth()+Math.round(+it.aft.n));if(e==null||d.getTime()<e)e=d.getTime()}
  return e;
}
function st(it){ /* סטטוס תוקף */
  const e=eff(it);if(e==null)return{k:'ok',t:'ללא תוקף',days:null,e:null};
  const days=Math.round((e-todayMs())/864e5);
  if(days<0)return{k:'x',t:'פג לפני '+(-days===1?'יום':(-days)+' ימים'),days,e};
  if(days===0)return{k:'x',t:'פג היום',days,e};
  if(days<=7)return{k:'o',t:'עוד '+(days===1?'יום':days+' ימים'),days,e};
  if(days<=30)return{k:'w',t:'עוד '+days+' ימים',days,e};
  return{k:'ok',t:'עד '+fmt(e).slice(3),days,e};
}

/* ---------- ענן ---------- */
function toast(t,ms){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms||2600)}
async function api(o){
  const r=await fetch(CLOUD,{method:'POST',body:JSON.stringify(Object.assign({app:'meds',password:pw},o))}).then(r=>r.json());
  return r;
}
function saveLocal(){lp('meds_items',JSON.stringify(items));lp('meds_locs',JSON.stringify(locs));lp('meds_queue',JSON.stringify(queue))}
function apply(r){
  if(!r||!r.ok)return;
  if(r.items)items=r.items;if(r.locs)locs=r.locs;if(r.ai!==undefined)ai=r.ai;saveLocal();
}
async function flush(){
  while(queue.length){
    const o=queue[0];let r;
    try{r=await api(o)}catch(e){return false}
    if(r&&r.error==='password'){await needLogin('הסיסמה לא נכונה');return false}
    if(!r||!r.ok)return false;
    queue.shift();saveLocal();
    if(o.op==='save'&&r.item){const i=items.findIndex(x=>x.id===o.item.id||x.id===r.item.id);if(i>=0)items[i]=Object.assign(items[i],{ph:r.item.ph,id:r.item.id});saveLocal()}
  }
  return true;
}
async function sync(){
  if(!pw)return;
  if(!(await flush()))return;
  try{const r=await api({op:'list'});
    if(r.error==='password'){await needLogin('הסיסמה לא נכונה');return}
    if(r.error==='locked'){toast('🔒 יותר מדי ניסיונות. נסה שוב בעוד רבע שעה');return}
    apply(r);render()}catch(e){}
}
function push(o){queue.push(o);saveLocal();flush().then(ok=>{if(ok)sync();else toast('נשמר במכשיר, יסונכרן כשיהיה חיבור',3200)})}

/* ---------- כניסה ---------- */
function needLogin(msg){
  return new Promise(res=>{
    $('M').innerHTML=`<div class="login"><h2>💊 תרופות בבית</h2><p class="note">הקלד את הסיסמה הראשית</p><input class="in" id="lpw" type="password" autocomplete="current-password" style="text-align:center;font-size:20px"><p style="color:var(--no);font-weight:700;min-height:22px">${esc(msg||'')}</p><button class="btn b" id="lgo">כניסה</button></div>`;
    $('lpw').focus();
    const go=async()=>{const v=$('lpw').value.trim();if(!v)return;pw=v;lp('meds_pw',v);$('M').innerHTML='<div class="empty">מתחבר…</div>';await sync();render();res()};
    $('lgo').onclick=go;$('lpw').onkeyup=e=>{if(e.key==='Enter')go()};
  });
}

/* ---------- תצוגה ---------- */
function visible(){
  const k=q.trim().toLowerCase();
  return items.filter(it=>(!fLoc||it.loc===fLoc)&&(!fSt||(fSt==='x'?st(it).k==='x':fSt==='s'?['o','w'].includes(st(it).k):st(it).k===fSt)))
    .filter(it=>!k||[it.he,it.en,it.desc,it.loc,it.note].join(' ').toLowerCase().includes(k))
    .sort((a,b)=>{const x=st(a).e,y=st(b).e;return(x==null)-(y==null)||x-y||String(a.he).localeCompare(String(b.he),'he')});
}
function render(){
  const n={x:0,s:0};items.forEach(it=>{const k=st(it).k;if(k==='x')n.x++;else if(k==='o'||k==='w')n.s++});
  $('sum').innerHTML=`<button class="chip ${!fSt?'on':''}" data-s="">הכול ${items.length}</button><button class="chip ${fSt==='x'?'on':''}" data-s="x">❌ פג תוקף ${n.x}</button><button class="chip ${fSt==='s'?'on':''}" data-s="s">⚠️ עומד לפוג ${n.s}</button>`;
  $('sum').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{fSt=b.dataset.s;render()});
  const used=[...new Set([...locs,...items.map(i=>i.loc).filter(Boolean)])];
  let h=`<div class="bar"><input id="sq" type="search" placeholder="🔎 חיפוש תרופה, מקום או מילה בהסבר" value="${esc(q)}"></div>`;
  h+=`<div class="locs"><button class="lc ${!fLoc?'on':''}" data-l="">הכול</button>${used.map(l=>`<button class="lc ${fLoc===l?'on':''}" data-l="${esc(l)}">${esc(l)} ${items.filter(i=>i.loc===l).length}</button>`).join('')}</div>`;
  const v=visible();
  if(!items.length)h+=`<div class="empty">עוד לא הוספת תרופות.<br>לחץ על ＋ וצלם את האריזה: השם, ההסבר והתוקף יתמלאו לבד.</div>`;
  else if(!v.length)h+=`<div class="empty">לא נמצאו תרופות.</div>`;
  h+=v.map(it=>{const s=st(it),t=TYPES[it.type]||TYPES.other;
    return `<div class="card ${s.k==='ok'?'':s.k}" data-id="${esc(it.id)}"><div class="th" style="${it.th?`background-image:url(${it.th})`:''}">${it.th?'':t[0]}</div>
    <div class="ci"><b>${esc(it.he||it.en||'תרופה')}</b>${it.en&&it.he?`<small>${esc(it.en)}</small>`:''}
    <div class="meta"><span class="tag ${s.k}">${s.e!=null?'⏳ '+s.t:s.t}</span><span class="tag">📍 ${esc(it.loc||'ללא מקום')}</span>${it.qty!=null&&it.qty!==''?`<span class="tag ${it.low!=null&&it.low!==''&&+it.qty<=+it.low?'x':''}">${esc(it.qty)} ${esc(it.unit||'')}</span>`:''}${it.opened?'<span class="tag">נפתח</span>':''}</div></div></div>`}).join('');
  $('M').innerHTML=h;
  $('sq').oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();const s=$('sq');s.focus();s.setSelectionRange(p,p)};
  $('M').querySelectorAll('.lc').forEach(b=>b.onclick=()=>{fLoc=b.dataset.l;render()});
  $('M').querySelectorAll('.card').forEach(c=>c.onclick=()=>openDetail(c.dataset.id));
}

/* ---------- פרטים ---------- */
async function openDetail(id){
  const it=items.find(x=>x.id===id);if(!it)return;cur=it;
  const s=st(it),t=TYPES[it.type]||TYPES.other;
  $('dtt').textContent=it.he||it.en||'תרופה';
  const log=(it.log||[]).slice(-5).reverse().map(l=>`<div class="log">• ${esc(l.d)} — ${esc(l.t)}</div>`).join('');
  $('dtb').innerHTML=`${it.th||it.ph?`<img class="big" id="dph" src="${it.th||''}" alt="">`:''}
    ${it.en?`<div style="direction:ltr;text-align:right;color:var(--mut);font-weight:700">${esc(it.en)}</div>`:''}
    ${it.desc?`<div class="desc">${esc(it.desc)}</div>`:''}
    <div class="kv"><span>מיקום</span><b>📍 ${esc(it.loc||'ללא מקום')}</b></div>
    <div class="kv"><span>סוג</span><b>${t[1]}</b></div>
    <div class="kv"><span>תוקף באריזה</span><b>${it.exp?fmt(dMs(it.exp)):'—'}</b></div>
    ${it.opened?`<div class="kv"><span>נפתח</span><b>${fmt(dMs(it.opened))}</b></div>`:''}
    ${it.aft&&it.aft.n?`<div class="kv"><span>תוקף אחרי פתיחה</span><b>${esc(it.aft.n)} ${it.aft.u==='d'?'ימים':'חודשים'}</b></div>`:''}
    <div class="kv"><span>התוקף שנספר</span><b class="tag ${s.k}">${s.e!=null?fmt(s.e)+' · '+s.t:'—'}</b></div>
    ${it.qty!=null&&it.qty!==''?`<div class="kv"><span>כמות שנשארה</span><b>${esc(it.qty)} ${esc(it.unit||'')}</b></div>`:''}
    ${it.note?`<div class="kv"><span>הערה</span><b>${esc(it.note)}</b></div>`:''}
    ${log?`<div style="margin-top:10px;font-weight:800">שימושים אחרונים</div>${log}`:''}
    <div class="acts">
      <button class="btn" onclick="useIt()">${it.type==='pills'||(it.qty!=null&&it.qty!=='')?'💊 נטלתי':'✅ השתמשתי'}</button>
      ${it.type!=='pills'?`<button class="btn s" onclick="openNow()">🧴 פתחתי היום</button>`:''}
      <button class="btn s" onclick="editIt()">✏️ עריכה</button>
    </div>
    <div class="note">מידע כללי בלבד, לא תחליף לייעוץ רפואי.</div>`;
  $('dt').showModal();
  if(it.ph){try{const r=await api({op:'photo',ph:it.ph});if(r.ok&&cur===it&&$('dph'))$('dph').src=r.data}catch(e){}}
}
function logUse(it,txt){it.log=(it.log||[]).concat({d:fmt(todayMs()).slice(0,5),t:txt}).slice(-20)}
function useIt(){
  const it=cur;if(!it)return;
  let txt='השתמשתי';
  if(it.qty!=null&&it.qty!==''){
    const a=prompt('כמה '+(it.unit||'יחידות')+' נטלת?','1');if(a===null)return;
    const n=Number(String(a).replace(',','.'));if(!(n>0))return;
    it.qty=Math.max(0,Math.round((+it.qty-n)*100)/100);txt='נטלתי '+n+' '+(it.unit||'');
    if(it.low!=null&&it.low!==''&&it.qty<=+it.low)toast('⚠️ נשארו '+it.qty+' '+(it.unit||'')+' בלבד',3500);
  }
  logUse(it,txt);saveItem(it);$('dt').close();render();
}
function openNow(){
  const it=cur;if(!it)return;
  it.opened=ymd(new Date());
  if(!(it.aft&&+it.aft.n>0)){const a=prompt('תוקף אחרי פתיחה (בחודשים)? אפשר להשאיר ריק','');if(a&&+a>0)it.aft={n:+a,u:'m'}}
  logUse(it,'נפתח');saveItem(it);$('dt').close();render();
  const s=st(it);toast('התוקף שנספר: '+(s.e!=null?fmt(s.e):'—'));
}
function saveItem(it,photo){
  const copy=JSON.parse(JSON.stringify(it));delete copy.n;
  push({op:'save',item:copy,photo:photo||undefined});
  saveLocal();
}

/* ---------- הוספה / עריכה ---------- */
let ftype='pills';
function drawTypes(){
  $('ftype').innerHTML=Object.entries(TYPES).map(([k,v])=>`<button type="button" class="sg ${ftype===k?'on':''}" data-k="${k}">${v[0]} ${v[1]}</button>`).join('');
  $('ftype').querySelectorAll('.sg').forEach(b=>b.onclick=()=>{ftype=b.dataset.k;drawTypes()});
  $('openBox').hidden=ftype==='pills';
  $('qtyL').textContent=ftype==='pills'?'כמות שנשארה':'כמות שנשארה (אופציונלי)';
  if(!$('funit').value||Object.values(UNITS).includes($('funit').value))$('funit').value=UNITS[ftype]||'';
}
const UNITS={pills:'כדורים',liquid:'מ״ל',cream:'גרם',other:''};
function drawLocs(sel){
  const all=[...new Set([...locs,...items.map(i=>i.loc).filter(Boolean)])];
  $('floc').innerHTML=all.map(l=>`<option>${esc(l)}</option>`).join('')+'<option value="__new">➕ מקום חדש…</option>';
  $('floc').value=sel&&all.includes(sel)?sel:(all[0]||'__new');
  $('floc2').hidden=$('floc').value!=='__new';
}
$('floc').onchange=()=>{$('floc2').hidden=$('floc').value!=='__new';if(!$('floc2').hidden)$('floc2').focus()};
function showAi(t,err){const e=$('aiMsg');e.hidden=!t;e.innerHTML=t||'';e.style.background=err?'#fef2f2':'';e.style.color=err?'#991b1b':'';e.style.borderColor=err?'#fecaca':''}
function openEdit(it){
  cur=it||null;photoNew='';thNew='';showAi('');
  $('edt').textContent=it?'עריכת תרופה':'תרופה חדשה';
  $('fhe').value=it?.he||'';$('fen').value=it?.en||'';$('fdesc').value=it?.desc||'';
  ftype=it?.type||'pills';$('fexp').value=it?.exp||'';$('fqty').value=it?.qty??'';$('funit').value=it?.unit||UNITS[ftype];$('flow').value=it?.low??'';
  $('fopen').value=it?.opened||'';$('faftN').value=it?.aft?.n||'';$('faftU').value=it?.aft?.u||'m';$('fnote').value=it?.note||'';
  $('fdel').hidden=!it;
  const pv=$('pv');pv.style.backgroundImage=it?.th?`url(${it.th})`:'';pv.textContent=it?.th?'':'💊';
  drawLocs(it?.loc||fLoc);drawTypes();$('ed').showModal();
}
function editIt(){$('dt').close();openEdit(cur)}
$('fab').onclick=()=>openEdit(null);

function resize(file,max,qual){
  return new Promise((res,rej)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',qual))};
    img.onerror=()=>{URL.revokeObjectURL(u);rej()};img.src=u;
  });
}
async function onPhoto(e){
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const [big,mid,th]=await Promise.all([resize(f,1400,.82),resize(f,900,.7),resize(f,160,.6)]);
    photoNew=mid;thNew=th;$('pv').style.backgroundImage=`url(${th})`;$('pv').textContent='';
    identify(big);
  }catch(x){showAi('לא הצלחתי לקרוא את התמונה',true)}
}
$('fcam').onchange=onPhoto;$('fgal').onchange=onPhoto;
async function identify(img){
  showAi('<span class="spin" style="border-color:#0e749055;border-top-color:#0e7490"></span> מזהה את התרופה מהתמונה…');
  let r;try{r=await api({op:'identify',image:img})}catch(e){showAi('אין חיבור לאינטרנט, אפשר למלא ידנית',true);return}
  if(!r||!r.ok){
    showAi(r&&r.error==='nokey'?'הזיהוי האוטומטי עוד לא הופעל (חסר מפתח Claude בסקריפט). אפשר למלא ידנית.':r&&r.error==='password'?'הסיסמה לא נכונה':'הזיהוי לא הצליח ('+esc(r?.error||'')+'). אפשר למלא ידנית.',true);return}
  const i=r.info||{};
  if(i.he&&!$('fhe').value)$('fhe').value=i.he;
  if(i.en&&!$('fen').value)$('fen').value=i.en;
  if(i.desc&&!$('fdesc').value)$('fdesc').value=i.desc;
  if(i.type&&TYPES[i.type]){ftype=i.type;$('funit').value=UNITS[ftype]}
  if(i.qty!=null&&i.qty!==''&&!$('fqty').value)$('fqty').value=i.qty;
  if(i.unit)$('funit').value=i.unit;
  if(i.exp&&dMs(i.exp)!=null&&!$('fexp').value)$('fexp').value=i.exp;
  if(i.aft&&+i.aft.n>0&&!$('faftN').value){$('faftN').value=i.aft.n;$('faftU').value=i.aft.u==='d'?'d':'m'}
  drawTypes();
  showAi(i.conf==='low'?'⚠️ הזיהוי לא בטוח, כדאי לבדוק את השדות לפני שמירה.':'✅ הפרטים מולאו מהתמונה. כדאי לבדוק לפני שמירה'+(i.exp?'':' ולהוסיף תאריך תפוגה (לא נראה בתמונה)')+'.');
}
$('fsave').onclick=()=>{
  const he=$('fhe').value.trim(),en=$('fen').value.trim();
  if(!he&&!en){toast('נא להזין שם');return}
  let loc=$('floc').value;if(loc==='__new')loc=$('floc2').value.trim();
  if(loc&&!locs.includes(loc)){locs.push(loc);push({op:'locs',locs})}
  const it=Object.assign({},cur||{id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)});
  it.he=he;it.en=en;it.desc=$('fdesc').value.trim();it.loc=loc;it.type=ftype;it.exp=$('fexp').value;
  const qv=$('fqty').value;it.qty=qv===''?null:Number(qv);it.unit=$('funit').value.trim();
  const lv=$('flow').value;it.low=lv===''?null:Number(lv);
  it.opened=ftype==='pills'?'':$('fopen').value;
  const an=$('faftN').value;it.aft=ftype!=='pills'&&an&&+an>0?{n:+an,u:$('faftU').value}:null;
  it.note=$('fnote').value.trim();
  if(thNew)it.th=thNew;
  const i=items.findIndex(x=>x.id===it.id);if(i>=0)items[i]=it;else items.push(it);
  saveItem(it,photoNew);$('ed').close();render();toast('נשמר ✅');
};
$('fdel').onclick=()=>{
  if(!cur||!confirm('למחוק את "'+(cur.he||cur.en)+'"?'))return;
  items=items.filter(x=>x.id!==cur.id);push({op:'del',id:cur.id});$('ed').close();render();
};

/* ---------- מיקומים ---------- */
$('mm').onclick=()=>{drawLocList();$('lcd').showModal()};
function drawLocList(){
  const n=l=>items.filter(i=>i.loc===l).length;
  $('lcl').innerHTML=locs.map((l,i)=>`<div class="kv"><span>📍 ${esc(l)} <small>(${n(l)})</small></span><button class="btn d" style="padding:4px 12px" onclick="delLoc(${i})">מחיקה</button></div>`).join('')||'<div class="empty">אין מיקומים</div>';
}
function addLoc(){const v=$('lcn').value.trim();if(!v||locs.includes(v))return;locs.push(v);$('lcn').value='';push({op:'locs',locs});drawLocList();render()}
function delLoc(i){const l=locs[i];if(items.some(x=>x.loc===l)&&!confirm('יש תרופות במיקום הזה. המיקום יימחק מהרשימה והן יישארו עם המיקום הישן. להמשיך?'))return;locs.splice(i,1);push({op:'locs',locs});drawLocList();render()}

/* ---------- התחלה ---------- */
(async()=>{
  pw=sg('hub_admin')||lg('hub_admin')||lg('meds_pw');
  render();
  if(!pw){await needLogin('');return}
  await sync();render();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});
})();
</script>
