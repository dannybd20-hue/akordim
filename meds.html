<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<script>try{if(sessionStorage.getItem('gate_meds')!=='1'){document.documentElement.style.display='none';location.replace('./?open=meds')}}catch(e){location.replace('./')}
function goHome(){try{sessionStorage.removeItem('gate_meds')}catch(e){}location.href='./'}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>תרופות בבית</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="icons/apps-192.png">
<link rel="apple-touch-icon" href="icons/apps-apple-180.png">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f4;--card:#fff;--tx:#10231f;--mut:#5b7570;--bd:#dbe6e3;--pr:#0f766e;--pr2:#14b8a6;--ok:#16a34a;--warn:#ea580c;--no:#dc2626;--yl:#ca8a04;--sh:0 6px 22px #0f172a12}
:root[data-theme=dark]{--bg:#0b1513;--card:#122320;--tx:#e6f4f1;--mut:#8fb0aa;--bd:#22403b;--sh:0 6px 22px #0006}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1513;--card:#122320;--tx:#e6f4f1;--mut:#8fb0aa;--bd:#22403b;--sh:0 6px 22px #0006}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Heebo,system-ui,sans-serif;min-height:100vh;padding-bottom:96px}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:12px 16px 10px;box-shadow:0 4px 18px #0f766e55}
.hrow{display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:21px;font-weight:900;flex:1}
.hb{border:0;background:#ffffff26;color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:14px}
.sum{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.chip{flex:none;border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px;background:#ffffff26;border:0;color:#fff;cursor:pointer}
.chip.on{background:#fff;color:#0f766e}
main{max-width:720px;margin:0 auto;padding:12px 14px}
.bar{display:flex;gap:8px;margin-bottom:10px}
.bar input{flex:1;border:1.5px solid var(--bd);background:var(--card);border-radius:14px;padding:11px 14px;outline:none}
.bar input:focus{border-color:var(--pr)}
.locs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.lc{flex:none;border:1.5px solid var(--bd);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;cursor:pointer}
.lc.on{background:var(--pr);border-color:var(--pr);color:#fff}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:var(--sh);cursor:pointer;border-inline-start:6px solid var(--ok)}
.card.w{border-inline-start-color:var(--yl)}.card.o{border-inline-start-color:var(--warn)}.card.x{border-inline-start-color:var(--no)}
.th{flex:none;width:68px;height:68px;border-radius:14px;background:#e2efec center/cover;display:flex;align-items:center;justify-content:center;font-size:30px}
.ci{flex:1;min-width:0}
.ci b{display:block;font-size:17px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci small{display:block;color:var(--mut);font-size:13px;direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.tag{border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;background:#e2efec;color:#0b4f48}
:root[data-theme=dark] .tag{background:#1b3a35;color:#b8e6df}
.tag.ok{background:#dcfce7;color:#166534}.tag.w{background:#fef9c3;color:#854d0e}.tag.o{background:#ffedd5;color:#9a3412}.tag.x{background:#fee2e2;color:#991b1b}
.empty{text-align:center;color:var(--mut);padding:50px 10px;line-height:1.7}
.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));inset-inline-start:18px;width:62px;height:62px;border-radius:50%;border:0;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;font-size:34px;line-height:1;box-shadow:0 10px 26px #0f766e66;cursor:pointer;z-index:25}
dialog{border:0;border-radius:22px;padding:0;width:min(560px,96vw);max-height:92vh;background:var(--card);color:var(--tx);box-shadow:0 20px 60px #0008}
dialog::backdrop{background:#0009}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.dh b{font-size:18px;font-weight:900}
.x{border:0;background:var(--bg);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
.db{padding:4px 16px 16px;overflow:auto;max-height:calc(92vh - 130px)}
label.f{display:block;font-weight:700;font-size:13.5px;margin:12px 0 5px;color:var(--mut)}
.in{width:100%;border:1.5px solid var(--bd);background:var(--bg);border-radius:12px;padding:10px 12px;outline:none}
.in:focus{border-color:var(--pr)}
textarea.in{min-height:70px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.sg{border:1.5px solid var(--bd);background:var(--bg);border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:14px}
.sg.on{background:var(--pr);border-color:var(--pr);color:#fff}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer;background:var(--pr);color:#fff;font-size:15px}
.btn.s{background:var(--bg);color:var(--tx);border:1.5px solid var(--bd)}
.btn.d{background:#fee2e2;color:#991b1b}
.btn.b{width:100%}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.acts .btn{flex:1;min-width:120px}
.photo{display:flex;gap:12px;align-items:center;margin-top:6px}
.pv2{width:110px;height:72px;font-size:28px;cursor:pointer}.pv{cursor:pointer}
.ph2row{display:flex;gap:12px;align-items:center;margin-top:10px}
.pv{flex:none;width:110px;height:110px;border-radius:16px;background:#e2efec center/cover;display:flex;align-items:center;justify-content:center;font-size:40px;border:1.5px dashed var(--bd)}
.ai{background:#ecfeff;border:1px solid #a5f3fc;color:#155e75;border-radius:12px;padding:9px 12px;margin-top:10px;font-size:13.5px;line-height:1.5}
:root[data-theme=dark] .ai{background:#0e2a30;border-color:#1c5560;color:#a5eef7}
.big{width:100%;border-radius:16px;max-height:260px;object-fit:contain;background:#e2efec;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:15px}
.kv span:first-child{color:var(--mut)}
.desc{background:var(--bg);border-radius:12px;padding:10px 12px;margin:10px 0;line-height:1.55;font-size:15px}
.note{font-size:12.5px;color:var(--mut);margin-top:8px;line-height:1.5}
.log{font-size:13.5px;color:var(--mut);margin-top:6px}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#10231f;color:#fff;border-radius:999px;padding:10px 18px;font-weight:700;z-index:50;display:none;max-width:90vw;text-align:center}
.spin{width:22px;height:22px;border:3px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.login{max-width:360px;margin:60px auto;text-align:center}
@media print{header,.fab,.locs,.bar{display:none}}
</style>
</head>

<header>
  <div class="hrow"><button class="hb" id="hbk" onclick="goBack()" data-en="← Shopping">→ דף הבית</button><h1 data-en="💊 Home medicines">💊 תרופות בבית</h1><button class="hb" id="mm" title="מיקומים">📍</button></div>
  <div class="sum" id="sum"></div>
</header>
<main id="M"><div class="empty">…</div></main>
<button class="fab" id="fab" title="הוספת תרופה" aria-label="הוספת תרופה">＋</button>

<!-- הוספה / עריכה -->
<dialog id="ed">
  <div class="dh"><b id="edt">תרופה חדשה</b><button class="x" onclick="$('ed').close()">✕</button></div>
  <div class="db">
    <div class="photo">
      <div class="pv" id="pv" onclick="pick(1,'fgal')">💊</div>
      <div style="flex:1;display:flex;flex-direction:column;gap:8px">
        <button class="btn" onclick="pick(1,'fcam')" data-en="📷 Photo of the box">📷 צילום האריזה</button>
        <button class="btn s" onclick="pick(1,'fgal')" data-en="🖼️ From gallery">🖼️ מהגלריה</button>
      </div>
    </div>
    <div class="ph2row">
      <div class="pv pv2" id="pv2" onclick="pick(2,'fgal')">📅</div>
      <div style="flex:1;display:flex;gap:8px">
        <button class="btn s" style="flex:1" onclick="pick(2,'fcam')" data-en="📅 Photo of the date / back">📅 תמונה שנייה (תאריך / גב)</button>
        <button class="btn s" style="flex:none" onclick="pick(2,'fgal')" title="מהגלריה">🖼️</button>
      </div>
    </div>
    <input type="file" id="fcam" accept="image/*" capture="environment" hidden>
    <input type="file" id="fgal" accept="image/*" hidden>
    <div class="ai" id="aiMsg" hidden></div>
    <label class="f" data-en="Name in Hebrew">שם בעברית</label><input class="in" id="fhe" placeholder="למשל: אקמול 500 מ״ג">
    <label class="f" data-en="Name in English">שם באנגלית</label><input class="in" id="fen" dir="ltr" style="text-align:right" placeholder="e.g. Acamol 500 mg">
    <label class="f" data-en="What it is and what it's for">מה זה ולמה משתמשים</label><textarea class="in" id="fdesc" placeholder="הסבר קצר" data-enp="Short explanation"></textarea>
    <label class="f" data-en="Where is it kept">איפה זה נמצא</label>
    <div class="row"><select class="in" id="floc"></select><input class="in" id="floc2" placeholder="שם מקום חדש" data-enp="New place name" hidden></div>
    <label class="f" data-en="Type">סוג</label>

    <label class="f" data-en="Expiry date (as printed on the box)">תאריך תפוגה (כפי שמודפס על האריזה)</label><input class="in" type="date" id="fexp">
    <div id="qtyBox">
      <label class="f" id="qtyL">כמות שנשארה</label>
      <div class="row"><input class="in" type="number" inputmode="decimal" min="0" id="fqty" placeholder="כמות" data-enp="Amount"><input class="in" id="funit" placeholder="יחידה (טבליות, מ״ל…)" data-enp="Unit (tablets, ml…)"></div>
      <label class="f" data-en="Alert when down to (optional)">להתריע כשנשאר עד (אופציונלי)</label><input class="in" type="number" inputmode="decimal" min="0" id="flow" placeholder="למשל 4" data-enp="e.g. 4">
    </div>
    <div id="openBox">
      <label class="f" data-en="Date opened">תאריך פתיחה (למוצר שנפתח)</label><input class="in" type="date" id="fopen">
      <label class="f" data-en="Good for after opening">תוקף אחרי פתיחה</label>
      <div class="row"><input class="in" type="number" inputmode="decimal" min="0" id="faftN" placeholder="מספר" data-enp="Number"><select class="in" id="faftU"><option value="m" data-en="months">חודשים</option><option value="d" data-en="days">ימים</option></select></div>
      <div class="note" data-en="The expiry used is the earlier of the printed date and the opening date plus this period.">התוקף שנספר הוא המוקדם מבין התוקף שעל האריזה לבין תאריך הפתיחה + התקופה הזאת.</div>
    </div>
    <label class="f" data-en="Note">הערה</label><input class="in" id="fnote" placeholder="אופציונלי" data-enp="Optional">
    <div class="acts"><button class="btn" id="fsave" data-en="Save">שמירה</button><button class="btn d" id="fdel" hidden data-en="Delete">מחיקה</button></div>
    <div class="note" data-en="Medicine info is general only, not a substitute for medical advice or the leaflet.">מידע על התרופה הוא כללי בלבד ולא תחליף לייעוץ רפואי או להוראות האריזה.</div>
  </div>
</dialog>

<!-- פרטי תרופה -->
<dialog id="dt">
  <div class="dh"><b id="dtt"></b><button class="x" onclick="$('dt').close()">✕</button></div>
  <div class="db" id="dtb"></div>
</dialog>

<!-- מיקומים -->
<dialog id="lcd">
  <div class="dh"><b data-en="📍 Places">📍 מיקומים</b><button class="x" onclick="$('lcd').close()">✕</button></div>
  <div class="db"><div id="lcl"></div><div class="row" style="margin-top:10px"><input class="in" id="lcn" placeholder="מקום חדש (למשל: ארון בסלון)" data-enp="New place (e.g. living room cabinet)"><button class="btn" style="flex:none" onclick="addLoc()" data-en="Add">הוספה</button></div></div>
</dialog>
<div id="toast"></div>

<script src="presence.js"></script><script>dbdPresence('meds')</script>
<script>
const CLOUD='https://script.google.com/macros/s/AKfycbw_ZAnKnbqY_G0pRA186ylvFoUOpEVtL9rHYEDJGtfmcX2eYlAzIIamDschjgnKCXtuXw/exec';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lg=k=>{try{return localStorage.getItem(k)||''}catch(e){return''}};
const lp=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const sg=k=>{try{return sessionStorage.getItem(k)||''}catch(e){return''}};
const TYPES={pills:['💊','כדורים / כמוסות','Pills / capsules'],liquid:['🧴','נוזל / טיפות','Liquid / drops'],cream:['🧴','משחה / קרם','Ointment / cream'],other:['📦','אחר','Other']};
const tName=t=>EN?t[2]:t[1];
const DEF_LOCS=['מטבח','שירותי הורים','שירותי ילדים'];
/* אנגלית: מי שנכנסה עם קוד הקניות באנגלית רואה את האפליקציה באנגלית (הנתונים עצמם משותפים) */
const EN=lg('shop_lang')==='en';
const T=(h,e)=>EN?e:h;
const LOC_EN={'מטבח':'Kitchen','שירותי הורים':"Parents' bathroom",'שירותי ילדים':"Kids' bathroom"};
const locName=l=>EN&&LOC_EN[l]?LOC_EN[l]:l;
function goBack(){if(EN)location.href='shopping.html';else goHome()}
if(EN){document.documentElement.lang='en';document.documentElement.dir='ltr';document.title='Home medicines';
  document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset.en);
  document.querySelectorAll('[data-enp]').forEach(e=>e.placeholder=e.dataset.enp);}
let aiInfo=null,items=[],locs=DEF_LOCS.slice(),pw='',ai=null,fLoc='',fSt='',q='',cur=null,photoNew='',thNew='',photo2New='',th2New='',bigs=['',''],slot=1,queue=[];
function pick(n,inp){slot=n;$(inp).click()}
try{items=JSON.parse(lg('meds_items')||'[]');locs=JSON.parse(lg('meds_locs')||'null')||locs;queue=JSON.parse(lg('meds_queue')||'[]')}catch(e){}

/* ---------- תאריכים ---------- */
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const todayMs=()=>{const n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())};
const dMs=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?Date.UTC(+m[1],+m[2]-1,+m[3]):null};
const fmt=ms=>{const d=new Date(ms);return String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/'+d.getUTCFullYear()};
function eff(it){
  let e=dMs(it.exp);const o=dMs(it.opened);
  if(o!=null&&it.aft&&+it.aft.n>0){const d=new Date(o);if(it.aft.u==='d')d.setUTCDate(d.getUTCDate()+Math.round(+it.aft.n));else d.setUTCMonth(d.getUTCMonth()+Math.round(+it.aft.n));if(e==null||d.getTime()<e)e=d.getTime()}
  return e;
}
function st(it){ /* סטטוס תוקף */
  const e=eff(it);if(e==null)return{k:'ok',t:T('ללא תוקף','No expiry'),days:null,e:null};
  const days=Math.round((e-todayMs())/864e5);
  if(days<0)return{k:'x',t:EN?'Expired '+(-days)+(days===-1?' day':' days')+' ago':'פג לפני '+(-days===1?'יום':(-days)+' ימים'),days,e};
  if(days===0)return{k:'x',t:T('פג היום','Expires today'),days,e};
  if(days<=7)return{k:'o',t:EN?days+(days===1?' day left':' days left'):'עוד '+(days===1?'יום':days+' ימים'),days,e};
  if(days<=30)return{k:'w',t:EN?days+' days left':'עוד '+days+' ימים',days,e};
  return{k:'ok',t:T('עד ','Until ')+fmt(e).slice(3),days,e};
}

/* ---------- ענן ---------- */
function toast(t,ms){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms||2600)}
async function api(o){
  const r=await fetch(CLOUD,{method:'POST',body:JSON.stringify(Object.assign({app:'meds',password:pw},o))}).then(r=>r.json());
  return r;
}
function saveLocal(){lp('meds_items',JSON.stringify(items));lp('meds_locs',JSON.stringify(locs));lp('meds_queue',JSON.stringify(queue))}
function apply(r){
  if(!r||!r.ok)return;
  if(r.items)items=r.items;if(r.locs)locs=r.locs;if(r.ai!==undefined)ai=r.ai;saveLocal();
}
let flushing=null;
function flush(){if(!flushing)flushing=flush1().finally(()=>{flushing=null});return flushing}
async function flush1(){
  while(queue.length){
    const o=queue[0];let r;
    try{r=await api(o)}catch(e){return false}
    if(r&&r.error==='password'){await needLogin(T('הסיסמה לא נכונה','Wrong password'));return false}
    if(!r||!r.ok)return false;
    queue.shift();saveLocal();
    if(o.op==='save'&&r.item){const i=items.findIndex(x=>x.id===o.item.id||x.id===r.item.id);if(i>=0)items[i]=Object.assign(items[i],{ph:r.item.ph,id:r.item.id});saveLocal()}
  }
  return true;
}
async function sync(){
  if(!pw)return;
  if(!(await flush()))return;
  try{const r=await api({op:'list'});
    if(r.error==='password'){await needLogin(T('הסיסמה לא נכונה','Wrong password'));return}
    if(r.error==='locked'){toast(T('🔒 יותר מדי ניסיונות. נסה שוב בעוד רבע שעה','🔒 Too many attempts. Try again in 15 minutes'));return}
    apply(r);render()}catch(e){}
}
function push(o){queue.push(o);saveLocal();flush().then(ok=>{if(ok)sync();else toast(T('נשמר במכשיר, יסונכרן כשיהיה חיבור','Saved on this device, will sync when online'),3200)})}

/* ---------- כניסה ---------- */
function needLogin(msg){
  return new Promise(res=>{
    $('M').innerHTML=`<div class="login"><h2>${T('💊 תרופות בבית','💊 Home medicines')}</h2><p class="note">${T('הקלד את הסיסמה','Enter your password')}</p><input class="in" id="lpw" type="password" autocomplete="current-password" style="text-align:center;font-size:20px"><p style="color:var(--no);font-weight:700;min-height:22px">${esc(msg||'')}</p><button class="btn b" id="lgo">${T('כניסה','Sign in')}</button></div>`;
    $('lpw').focus();
    const go=async()=>{const v=$('lpw').value.trim();if(!v)return;pw=v;lp('meds_pw',v);$('M').innerHTML='<div class="empty">'+T('מתחבר…','Connecting…')+'</div>';await sync();render();res()};
    $('lgo').onclick=go;$('lpw').onkeyup=e=>{if(e.key==='Enter')go()};
  });
}

/* ---------- תצוגה ---------- */
function visible(){
  const k=q.trim().toLowerCase();
  return items.filter(it=>(!fLoc||it.loc===fLoc)&&(!fSt||(fSt==='x'?st(it).k==='x':fSt==='s'?['o','w'].includes(st(it).k):st(it).k===fSt)))
    .filter(it=>!k||[it.he,it.en,it.desc,it.loc,it.note].join(' ').toLowerCase().includes(k))
    .sort((a,b)=>{const x=st(a).e,y=st(b).e;return(x==null)-(y==null)||x-y||String(a.he).localeCompare(String(b.he),'he')});
}
function render(){

function useIt(){

function resize(file,max,qual){
  return new Promise((res,rej)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',qual))};
    img.onerror=()=>{URL.revokeObjectURL(u);rej()};img.src=u;
  });
}
async function onPhoto(e){
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const [big,mid,th]=await Promise.all([resize(f,1400,.82),resize(f,900,.7),resize(f,160,.6)]);
    if(slot===2){photo2New=mid;th2New=th;bigs[1]=big;$('pv2').style.backgroundImage=`url(${th})`;$('pv2').textContent=''}
    else{photoNew=mid;thNew=th;bigs[0]=big;$('pv').style.backgroundImage=`url(${th})`;$('pv').textContent=''}
    identify(bigs.filter(Boolean));
  }catch(x){showAi(T('לא הצלחתי לקרוא את התמונה','Could not read the image'),true)}
}

function urlToJpeg(u,max,q){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};i.onerror=rej;i.src=u})}
async function seedRun(){
  if(!pw)return;
  for(const sd of SEEDS){
    const ex=items.find(x=>x.id===sd.id);
    /* כבר נוסף: משלימים רק מיקום שעוד לא נקבע (לא דורסים עריכה) */
    if(ex){if(!ex.loc&&sd.loc){ex.loc=sd.loc;saveItem(ex);render()}lp('meds_seed_'+sd.id,'1');continue}
    if(lg('meds_seed_'+sd.id))continue;
    try{
      const [photo,th,photo2,th2]=await Promise.all([urlToJpeg(sd.img,900,.8),urlToJpeg(sd.img,160,.6),sd.img2?urlToJpeg(sd.img2,900,.8):'',sd.img2?urlToJpeg(sd.img2,160,.6):'']);
      const it=Object.assign({},sd,{th});if(th2)it.th2=th2;delete it.img;delete it.img2;
      items.push(it);saveItem(it,photo,photo2);lp('meds_seed_'+sd.id,'1');render();
    }catch(e){}
  }
}
