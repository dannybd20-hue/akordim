<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>דני בן דוד</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#312e81">
<link rel="icon" href="icons/apps-192.png">
<link rel="apple-touch-icon" href="icons/apps-apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="דני בן דוד">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1e293b;--mut:#64748b;--bd:#e2e8f0;--pr:#0284c7;--in:#f8fafc;--ib:#cbd5e1;--err:#e11d48}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#020617;--card:#0f172a;--tx:#f8fafc;--mut:#94a3b8;--bd:#1e293b;--in:#1e293b;--ib:#334155}}
:root[data-theme=dark]{--bg:#020617;--card:#0f172a;--tx:#f8fafc;--mut:#94a3b8;--bd:#1e293b;--in:#1e293b;--ib:#334155}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Heebo,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 16px 32px;position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.55;pointer-events:none}
body::before{width:420px;height:420px;top:-160px;right:-120px;background:radial-gradient(circle,#818cf8,transparent 70%)}
body::after{width:380px;height:380px;bottom:-160px;left:-120px;background:radial-gradient(circle,#38bdf8,transparent 70%)}
.top{width:100%;max-width:880px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:44px 0 30px}
.logo{width:76px;height:76px;border-radius:22px;box-shadow:0 14px 34px #312e8155;margin-bottom:18px}
.hello{margin:0;font:900 32px/1.15 Rubik,Heebo,sans-serif;letter-spacing:-.5px}
.hello span{background:linear-gradient(90deg,#4f46e5,#0ea5e9);-webkit-background-clip:text;background-clip:text;color:transparent}
.date{margin:10px 0 0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:var(--mut)}
.date b{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:4px 12px;font-weight:600}
.sec{width:100%;max-width:880px;margin:0 0 12px;font:800 14px Rubik,Heebo,sans-serif;color:var(--mut);letter-spacing:.3px}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;width:100%;max-width:880px}
.app{--c:#0ea5e9;position:relative;overflow:hidden;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:22px 18px 18px;text-align:start;cursor:pointer;font:inherit;color:inherit;box-shadow:0 6px 24px #0f172a0d;transition:transform .2s,box-shadow .2s,border-color .2s;display:flex;flex-direction:column;align-items:flex-start;min-height:150px}
.app::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c);opacity:.85}
.app::after{content:"";position:absolute;width:160px;height:160px;top:-70px;left:-60px;border-radius:50%;background:var(--c);opacity:.08;transition:.3s}
.app:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 45%,transparent);box-shadow:0 14px 34px color-mix(in srgb,var(--c) 22%,transparent)}
.app:hover::after{opacity:.16;transform:scale(1.15)}
.app:active{transform:scale(.98)}
.app:has(.ch){--c:#0ea5e9}.app:has(.ms){--c:#16a34a}.app:has(.tr){--c:#8d6e63}.app:has(.sp){--c:#db2777}
.ic{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;margin-bottom:14px;box-shadow:0 8px 18px color-mix(in srgb,var(--c) 35%,transparent)}
.ic.ch{background:linear-gradient(135deg,#38bdf8,#0284c7)}
.ic.tr{background:linear-gradient(135deg,#bc9a85,#795548)}
.ic.sp{background:linear-gradient(135deg,#f472b6,#be185d)}
.ic.ms{background:linear-gradient(135deg,#4ade80,#15803d)}
.app b{display:block;font:800 18px Rubik,Heebo,sans-serif;margin-bottom:4px}
.app span{font-size:13px;color:var(--mut);line-height:1.4}
.lock{margin-top:auto;padding-top:12px;font-size:11.5px;font-weight:700;color:var(--mut)}
.app .go{position:absolute;top:22px;left:18px;width:32px;height:32px;border-radius:99px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c);font-size:17px;font-style:normal;font-weight:900;transition:.2s}
.app:hover .go{transform:translateX(-3px)}
.gate{width:100%;max-width:360px;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:24px 20px;box-shadow:0 10px 30px #312e811a;text-align:center}
.rem{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;color:var(--mut);margin:4px 0 6px;cursor:pointer}
.rem input{width:18px;height:18px;margin:0;accent-color:#4f46e5}
.live{position:fixed;top:12px;inset-inline-start:12px;z-index:5;display:flex;align-items:center;gap:7px;flex-wrap:wrap;max-width:230px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:7px 12px;font:inherit;font-size:13px;font-weight:700;color:var(--tx);box-shadow:0 6px 18px #0f172a14;cursor:pointer;text-align:start}
.live[hidden]{display:none}
.live i{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 #22c55e88;animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px #22c55e00}100%{box-shadow:0 0 0 0 #22c55e00}}
.live span{display:none;width:100%;font-size:12px;font-weight:600;color:var(--mut);line-height:1.6}
.live.open span{display:block}
.gt{margin:0 0 14px;font:800 17px Rubik,Heebo,sans-serif}
.gate .pw{margin-bottom:6px}
button.b.big{width:100%;padding:12px;font-size:16px;border-radius:14px;margin-top:6px;background:linear-gradient(90deg,#4f46e5,#0ea5e9);border:0;color:#fff}
button.out{display:block;margin:22px auto 0}
.app[hidden],section[hidden]{display:none!important}
footer{margin-top:34px;font-size:12px;color:var(--mut);text-align:center}
@media (max-width:440px){.apps{grid-template-columns:1fr 1fr;gap:10px}.app{padding:18px 14px 14px;min-height:168px;border-radius:20px}.app b{font-size:16px}.app span{font-size:12px}.ic{width:48px;height:48px;font-size:23px}.hello{font-size:27px}.app .go{display:none}}
dialog{border:0;border-radius:18px;padding:22px;width:min(340px,calc(100% - 32px));background:var(--card);color:var(--tx);box-shadow:0 20px 40px #0004}
dialog::backdrop{background:#0f172a99;backdrop-filter:blur(3px)}
dialog h2{margin:0 0 6px;font:800 19px Rubik,Heebo,sans-serif}
.hint{font-size:13px;color:var(--mut);margin:0 0 12px}
input{width:100%;font:inherit;font-size:16px;text-align:center;padding:10px;border-radius:12px;border:1px solid var(--ib);background:var(--in);color:var(--tx);margin-bottom:8px;outline:none}
input:focus{box-shadow:0 0 0 2px #0ea5e9}
.err{color:var(--err);font-size:13px;margin:2px 0 8px;display:none}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
button.b{font:inherit;font-weight:700;font-size:14px;padding:9px 16px;border-radius:12px;border:1px solid var(--ib);background:var(--in);color:var(--tx);cursor:pointer}
button.pr{background:var(--pr);border-color:var(--pr);color:#fff}
.pw{position:relative;margin-bottom:8px}
.pw input{margin:0;padding-inline:44px}
.eye{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;padding:0;border:0;border-radius:10px;background:none;font-size:18px;line-height:1;cursor:pointer;opacity:.75}
.eye:hover{opacity:1;background:#0284c71a}
.link{background:none;border:0;color:var(--pr);font:inherit;font-size:12px;cursor:pointer;padding:0;margin-top:10px;text-decoration:underline}
</style>
</head>
<body>
<button class="live" id="live" hidden onclick="this.classList.toggle('open')"><i></i><b id="liveN"></b><span id="liveD"></span></button>
<header class="top">
  <img class="logo" src="icons/apps-192.png" alt="">
  <h1 class="hello"><span id="greet">שלום</span></h1>
  <p class="date" id="date"></p>
</header>
<section class="gate" id="lockv">
  <p class="gt">🔒 הזן סיסמה כדי להיכנס</p>
  <div class="pw"><input id="p1" type="password" autocomplete="current-password" placeholder="סיסמה"><button type="button" class="eye" onclick="eye(this)" title="הצג סיסמה">👁️</button></div>
  <p class="err" id="er"></p>
  <label class="rem"><input type="checkbox" id="rem" checked> 📱 לזכור במכשיר הזה (לא לבקש שוב)</label>
  <button class="b pr big" id="ok" onclick="submit()">כניסה</button>
</section>

<section id="appsv" hidden>
<p class="sec">האפליקציות שלי</p>
<div class="apps">
  <button class="app" data-app="chords" onclick="enter('chords')"><i class="go" aria-hidden="true">←</i><div class="ic ch">♬</div><b>ספריית אקורדים</b><span>שירים, טרנספוזיציה וקאפו</span></button>
  <button class="app" data-app="maaser" onclick="enter('maaser')"><i class="go" aria-hidden="true">←</i><div class="ic ms">₪</div><b>מעשר כספי</b><span>חישוב ומעקב מעשרות</span></button>
  <button class="app" data-app="tromot" onclick="enter('tromot')"><i class="go" aria-hidden="true">←</i><div class="ic tr">🕍</div><b>תרומות בית כנסת</b><span>מי תרם, על מה, ומה שומש</span></button>
  <button class="app" data-app="shopping" onclick="enter('shopping')"><i class="go" aria-hidden="true">←</i><div class="ic sp">🛒</div><b>קניות לבית</b><span>רשימה משותפת לכל המשפחה</span></button>
</div>
<button class="b out" onclick="logout()">🔒 יציאה</button>
</section>
<footer>© דני בן דוד</footer>

<script>
/* כניסה אחת לאתר: הסיסמה שמוקלדת קובעת לאילו אפליקציות יש גישה. נשמרים כאן רק הגיבובים.
   הגישה נשמרת ב-sessionStorage עד סגירת הדפדפן, וכל אפליקציה בודקת את הסימון gate_<שם> שלה. */
const PAGES={chords:'chords.html',maaser:'maaser.html',tromot:'tromot.html',shopping:'shopping.html'};
const ACCESS={
  'f88d20e9aaa147427706f242d11b143befcf2038efdd026d1e890fea9ce1535c':['tromot'],   // 1234
  '4dae21a70492747b3bb2d310f2ae89ed81c9eff99e61d6e3e53d4e19abd24f9c':['chords'],                              // 114477
  '1e2a0c4093555199db513fd138cc9268faaf441ccaa9090fe3a485f042891700':['shopping'],                            // 0504277237
  'd8acc45287fb852ef048950cf2edfc575614ffa5437f90d6780ae251058d723a':Object.keys(PAGES) // הסיסמה הראשית
};
const $=id=>document.getElementById(id);

/* כפתור העין: מציג או מסתיר את הסיסמה שמקלידים */
function eye(b,show){const i=b.previousElementSibling;show=show===undefined?i.type==='password':show;i.type=show?'text':'password';b.textContent=show?'🙈':'👁️';b.title=show?'הסתר סיסמה':'הצג סיסמה'}
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sget(k){try{return sessionStorage.getItem(k)}catch(e){return null}}
function sput(k,v){try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}}
function lput(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
/* פותח גישה בדפדפן הנוכחי: הסימונים שהאפליקציות בודקות */
function grant(A,pw){sput('hub_access',JSON.stringify(A));A.forEach(a=>sput('gate_'+a,'1'));if(pw&&A.includes('shopping'))sput('hub_pw',pw)}
async function hash(s){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('dbd-gate:'+s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function access(){try{return JSON.parse(sget('hub_access'))||[]}catch(e){return[]}}
function enter(a){if(access().includes(a))location.href=PAGES[a]}
/* מספר לאותיות עבריות: 9 → ט׳, 787 → תשפ״ז */
function gem(n){
  const L=[[400,'ת'],[300,'ש'],[200,'ר'],[100,'ק'],[90,'צ'],[80,'פ'],[70,'ע'],[60,'ס'],[50,'נ'],[40,'מ'],[30,'ל'],[20,'כ'],[10,'י'],[9,'ט'],[8,'ח'],[7,'ז'],[6,'ו'],[5,'ה'],[4,'ד'],[3,'ג'],[2,'ב'],[1,'א']];
  let r='';for(const[v,c]of L)while(n>=v){if(n===15||n===16){r+=n===15?'טו':'טז';n=0;break}r+=c;n-=v}
  return r.length>1?r.slice(0,-1)+'״'+r.slice(-1):r+'׳';
}
function err(t){const e=$('er');e.textContent=t;e.style.display=t?'block':'none'}
function show(){
  const A=access();
  $('lockv').hidden=A.length>0;$('appsv').hidden=!A.length;
  document.querySelectorAll('.app').forEach(b=>b.hidden=!A.includes(b.dataset.app));
  if(!A.length)setTimeout(()=>$('p1').focus(),50);
}
async function submit(){
  const v=$('p1').value.trim();err('');
  if(!v){err('נא להקליד סיסמה');return}
  const A=ACCESS[await hash(v)];
  if(!A){err('סיסמה שגויה');$('p1').select();return}
  /* אפליקציית הקניות מתחברת לענן עם הסיסמה המשפחתית; מנסים קודם את מה שהוקלד כאן */
  grant(A,v);
  /* "לזכור במכשיר": הגישה נשמרת גם אחרי סגירת הדפדפן, עד שלוחצים יציאה */
  if($('rem').checked){lput('hub_access',JSON.stringify(A));lput('hub_pw',A.includes('shopping')?v:null)}
  sput('hub_seen','1');
  $('p1').value='';
  if(A.length===1){location.href=PAGES[A[0]];return}
  show();
}
function logout(){
  lput('hub_access',null);lput('hub_pw',null);lput('tromot_names',null);
  sput('hub_access',null);sput('hub_pw',null);Object.keys(PAGES).forEach(a=>sput('gate_'+a,null));show();
}
$('p1').addEventListener('keyup',e=>{if(e.key==='Enter')submit()});

(function(){
  const t=get('akordim_theme');if(t)document.documentElement.dataset.theme=t;
  /* ברכה לפי שעה, ותאריך לועזי ועברי */
  const now=new Date(),h=now.getHours();
  $('greet').textContent=h<5?'לילה טוב':h<12?'בוקר טוב':h<17?'צהריים טובים':h<21?'ערב טוב':'לילה טוב';
  const dd=[now.toLocaleDateString('he-IL',{weekday:'long'}),now.toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'})];
  try{
    const P=new Intl.DateTimeFormat('he-IL-u-ca-hebrew',{day:'numeric',month:'long',year:'numeric'}).formatToParts(now),v=t=>(P.find(p=>p.type===t)||{}).value;
    dd.push(gem(+v('day'))+' ב'+v('month').replace(/^ב/,'')+' '+gem(+v('year')%1000));
  }catch(e){}
  $('date').innerHTML=dd.map(x=>'<b>'+x+'</b>').join('');
  /* גישה שנשמרה במכשיר: משחזרים אותה, ונכנסים ישר לאפליקציה שביקשו או לאפליקציה היחידה (פעם אחת בכל פתיחה) */
  if(!access().length){let A=[];try{A=JSON.parse(get('hub_access'))||[]}catch(e){}if(A.length)grant(A,get('hub_pw'))}
  const A=access(),want=new URLSearchParams(location.search).get('open');
  if(A.includes(want)){location.replace(PAGES[want]);return}
  if(A.length===1&&!sget('hub_seen')){sput('hub_seen','1');location.replace(PAGES[A[0]]);return}
  sput('hub_seen','1');
  show();
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<script src="presence.js"></script>
<script>
/* כמה מכשירים מחוברים עכשיו, ובאיזו אפליקציה (לחיצה על התווית מציגה פירוט) */
const LIVE_NAMES={home:'בדף הבית',chords:'באקורדים',maaser:'במעשר',tromot:'בתרומות',shopping:'בקניות'};
dbdPresence('home',r=>{
  const n=r.total||0;if(!n)return;
  $('live').hidden=false;$('liveN').textContent=n===1?'מחובר אחד עכשיו':n+' מחוברים עכשיו';
  $('liveD').innerHTML=Object.keys(LIVE_NAMES).filter(k=>r.counts[k]).map(k=>LIVE_NAMES[k]+': '+r.counts[k]).join('<br>');
});
</script>
</body>
</html>
